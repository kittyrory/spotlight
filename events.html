<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight | Events</title>
    <script>
      // apply saved theme immediately to avoid a flash of the wrong theme.
      // (this page has no toggle button of its own - it just follows
      // whatever was last picked from Feed.html)
      (function () {
        var saved = localStorage.getItem("spotlight-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
    <style>
      :root, [data-theme="dark"] {
      --red: #e25555;
      --dy: 0px;
      --medium: #f2c265;
      --card-shadow: rgba(0, 0, 0, 0.45);
      --event-glow-1: #f5c451;
      --event-glow-2: #b98b2c;
      --event-glow-3: #6b5320;
      --event-glow-4: #8a6d1d;
      --event-glow-opacity: 0.55;
      --submit-border: rgba(255, 255, 255, 0.25);
      --star-active-border: var(--gold-dark);
      --surface-soft: #1e1c17;
      --dx: 0px;
      --choice: var(--surface-1);
      --submit-idle-bg: var(--surface-1);
      --easy: #6fcf97;
      }

      [data-theme="light"] {
      --red: #e25555;
      --dy: 0px;
      --medium: #c9891f;
      --card-shadow: rgba(0, 0, 0, 0.15);
      --event-glow-1: rgba(245, 196, 81, 0.42);
      --event-glow-2: rgba(224, 184, 78, 0.3);
      --event-glow-3: rgba(201, 154, 46, 0.2);
      --event-glow-4: rgba(232, 194, 91, 0.24);
      --event-glow-opacity: 0.48;
      --submit-border: var(--button-border);
      --star-active-border: var(--gold-light);
      --surface-soft: #faf6ea;
      --dx: 0px;
      --choice: var(--card);
      --submit-idle-bg: var(--surface-1);
      --easy: #2f9e64;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }

      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .bg-glow span {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: var(--event-glow-opacity);
        animation: drift 22s ease-in-out infinite alternate;
      }
      .bg-glow span:nth-child(1) {
        width: 420px;
        height: 420px;
        background: radial-gradient(
          circle,
          var(--event-glow-1),
          transparent 70%
        );
        top: -120px;
        left: -100px;
        animation-duration: 26s;
      }
      .bg-glow span:nth-child(2) {
        width: 360px;
        height: 360px;
        background: radial-gradient(
          circle,
          var(--event-glow-2),
          transparent 70%
        );
        bottom: -100px;
        right: -80px;
        animation-duration: 30s;
        animation-delay: -6s;
      }
      .bg-glow span:nth-child(3) {
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          var(--event-glow-3),
          transparent 70%
        );
        top: 35%;
        right: 10%;
        animation-duration: 20s;
        animation-delay: -3s;
      }
      .bg-glow span:nth-child(4) {
        width: 260px;
        height: 260px;
        background: radial-gradient(
          circle,
          var(--event-glow-4),
          transparent 72%
        );
        bottom: 15%;
        left: 5%;
        animation-duration: 24s;
        animation-delay: -10s;
      }
      @keyframes drift {
        0% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(30px, -25px) scale(1.12);
        }
        100% {
          transform: translate(-20px, 20px) scale(0.96);
        }
      }
      body {
        background: var(--bg);
        position: relative;
        overflow-x: hidden;
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 18px 0 40px;
        transition:
          background-color 0.25s ease,
          color 0.25s ease;
      }
      .phone {
        width: 100%;
        max-width: 430px;
        padding: 0 18px;
        position: relative;
        z-index: 1;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 2px 20px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--card);
        border: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-dim);
        cursor: pointer;
        font-size: 18px;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .icon-btn:hover {
        background: var(--surface-hover);
        color: var(--ink);
      }

      .mode-switch {
        display: flex;
        gap: 6px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 999px;
        padding: 4px;
      }
      .mode-btn {
        border: none;
        background: transparent;
        color: var(--ink-dim);
        font-weight: 600;
        font-size: 12.5px;
        letter-spacing: 0.02em;
        padding: 7px 13px;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.18s ease;
      }
      .mode-btn.active {
        color: #0a0a0d;
      }
      .mode-btn[data-mode="easy"].active {
        background: var(--easy);
        box-shadow: 0 0 16px rgba(111, 207, 151, 0.5);
      }
      .mode-btn[data-mode="medium"].active {
        background: var(--medium);
        box-shadow: 0 0 16px rgba(242, 194, 101, 0.5);
      }
      .mode-btn[data-mode="hard"].active {
        background: var(--red);
        box-shadow: 0 0 16px rgba(242, 104, 95, 0.55);
      }

      .mode-sub {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin: -10px 0 16px;
      }

      .card {
        background: linear-gradient(
          180deg,
          var(--card) 0%,
          var(--surface-soft) 100%
        );
        border: 1.5px solid rgba(201, 154, 46, 0.32);
        border-radius: 22px;
        padding: 22px 20px 24px;
        position: relative;
        overflow: hidden;
        inset: 0;
        box-shadow:
          0 14px 34px var(--card-shadow),
          0 0 0 1px rgba(201, 154, 46, 0.06) inset;
        animation: rise 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.1);
        transition:
          box-shadow 0.4s ease,
          border-color 0.4s ease,
          background 0.25s ease;
      }

      .card.easy {
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.4),
          0 0 24px rgba(111, 207, 151, 0.12);
        border-color: rgba(111, 207, 151, 0.3);
      }
      .card.medium {
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.4),
          0 0 24px rgba(242, 194, 101, 0.12);
        border-color: rgba(242, 194, 101, 0.3);
      }
      .card.hard {
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.4),
          0 0 26px rgba(242, 104, 95, 0.16);
        border-color: rgba(242, 104, 95, 0.32);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card-shine {
        content: "";
        position: absolute;
        top: -60%;
        left: -45%;
        width: 50%;
        height: 220%;
        background: linear-gradient(
          75deg,
          transparent 35%,
          rgba(201, 154, 46, 0.22) 48%,
          transparent 60%
        );
        transform: rotate(8deg);
        pointer-events: none;
        opacity: 0;
      }
      .card-shine.play {
        animation: shineOnce 1.1s ease-out;
      }
      @keyframes shineOnce {
        0% {
          left: -60%;
          opacity: 1;
        }
        100% {
          left: 130%;
          opacity: 0;
        }
      }
      .sparkle {
        position: absolute;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 6px 1px rgba(201, 154, 46, 0.6);
        animation: twinkle 3.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.12;
          transform: scale(0.7);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.1);
        }
      }
      .card::before {
        content: "";
        position: absolute;
        top: -40%;
        right: -20%;
        width: 220px;
        height: 220px;
        background: radial-gradient(
          circle,
          rgba(201, 154, 46, 0.1),
          transparent 70%
        );
        pointer-events: none;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .card-tag {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--ink-dim);
        font-weight: 700;
        font-size: 12.5px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        background: rgba(201, 154, 46, 0.1);
        border: 1px solid rgba(201, 154, 46, 0.3);
        padding: 6px 12px 6px 10px;
        border-radius: 999px;
      }
      .card-tag .emoji {
        font-size: 15px;
      }
      .xp {
        font-weight: 800;
        font-size: 15px;
        text-align: right;
        display: flex;
        align-items: center;
        gap: 5px;
        letter-spacing: 0.01em;
      }
      .xp svg {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
      }
      .xp .range {
        display: block;
      }
      .xp.easy {
        color: var(--easy);
      }
      .xp.medium {
        color: var(--medium);
      }
      .xp.hard {
        color: var(--red);
      }

      .event-text {
        font-size: 18px;
        line-height: 1.55;
        font-weight: 500;
        color: var(--ink);
      }
      .event-text .mention {
        color: var(--gold);
        font-weight: 600;
      }
      .event-edit-area {
        width: 100%;
        background: var(--surface-soft);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        color: var(--ink);
        font-size: 16px;
        line-height: 1.5;
        padding: 12px;
        resize: vertical;
        min-height: 110px;
      }

      .action-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 16px 2px 22px;
      }
      .pill-btn {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--card);
        border: 1px solid var(--card-border);
        color: var(--ink-dim);
        font-weight: 600;
        font-size: 13.5px;
        padding: 9px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .pill-btn:hover {
        background: var(--surface-hover);
        color: var(--ink);
      }
      .pill-group {
        display: flex;
        gap: 10px;
      }
      .star-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--card);
        border: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-dim);
        font-size: 17px;
        cursor: pointer;
        transition:
          color 0.15s ease,
          background 0.15s ease;
      }
      .star-btn.active {
        color: var(--gold);
        background: var(--surface-hover);
        border-color: var(--star-active-border);
      }

      .choice {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--choice);
        border: 1.5px solid var(--border);
        color: var(--ink);
        font-size: 15.5px;
        line-height: 1.45;
        padding: 15px 18px 13px;
        border-radius: 16px;
        margin-bottom: 12px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          transform 0.1s ease;
      }
      .choice:hover {
        background: var(--surface-hover);
        transform: translateY(-1px);
      }
      .choice.selected {
        background: var(--gold-dim);
        border-color: var(--gold);
        box-shadow:
          0 0 0 1px rgba(201, 154, 46, 0.3),
          0 8px 18px rgba(201, 154, 46, 0.15);
      }
      .choice-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 9px;
      }
      .risk-range {
        font-size: 11.5px;
        color: var(--muted);
      }
      .risk-badge {
        font-weight: 700;
        font-size: 10.5px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 999px;
      }
      .risk-badge.safe {
        color: #0f2418;
        background: var(--easy);
        box-shadow: 0 0 10px rgba(111, 207, 151, 0.35);
      }
      .risk-badge.bold {
        color: #2b2005;
        background: var(--medium);
        box-shadow: 0 0 10px rgba(242, 194, 101, 0.35);
      }
      .risk-badge.wild {
        color: #2b0d0a;
        background: var(--red);
        box-shadow: 0 0 10px rgba(242, 104, 95, 0.4);
      }

      .write-own {
        text-align: center;
        color: var(--gold);
        font-weight: 600;
        font-size: 15px;
        padding: 8px 0 4px;
        cursor: pointer;
      }
      .own-textarea {
        width: 100%;
        margin-top: 10px;
        background: var(--surface-soft);
        border: 1px solid var(--border);
        border-radius: 14px;
        color: var(--ink);
        font-size: 15.5px;
        padding: 14px;
        min-height: 90px;
        resize: vertical;
      }

      .submit-bar {
        display: flex;
        justify-content: flex-end;
        margin-top: 18px;
      }
      .submit-btn {
        background: var(--submit-idle-bg);
        color: var(--ink-faint);
        font-weight: 700;
        font-size: 15px;
        padding: 13px 30px;
        border-radius: 999px;
        border: 1px solid var(--submit-border);
        cursor: not-allowed;
        transition:
          background 0.2s ease,
          color 0.2s ease,
          transform 0.1s ease;
      }
      .submit-btn.ready {
        background: var(--gold);
        color: #1a1408;
        border-color: var(--submit-border);
        cursor: pointer;
        animation: readyPulse 2.2s ease-in-out infinite;
      }
      .submit-btn.ready:active {
        transform: scale(0.97);
      }
      @keyframes readyPulse {
        0%,
        100% {
          box-shadow: 0 0 0 rgba(201, 154, 46, 0.5);
        }
        50% {
          box-shadow: 0 0 18px rgba(201, 154, 46, 0.65);
        }
      }

      .toast {
        text-align: center;
        font-weight: 700;
        font-size: 15px;
        margin-top: 14px;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .toast.show {
        opacity: 1;
      }
      .toast.gain {
        color: var(--easy);
      }
      .toast.loss {
        color: var(--red);
      }

      .choice.disabled {
        opacity: 0.45;
        pointer-events: none;
      }
      .submit-btn.locked {
        background: var(--submit-idle-bg);
        color: var(--ink-faint);
        cursor: not-allowed;
      }
      .write-own.disabled {
        opacity: 0.4;
        pointer-events: none;
      }

      /* ---------- outcome modal ---------- */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(3, 3, 5, 0.8);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-card {
        position: relative;
        background: linear-gradient(
          165deg,
          var(--card) 0%,
          var(--surface-soft) 60%,
          var(--surface-soft) 100%
        );
        border: 1.5px solid rgba(201, 154, 46, 0.35);
        border-radius: 24px;
        padding: 30px 24px 24px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        overflow: hidden;
        box-shadow:
          0 20px 50px var(--card-shadow),
          0 0 0 1px rgba(201, 154, 46, 0.06) inset;
        transform: translateY(16px) scale(0.95);
        transition:
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          background 0.25s ease;
      }
      .modal-overlay.show .modal-card {
        transform: none;
      }
      .modal-overlay.show .modal-card.gain {
        animation: cardGain 0.5s ease;
      }
      .modal-overlay.show .modal-card.loss {
        animation: cardLoss 0.45s ease;
      }
      @keyframes cardGain {
        0% {
          box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.55),
            0 0 0 rgba(245, 196, 81, 0);
        }
        40% {
          box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.55),
            0 0 40px rgba(245, 196, 81, 0.35);
        }
        100% {
          box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.35),
            0 0 0 1px rgba(201, 154, 46, 0.06) inset;
        }
      }
      @keyframes cardLoss {
        0%,
        100% {
          transform: none;
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(5px);
        }
        60% {
          transform: translateX(-3px);
        }
        80% {
          transform: translateX(2px);
        }
      }
      .modal-shine {
        position: absolute;
        top: -60%;
        left: -45%;
        width: 50%;
        height: 220%;
        background: linear-gradient(
          75deg,
          transparent 35%,
          rgba(201, 154, 46, 0.22) 48%,
          transparent 60%
        );
        transform: rotate(8deg);
        pointer-events: none;
      }
      .modal-overlay.show .modal-shine {
        animation: shineOnce 1s ease-out 0.15s;
      }
      .modal-sparkle {
        position: absolute;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 8px 2px rgba(201, 154, 46, 0.7);
        opacity: 0;
        pointer-events: none;
      }
      .modal-overlay.show .modal-sparkle {
        animation: burst 0.8s ease-out forwards;
      }
      @keyframes burst {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(0.3);
        }
      }
      .modal-sparkles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        border-radius: 24px;
      }
      .modal-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 10px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
      }
      .modal-icon.gain {
        background: radial-gradient(
          circle,
          rgba(111, 207, 151, 0.22),
          transparent 70%
        );
        color: var(--easy);
      }
      .modal-icon.loss {
        background: radial-gradient(
          circle,
          rgba(242, 104, 95, 0.22),
          transparent 70%
        );
        color: var(--red);
      }
      .modal-label {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11.5px;
        color: var(--ink-dim);
        font-weight: 700;
        position: relative;
        z-index: 1;
      }
      .modal-xp {
        font-weight: 800;
        font-size: 44px;
        margin: 2px 0 4px;
        position: relative;
        z-index: 1;
      }
      .modal-xp.gain {
        color: var(--easy);
      }
      .modal-xp.loss {
        color: var(--red);
      }
      .modal-outcome {
        font-size: 15.5px;
        color: var(--ink);
        font-weight: 500;
        margin-bottom: 18px;
        position: relative;
        z-index: 1;
      }
      .modal-choice-label {
        text-align: left;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-dim);
        font-weight: 700;
        margin-bottom: 7px;
        position: relative;
        z-index: 1;
      }
      .modal-choice {
        background: var(--surface-soft);
        border: 1px solid var(--card-border);
        border-left: 3px solid var(--gold);
        border-radius: 10px 14px 14px 10px;
        padding: 13px 14px;
        font-size: 14.5px;
        line-height: 1.5;
        color: var(--ink-dim);
        text-align: left;
        position: relative;
        z-index: 1;
      }
      .modal-continue {
        margin-top: 20px;
        width: 100%;
        background: linear-gradient(135deg, #e0b84e, var(--gold));
        color: #1a1408;
        border: none;
        font-weight: 800;
        font-size: 15px;
        padding: 14px;
        border-radius: 999px;
        cursor: pointer;
        position: relative;
        z-index: 1;
        box-shadow: 0 8px 22px rgba(201, 154, 46, 0.35);
      }
      .modal-continue:active {
        transform: scale(0.98);
      }

      /* full-screen cover while the model is generating an event */
      .pageLoader {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: var(--bg);
        transition: opacity 0.35s ease;
      }

      .pageLoader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .pageLoaderSpinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--gold);
        animation: pageLoaderSpin 0.8s linear infinite;
      }

      @keyframes pageLoaderSpin {
        to {
          transform: rotate(360deg);
        }
      }

      .pageLoaderText {
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

    </style>
  </head>
  <body class="page-maximal">
    <div class="bg-glow">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="phone">
      <div class="topbar">
        <div class="icon-btn" id="closeBtn">✕</div>
        <div class="mode-switch" id="modeSwitch">
          <button class="mode-btn" data-mode="easy">Easy</button>
          <button class="mode-btn active" data-mode="medium">Medium</button>
          <button class="mode-btn" data-mode="hard">Hard</button>
        </div>
        <div class="icon-btn" id="addBtn">+</div>
      </div>
      <div class="mode-sub" id="modeSub"></div>

      <div class="card" id="eventCard">
        <div class="card-shine" id="cardShine"></div>
        <div class="card-head">
          <div class="card-tag">
            <span class="emoji" id="catEmoji">🎭</span
            ><span id="catLabel">Event</span>
          </div>
          <div class="xp medium" id="xpLabel">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
            </svg>
            <span id="xpLabelText"></span>
          </div>
        </div>
        <div class="event-text" id="eventText"></div>
        <textarea
          class="event-edit-area"
          id="editArea"
          style="display: none"
        ></textarea>
      </div>

      <div class="action-row">
        <div class="pill-group">
          <div class="pill-btn" id="rerollBtn">🎲 Re-roll</div>
          <div class="pill-btn" id="editBtn">✎ Edit</div>
        </div>
        <div class="star-btn" id="starBtn">☆</div>
      </div>

      <div id="choicesWrap"></div>

      <div class="write-own" id="writeOwnToggle">Write my own response</div>
      <textarea
        class="own-textarea"
        id="ownTextarea"
        style="display: none"
        placeholder="Type how you'd handle it…"
      ></textarea>

      <div class="submit-bar">
        <button class="submit-btn" id="submitBtn">Submit</button>
      </div>
      <div class="toast" id="toast"></div>

    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card" id="modalCard">
        <div class="modal-shine"></div>
        <div class="modal-sparkles" id="modalSparkles"></div>
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-label">Outcome</div>
        <div class="modal-xp" id="modalXP"></div>
        <div class="modal-outcome" id="modalOutcome"></div>
        <div class="modal-choice-label">Your response</div>
        <div class="modal-choice" id="modalChoice"></div>
        <button class="modal-continue" id="modalContinue">Continue</button>
      </div>
    </div>

    <!-- covers the screen until the model finishes generating the event,
    then fades out -->
    <div class="pageLoader" id="pageLoader">
      <div class="pageLoaderSpinner"></div>
      <div class="pageLoaderText">Loading...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/theme.js"></script>
    <script>
      const MODE_SUBS = {
        easy: "Low stakes. Every option still earns XP — some just earn more than others.",
        medium: "Moderate stakes. Bold and Wildcard picks can now cost you XP, not just earn it.",
        hard: "High stakes. Every option can swing hard in either direction — Wildcard picks the hardest.",
      };

      /* ---------- state ---------- */
      let mode = "medium";
      let currentEvent = null;
      let selectedChoice = null;
      let usingOwnText = false;
      let isEditing = false;
      let isFavorited = false;
      let hasSubmitted = false;
      let isSubmitting = false;
      let isFetching = false;

      //button selectors
      const els = {
        modeSwitch: document.getElementById("modeSwitch"),
        modeSub: document.getElementById("modeSub"),
        catEmoji: document.getElementById("catEmoji"),
        catLabel: document.getElementById("catLabel"),
        xpLabel: document.getElementById("xpLabel"),
        eventText: document.getElementById("eventText"),
        editArea: document.getElementById("editArea"),
        editBtn: document.getElementById("editBtn"),
        rerollBtn: document.getElementById("rerollBtn"),
        starBtn: document.getElementById("starBtn"),
        choicesWrap: document.getElementById("choicesWrap"),
        writeOwnToggle: document.getElementById("writeOwnToggle"),
        ownTextarea: document.getElementById("ownTextarea"),
        submitBtn: document.getElementById("submitBtn"),
        toast: document.getElementById("toast"),
        modalOverlay: document.getElementById("modalOverlay"),
        modalCard: document.getElementById("modalCard"),
        modalIcon: document.getElementById("modalIcon"),
        modalSparkles: document.getElementById("modalSparkles"),
        modalXP: document.getElementById("modalXP"),
        modalOutcome: document.getElementById("modalOutcome"),
        modalChoice: document.getElementById("modalChoice"),
        modalContinue: document.getElementById("modalContinue"),
        eventCard: document.getElementById("eventCard"),
        cardShine: document.getElementById("cardShine"),
        xpLabelText: document.getElementById("xpLabelText"),
      };

      function highlightMentions(text) {
        // Guard check: If text is missing, null, or undefined, return an empty string safely
        if (!text) return "";

        if (Array.isArray(text)) {
          text = text.concat().shift();
        }
        if (typeof text !== 'string') {
          text = text.text || text.content || JSON.stringify(text);
        }

        return text.replace(
          /(@[A-Za-z0-9]+)/g,
          '<span class="mention">$1</span>',
        );
      }

      function fmtXP(n) {
        return (n > 0 ? "+" : "") + n;
      }

      const OUTCOMES_GAIN = [
        "Handled like a total pro.",
        "The internet approves.",
        "That lands well — momentum's on your side.",
        "People are here for it.",
        "Solid read on the room.",
        "That's the kind of moment fans remember.",
      ];
      const OUTCOMES_LOSS = [
        "Ouch — that didn't land well.",
        "The internet is not being kind right now.",
        "That backfired a little.",
        "Rocky moment, but you'll recover.",
        "Not your best look, but not the end of the world.",
        "That one's going to follow you for a bit.",
      ];

      function randomOutcomeLine(gain) {
        const pool = gain ? OUTCOMES_GAIN : OUTCOMES_LOSS;
        return pool[Math.floor(Math.random() * pool.length)];
      }
            
      //call supabase
      async function callGemini(difficulty) {
        try {
          console.log(`Triggering Gemini event generation with difficulty: ${difficulty}...`);

          // the edge function works out who the player is from the session token that invoke() sends along
          const { data, error } = await supabaseClient.functions.invoke("Generate-Events", {
            body: { difficulty },
          });

          if (error) {
            console.error("Supabase returned an error:", error);
            return null;
          }

          console.log("Successfully received data from Gemini:", data);
          return data;
        } catch (err) {
          console.error("Network catch block triggered:", err);
          return null;
        }
      }

      // asks the backend to roll + save the XP for the risk level the player picked
      async function callResolve(difficulty, risk) {
        try {
          const { data, error } = await supabaseClient.functions.invoke("Generate-Events", {
            body: { action: "resolve", difficulty, risk },
          });
          if (error || typeof data?.backendXP !== "number") {
            console.error("Failed to resolve XP:", error || data);
            return null;
          }
          return data.backendXP;
        } catch (err) {
          console.error("Network catch block triggered:", err);
          return null;
        }
      }

      function renderXPRange(ev) {
        const ranges = Object.values(ev.xpRanges);
        const lo = Math.min(...ranges.map((r) => r[0]));
        const hi = Math.max(...ranges.map((r) => r[1]));
        els.xpLabelText.textContent = `${fmtXP(lo)} to ${fmtXP(hi)} XP`;
        els.xpLabel.className = "xp " + ev.difficulty;
      }

      function riskLabel(risk) {
        return risk === "safe" ? "Safe" : risk === "bold" ? "Bold" : "Wildcard";
      }

function renderChoices(choices) {
  els.choicesWrap.innerHTML = "";
  choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.dataset.index = i;
    btn.innerHTML = `
      <div>${c.text}</div>
      <div class="choice-foot">
        <span class="risk-badge ${c.risk}">${riskLabel(c.risk)}</span>
        <span class="risk-range">${fmtXP(c.xp[0])} to ${fmtXP(c.xp[1])} XP</span>
      </div>
    `;
    btn.addEventListener("click", () => selectChoice(i, btn));
    els.choicesWrap.appendChild(btn);
  });
}


      function selectChoice(i, btn) {
        if (hasSubmitted) return;
        usingOwnText = false;
        els.ownTextarea.style.display = "none";
        els.ownTextarea.value = "";
        document
          .querySelectorAll(".choice")
          .forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedChoice = i;
        updateSubmitState();
      }

      function updateSubmitState() {
        if (hasSubmitted) {
          els.submitBtn.classList.remove("ready");
          els.submitBtn.classList.add("locked");
          els.submitBtn.textContent = "Submitted";
          return;
        }
        const ready =
          selectedChoice !== null ||
          (usingOwnText && els.ownTextarea.value.trim().length > 0);
        els.submitBtn.classList.toggle("ready", ready);
        els.submitBtn.classList.remove("locked");
        els.submitBtn.textContent = "Submit";
      }

      function showPageLoader() {
        const loader = document.getElementById("pageLoader");
        if (loader) loader.classList.remove("hidden");
      }

      function hidePageLoader() {
        const loader = document.getElementById("pageLoader");
        if (loader) loader.classList.add("hidden");
      }

      async function loadEvent() {
        // block spam clicks while a request is already running
        if (isFetching) return;
        isFetching = true;
        showPageLoader();

        try {
          const chosenDifficulty = mode;
          const responseData = await callGemini(chosenDifficulty);

          if (!responseData || !responseData.story) {
            els.toast.textContent = "Couldn't generate an event. Try re-rolling.";
            els.toast.className = "toast show loss";
            return;
          }

          const story = responseData.story;
          const validRisks = ["safe", "bold", "wild"];

          const ev = {
            text: story.text,
            emoji: story.emoji || "🎭",
            cat: story.cat || "Event",
            difficulty: chosenDifficulty,
            xpRanges: responseData.xpRanges,
            choices: story.choices.map((c) => {
              const risk = validRisks.includes(c.risk) ? c.risk : "bold";
              return { text: c.text, risk, xp: responseData.xpRanges[risk] };
            }),
          };

          currentEvent = ev;
          hasSubmitted = false;
          els.catEmoji.textContent = ev.emoji;
          els.catLabel.textContent = ev.cat;
          els.eventText.innerHTML = highlightMentions(ev.text);
          els.editArea.value = ev.text;
          els.editArea.style.display = "none";
          els.eventText.style.display = "block";
          isEditing = false;
          renderXPRange(ev);
          renderChoices(ev.choices);
          els.writeOwnToggle.classList.remove("disabled");
          selectedChoice = null;
          usingOwnText = false;
          els.ownTextarea.style.display = "none";
          els.ownTextarea.value = "";
          els.toast.classList.remove("show");
          updateSubmitState();

          els.eventCard.classList.remove("easy", "medium", "hard");
          els.eventCard.classList.add(chosenDifficulty);
          els.cardShine.classList.remove("play");
          void els.cardShine.offsetWidth;
          els.cardShine.classList.add("play");
        } catch (err) {
          console.error("error loading event", err);
        } finally {
          isFetching = false;
          hidePageLoader();
        }
      }

      function updateModeSub() {
        els.modeSub.textContent = MODE_SUBS[mode];
      }

      /* ---------- events ---------- */
      els.modeSwitch.addEventListener("click", (e) => {
        const btn = e.target.closest(".mode-btn");
        if (!btn || isFetching) return;
        mode = btn.dataset.mode;
        [...els.modeSwitch.children].forEach((b) =>
          b.classList.remove("active"),
        );
        btn.classList.add("active");
        updateModeSub();
        loadEvent();
      });

      els.rerollBtn.addEventListener("click", loadEvent);

      els.editBtn.addEventListener("click", () => {
        isEditing = !isEditing;
        els.eventText.style.display = isEditing ? "none" : "block";
        els.editArea.style.display = isEditing ? "block" : "none";
        if (!isEditing) {
          els.eventText.innerHTML = highlightMentions(els.editArea.value);
        }
      });

      els.starBtn.addEventListener("click", () => {
        isFavorited = !isFavorited;
        els.starBtn.classList.toggle("active", isFavorited);
        els.starBtn.textContent = isFavorited ? "★" : "☆";
      });

      els.writeOwnToggle.addEventListener("click", () => {
        if (hasSubmitted) return;
        usingOwnText = true;
        selectedChoice = null;
        document
          .querySelectorAll(".choice")
          .forEach((b) => b.classList.remove("selected"));
        els.ownTextarea.style.display = "block";
        els.ownTextarea.focus();
        updateSubmitState();
      });

      els.ownTextarea.addEventListener("input", () => {
        if (!hasSubmitted) updateSubmitState();
      });

      const ICON_GAIN = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6"/><path d="M12 22V12"/><path d="M5 12l7-10 7 10"/><path d="M5 12h14"/></svg>`;
      const ICON_LOSS = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-6"/><path d="M12 2v10"/><path d="M19 12l-7 10-7-10"/><path d="M19 12H5"/></svg>`;

      function spawnModalSparkles() {
        els.modalSparkles.innerHTML = "";
        for (let i = 0; i < 10; i++) {
          const el = document.createElement("div");
          el.className = "modal-sparkle";
          const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
          const dist = 60 + Math.random() * 70;
          el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          el.style.setProperty("--dy", Math.sin(angle) * dist + "px");
          el.style.left = "50%";
          el.style.top = "38%";
          el.style.width = 3 + Math.random() * 3 + "px";
          el.style.height = el.style.width;
          el.style.animationDelay = Math.random() * 0.15 + "s";
          els.modalSparkles.appendChild(el);
        }
      }

    els.submitBtn.addEventListener("click", async () => {
        if (hasSubmitted || isSubmitting) return;
        if (!els.submitBtn.classList.contains("ready")) return;

        // a custom written response is treated as a "bold" risk
        const picked = selectedChoice !== null ? currentEvent.choices[selectedChoice] : null;
        const risk = picked ? picked.risk : "bold";
        const choiceText = picked ? picked.text : els.ownTextarea.value.trim();

        // the XP shown in the popup is the exact amount the backend rolled and saved
        isSubmitting = true;
        els.submitBtn.textContent = "Submitting…";
        const xp = await callResolve(currentEvent.difficulty, risk);
        isSubmitting = false;

        if (xp === null) {
          els.toast.textContent = "Couldn't save your result. Try submitting again.";
          els.toast.className = "toast show loss";
          updateSubmitState();
          return;
        }

        // lock everything so the button (and choices) can't be spammed for a new roll
        hasSubmitted = true;
        updateSubmitState();
        document
          .querySelectorAll(".choice")
          .forEach((b) => b.classList.add("disabled"));
        els.writeOwnToggle.classList.add("disabled");


        const gain = xp >= 0;
        els.modalCard.classList.remove("gain", "loss");
        void els.modalCard.offsetWidth;
        els.modalCard.classList.add(gain ? "gain" : "loss");
        els.modalIcon.className = "modal-icon " + (gain ? "gain" : "loss");
        els.modalIcon.innerHTML = gain ? ICON_GAIN : ICON_LOSS;
        els.modalOutcome.textContent = randomOutcomeLine(gain);
        els.modalChoice.textContent = choiceText;
        if (gain) spawnModalSparkles();
        else els.modalSparkles.innerHTML = "";
        els.modalOverlay.classList.add("show");

        // animated count-up for the XP number
        els.modalXP.className = "modal-xp " + (gain ? "gain" : "loss");
        const t0 = performance.now();
        const duration = 650;
        function tick(now) {
          const p = Math.min(1, (now - t0) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          const val = Math.round(xp * eased);
          els.modalXP.textContent = `${fmtXP(val)} XP`;
          if (p < 1) requestAnimationFrame(tick);
          else els.modalXP.textContent = `${fmtXP(xp)} XP`;
        }
        requestAnimationFrame(tick);
      });

      els.modalContinue.addEventListener("click", () => {
        els.modalOverlay.classList.remove("show");
        // event has been submitted — send the player back to the feed.
        window.location.href = "Feed.html";
      });

      document.getElementById("closeBtn").addEventListener("click", () => {
        const lastPage =
          sessionStorage.getItem("spotlight-last-page") || "Feed.html";
        window.location.href = lastPage;
      });
      document.getElementById("addBtn").addEventListener("click", () => {
        els.toast.textContent = "Power-ups are coming soon.";
        els.toast.className = "toast show gain";
      });

      /* ---------- init ---------- */
      const CARD_SPARKLES = [
        { top: "12%", left: "88%", size: 4, delay: "0s" },
        { top: "85%", left: "92%", size: 3, delay: "1.1s" },
        { top: "70%", left: "6%", size: 3, delay: "2s" },
      ];
      CARD_SPARKLES.forEach((s) => {
        const el = document.createElement("div");
        el.className = "sparkle";
        el.style.top = s.top;
        el.style.left = s.left;
        el.style.width = s.size + "px";
        el.style.height = s.size + "px";
        el.style.animationDelay = s.delay;
        els.eventCard.appendChild(el);
      });

      updateModeSub();
      loadEvent();
    </script>
  </body>
</html>

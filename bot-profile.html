<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight | Profile</title>
<script>
  // apply saved theme immediately to avoid a flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem('spotlight-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>

    <link rel="stylesheet" href="style.css" />
    <style>
      :root,
      [data-theme="dark"] {
        --track: #2a2a2f;
        --stat-bg: rgba(255, 255, 255, 0.03);
        --verified: #4fa8dd;
        --surface-2: #151316;
        --profile-glow-1: #f5c451;
        --profile-glow-2: #b98b2c;
        --profile-glow-3: #6b5320;
        --profile-glow-opacity: 0.28;
      }

      [data-theme="light"] {
        --track: #e0ddd3;
        --stat-bg: rgba(0, 0, 0, 0.03);
        --verified: #4fa8dd;
        --surface-2: #efece6;
        --profile-glow-1: rgba(245, 196, 81, 0.38);
        --profile-glow-2: rgba(224, 184, 78, 0.26);
        --profile-glow-3: rgba(201, 154, 46, 0.18);
        --profile-glow-opacity: 0.42;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .bg-glow span {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: var(--profile-glow-opacity);
        animation: drift 26s ease-in-out infinite alternate;
      }

      .bg-glow span:nth-child(1) {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, var(--profile-glow-1), transparent 70%);
        top: -140px;
        left: -100px;
        animation-duration: 29s;
      }

      .bg-glow span:nth-child(2) {
        width: 360px;
        height: 360px;
        background: radial-gradient(circle, var(--profile-glow-2), transparent 70%);
        bottom: -100px;
        right: -80px;
        animation-duration: 33s;
        animation-delay: -6s;
      }

      .bg-glow span:nth-child(3) {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, var(--profile-glow-3), transparent 70%);
        top: 35%;
        right: 8%;
        animation-duration: 23s;
        animation-delay: -3s;
      }

      @keyframes drift {
        0% {
          transform: translate(0,0) scale(1);
        }
        50% {
          transform: translate(30px,-25px) scale(1.12);
        }
        100% {
          transform: translate(-20px,20px) scale(0.96);
        }
      }

      body {
        background: radial-gradient(ellipse at top, var(--bg-glow) 0%, var(--bg) 55%);
        position: relative;
        overflow-x: hidden;
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 20px 0 90px;
      }

      .phone {
        width: 100%;
        max-width: 430px;
        padding: 0 18px;
        position: relative;
        z-index: 1;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .circle-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--surface-1);
        border: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-dim);
        cursor: pointer;
      }

      /* ---------- fame card ---------- */
      .fame-card {
        position: relative;
        border-radius: 28px;
        background: linear-gradient(165deg, var(--fame-grad-1) 0%, var(--fame-grad-2) 60%, var(--fame-grad-3) 100%);
        border: 1.5px solid rgba(245,196,81,.28);
        box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 0 0 1px rgba(245,196,81,.05) inset;
        overflow: hidden;
        animation: cardRise .5s cubic-bezier(.2,.9,.3,1.15);
      }

      @keyframes cardRise {
        from {
          opacity: 0;
          transform: translateY(14px) scale(.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .fame-card::after {
        content: "";
        position: absolute;
        top: -60%;
        left: -40%;
        width: 55%;
        height: 220%;
        background: linear-gradient(75deg, transparent 35%, rgba(245,220,160,.14) 48%, transparent 60%);
        transform: rotate(8deg);
        animation: shine 10s ease-in-out;
        pointer-events: none;
      }

      @keyframes shine {
        0% {
          left: -60%;
        }
        35% {
          left: 130%;
        }
        100% {
          left: 130%;
        }
      }

      .sparkle {
        position: absolute;
        border-radius: 50%;
        background: #f5c451;
        box-shadow: 0 0 6px 1px rgba(245,196,81,.7);
        animation: twinkle 3.2s ease-in-out infinite;
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: .15;
          transform: scale(.7);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      .fame-banner {
        position: relative;
        height: 130px;
        background: var(--fame-grad-1);
        overflow: hidden;
        border-radius: 26.5px 26.5px 0 0;
      }

      .fame-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .fame-banner::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,.05) 55%, rgba(10,9,6,.35) 100%);
      }

      .fame-body {
        padding: 18px 22px 20px;
        position: relative;
        z-index: 1;
        text-align: center;
      }

      .fame-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 18px;
        position: relative;
        z-index: 1;
      }

      .ring-avatar {
        position: relative;
        width: 88px;
        height: 88px;
        flex-shrink: 0;
      }

      .ring-avatar svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }

      .ring-avatar .ring-track {
        fill: none;
        stroke: var(--track);
        stroke-width: 5;
      }

      .ring-avatar .ring-fill {
        fill: none;
        stroke: url(#ringGrad);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        transition: stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1);
      }

      .avatar-photo {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid var(--fame-edge);
      }

      .avatar-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .fame-id {
        margin-top: 12px;
      }

      .fame-name-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .fame-name {
        font-weight: 800;
        font-size: 19px;
      }

      .verified {
        width: 16px;
        height: 16px;
        color: var(--verified);
        flex-shrink: 0;
      }

      .fame-handle {
        color: var(--ink-faint);
        font-size: 13.5px;
        margin-top: 2px;
      }

      .fame-bio {
        margin-top: 16px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-dim);
        position: relative;
        z-index: 1;
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
      }

      .fame-stats-row {
        display: flex;
        gap: 8px;
        margin-top: 18px;
        position: relative;
        z-index: 1;
      }

      .fame-stat {
        flex: 1;
        background: var(--stat-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 10px 6px;
        text-align: center;
      }

      .fame-stat b {
        display: block;
        font-weight: 800;
        font-size: 15px;
        color: var(--ink);
      }

      .fame-stat span {
        font-size: 10.5px;
        color: var(--ink-faint);
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      /* ---------- segmented tabs ---------- */
      .tabs {
        display: flex;
        gap: 6px;
        margin-top: 24px;
        background: var(--surface-2);
        border: 1px solid var(--card-border);
        border-radius: 999px;
        padding: 4px;
      }

      .tab-btn {
        flex: 1;
        border: none;
        background: transparent;
        font-weight: 700;
        font-size: 13.5px;
        color: var(--ink-faint);
        padding: 10px 0;
        border-radius: 999px;
        cursor: pointer;
        transition: background .2s ease, color .2s ease;
      }

      .tab-btn.active {
        background: var(--gold-glow);
        color: var(--gold);
      }

      .tab-panel {
        display: none;
        margin-top: 20px;
      }

      .tab-panel.active {
        display: block;
        animation: fadeIn .35s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- follow + message ---------- */
      .profile-actions {
        margin-top: 16px;
        position: relative;
        z-index: 1;
      }

      .profile-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-weight: 700;
        font-size: 13px;
        padding: 11px 14px;
        border-radius: 999px;
        cursor: pointer;
      }

      .follow-btn {
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        border: 1px solid transparent;
        color: #1a1408;
      }

      .follow-btn.following {
        background: transparent;
        border-color: var(--card-border);
        color: var(--ink);
      }

      .message-btn {
        background: transparent;
        border: 1px solid var(--card-border);
        color: var(--ink);
      }

      .message-btn:hover,
      .follow-btn.following:hover {
        border-color: var(--gold);
        background: var(--gold-glow);
      }

      .profile-btn:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }

      /* ---------- posts / replies / reposts ---------- */
      .post-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .post {
        background: linear-gradient(180deg, var(--surface-grad-1) 0%, var(--surface-grad-2) 100%);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 14px 16px;
      }

      .post-context {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--ink-faint);
      }

      .post-text {
        margin: 0;
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink);
      }

      .post-meta {
        display: flex;
        gap: 14px;
        margin-top: 12px;
        font-size: 12px;
        color: var(--ink-faint);
      }

      .post-meta span:first-child {
        margin-right: auto;
      }

      .fame-banner img[hidden] {
        display: none;
      }

      .fame-bio[hidden],
      .verified[hidden] {
        display: none;
      }

      .post[data-href] {
        cursor: pointer;
      }

      .post[data-href]:hover {
        border-color: var(--gold);
      }

      .tab-count {
        margin-left: 4px;
        font-size: 12px;
        opacity: 0.8;
      }

      .list-empty {
        margin: 24px 0 0;
        text-align: center;
        font-size: 13.5px;
        color: var(--ink-faint);
      }

      .profile-missing {
        margin: 60px 0;
        text-align: center;
        color: var(--ink-faint);
        font-size: 15px;
      }

      /* ---------- edit sheet ---------- */
      :root, [data-theme="dark"], [data-theme="light"] { --border-strong: rgba(245, 196, 81, 0.35); }

      .sheet-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s ease;
      }

      .sheet-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .sheet {
        width: 100%;
        max-width: 430px;
        max-height: 90vh;
        overflow-y: auto;
        background: var(--bg);
        border: 1px solid var(--card-border);
        border-bottom: none;
        border-radius: 24px 24px 0 0;
        padding: 18px 18px 24px;
        transform: translateY(24px);
        transition: transform .3s cubic-bezier(.2,.9,.3,1.1);
      }

      .sheet-overlay.open .sheet {
        transform: none;
      }

      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .sheet-head h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
      }

      .sheet-label {
        display: block;
        margin: 18px 0 8px;
        font-size: 13px;
        font-weight: 800;
        color: var(--ink);
      }

      .sheet-label small {
        font-weight: 600;
        color: var(--ink-faint);
      }

      .edit-banner {
        position: relative;
        height: 120px;
        margin-bottom: 44px;
        border-radius: 16px;
        background: var(--surface-1);
        border: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-faint);
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
      }

      .edit-banner img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
      }

      .edit-banner img[hidden] {
        display: none;
      }

      .edit-banner span {
        position: relative;
        z-index: 1;
        text-shadow: 0 1px 3px rgba(0,0,0,.5);
      }

      .edit-avatar {
        position: absolute;
        left: 18px;
        bottom: -36px;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        overflow: hidden;
        background: var(--surface-1);
        border: 3px solid var(--bg);
        outline: 1px solid var(--border-strong);
        cursor: pointer;
        z-index: 2;
      }

      .edit-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .edit-avatar::after {
        content: "Edit";
        position: absolute;
        inset: auto 0 0 0;
        padding: 3px 0;
        text-align: center;
        font-size: 10px;
        font-weight: 700;
        color: #fff;
        background: rgba(0,0,0,.5);
      }

      .sheet-input,
      .sheet-textarea {
        width: 100%;
        background: var(--card, var(--surface-1));
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        padding: 12px 14px;
        outline: none;
      }

      .sheet-textarea {
        resize: none;
        height: 74px;
        line-height: 1.5;
      }

      .sheet-input:focus,
      .sheet-textarea:focus {
        border-color: var(--gold);
      }

      .sheet-counter {
        margin-top: 4px;
        text-align: right;
        font-size: 10px;
        color: var(--ink-faint);
      }

      .sheet-error {
        margin: 12px 0 0;
        font-size: 12.5px;
        color: #e25555;
      }

      .sheet-error[hidden] {
        display: none;
      }

      .sheet-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .sheet-actions .profile-btn {
        flex: 1;
        padding: 13px 14px;
      }

      .save-btn {
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        border: 1px solid transparent;
        color: #1a1408;
      }

      .save-btn:disabled {
        opacity: .6;
        cursor: default;
      }

      /* archetype buttons (npc_profiles) */
      .archetype-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .archetype-btn {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        text-transform: capitalize;
        padding: 9px 14px;
        border-radius: 999px;
        background: transparent;
        border: 1px solid var(--card-border);
        color: var(--ink);
        cursor: pointer;
        transition: background .2s ease, color .2s ease, border-color .2s ease;
      }

      .archetype-btn:hover {
        border-color: var(--gold);
      }

      .archetype-btn.selected {
        background: var(--gold-glow);
        border-color: var(--gold);
        color: var(--gold);
      }

      .archetype-voice {
        margin: 10px 0 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--ink-dim);
      }

      /* personality sliders (bot_profiles) -- same look as profile.html */
      .slider-container {
        background-color: var(--card, var(--surface-1));
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        padding: 16px 14px;
      }

      .slider-row { display: flex; align-items: center; gap: 10px; }
      .trait-row { margin-bottom: 18px; }
      .trait-row:last-child { margin-bottom: 0; }
      .trait-name {
        font-size: 10px; font-weight: 700; letter-spacing: .5px;
        text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px;
      }
      .per-label-edge { font-size: 11px; font-weight: 600; color: var(--ink-faint); white-space: nowrap; }

      .per-slider {
        flex: 1; min-width: 0;
        -webkit-appearance: none; appearance: none;
        height: 4px; border-radius: 4px;
        background: linear-gradient(to right,
          var(--gold) 0%,
          var(--gold) calc((var(--val, 6) - 1) / 10 * 100%),
          var(--track) calc((var(--val, 6) - 1) / 10 * 100%),
          var(--track) 100%);
        outline: none; cursor: pointer;
      }
      .per-slider::-webkit-slider-thumb {
        -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
        background: var(--gold); border: 2px solid var(--bg);
        box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer;
        transition: transform .15s; margin-top: calc((4px - 18px) / 2);
      }
      .per-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
      .per-slider::-moz-range-track { height: 4px; border-radius: 4px; background: var(--track); }
      .per-slider::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--gold); }
      .per-slider::-moz-range-thumb {
        width: 18px; height: 18px; border-radius: 50%; background: var(--gold);
        border: 2px solid var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer;
      }
      .per-slider:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

      .personality-summary {
        margin-top: 12px; padding: 14px;
        background-color: var(--card, var(--surface-1));
        border: 1px solid var(--border-strong); border-radius: 12px;
      }
      .trait-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      .trait-chip {
        font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px;
        background-color: var(--bg); border: 1px solid var(--card-border); color: var(--ink);
      }
      .overall-line {
        position: relative; font-size: 12px; color: var(--ink-faint);
        border-top: 1px solid var(--card-border); padding-top: 10px;
      }
      .overall-trigger { position: relative; cursor: pointer; }
      .overall-underline {
        color: var(--gold); font-weight: 700; text-decoration: underline;
        text-decoration-style: dotted; text-underline-offset: 3px;
      }
      .overall-popup {
        display: none; position: absolute; bottom: calc(100% + 8px); left: 0; width: 220px;
        background-color: var(--bg); border: 1px solid var(--card-border); border-radius: 10px;
        padding: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.35); z-index: 40; cursor: default;
      }
      .overall-trigger:hover .overall-popup,
      .overall-popup.visible { display: block; }
      .overall-popup-title { font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
      .overall-popup-text { font-size: 12px; line-height: 1.5; color: var(--ink); }

      /* ---------- bottom nav ---------- */
      .bottomTab {
        position: fixed;
        left: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
        width: 100%;
        padding: 10px 20px;
        background-color: var(--bg);
        border-top: 1px solid var(--card-border);
        z-index: 9999;
      }

      .bottomTab a {
        padding: 6px 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        color: var(--ink);
        font: bold 16px 'Urbanist', Arial, sans-serif;
        text-align: center;
        text-decoration: none;
        transition: all 0.25s ease;
      }

      .bottomTab a:hover,
      .bottomTab a[aria-current="page"] {
        color: #ffd166;
        border-color: rgba(255, 209, 102, 0.5);
        background-color: rgba(255, 209, 102, 0.08);
        box-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
        transform: translateY(-2px);
      }

      @media (max-width:480px) {
        .bottomTab {
          gap: 8px;
        }

        .bottomTab a {
          padding: 6px 8px;
          font-size: 14px;
        }
      }
    </style>
</head>
<body class="page-maximal">
<div class="bg-glow"><span></span><span></span><span></span></div>
<div class="phone">

  <div class="topbar">
    <button class="circle-btn" id="backBtn" aria-label="Go back" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

<script>
  /* ---------- bot profile: npc_profiles OR bot_profiles, looked up by ?id= ---------- */
  const BOT_FOLLOWING_PLACEHOLDER = 0;    // PLACEHOLDER: bots don't track who they follow yet

  const $ = (id) => document.getElementById(id);

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function readLocal(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function writeLocal(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage full / blocked */ }
  }
  function formatCount(n) {
    return n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(n);
  }
  function timeSince(dateString) {
    const minutes = Math.max(1, Math.floor((Date.now() - new Date(dateString)) / 60000));
    if (minutes < 60) return minutes + 'm ago';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + 'h ago';
    return Math.floor(hours / 24) + 'd ago';
  }
  function initialsOf(name) {
    const parts = String(name || '?').replace(/^@/, '').trim().split(/[\s_.-]+/).filter(Boolean);
    return (parts.length > 1 ? parts[0][0] + parts[1][0] : (parts[0] || '?').slice(0, 2)).toUpperCase();
  }

  // same palette + hash as the avatar colors in messages.html, so a bot's banner matches its avatar color
  const AVATAR_COLORS = ['#f5c451', '#4fa8dd', '#6fcf97', '#f2685f', '#c792ea', '#f2a13d', '#8ab4f8', '#f582ae'];
  function hashString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }

  function applyBotToDOM(bot) {
    const handle = String(bot.handle || '').replace(/^@/, '');
    const name = bot.display_name || handle || 'Bot';
    $('fameDisplayName').textContent = name;
    $('fameHandle').textContent = handle ? '@' + handle : '';
    $('messageBtn').dataset.user = handle;
    document.title = 'Spotlight | ' + name;

    // npc_profiles have no bio, so the section just disappears for them
    const bio = (bot.bio || '').trim();
    $('fameBio').textContent = bio;
    $('fameBio').hidden = !bio;

    $('fameAvatarImg').src = bot.avatar_url || 'https://placehold.co/160x160/1a1a1a/888?text=' + encodeURIComponent(initialsOf(name));
    // banner always gets the bot's avatar color; a header image, when there is one, covers it
    document.querySelector('.fame-banner').style.background = AVATAR_COLORS[hashString(String(bot.id)) % AVATAR_COLORS.length];
    if (bot.header_url) {
      $('fameHeaderImg').src = bot.header_url;
      $('fameHeaderImg').hidden = false;
    }
    $('fameVerified').hidden = !bot.verified;
  }

  /* ----- followers ----- */

  // each user gets their OWN follower roll per bot (bot_follower_rolls), so one user's roll never shows for another.
  // sync_bot_followers() runs on the backend: it adds one roll per post this user hasn't been rolled for yet,
  // saves the total, and returns it. returns null if the sync fails so the caller can keep what it already has.
  async function resolveFollowers(botId) {
    const { data, error } = await supabaseClient.rpc('sync_bot_followers', { p_bot_id: botId });
    if (error) {
      console.error('Could not sync bot followers:', error);
      return null;
    }
    return data !== null && Number.isFinite(Number(data)) ? Number(data) : null;
  }

  // does this user follow this bot? true / false, or null if the lookup failed
  async function lookupFollow(userId, botId) {
    if (!userId) return null;
    const { data, error } = await supabaseClient.from('follows')
      .select('follower_id')
      .eq('follower_id', userId)
      .eq('following_id', botId)
      .maybeSingle();
    if (error) {
      console.error('Could not load follow state:', error);
      return null;
    }
    return !!data;
  }

  /* ----- cache: numbers + follow state per (user, bot), painted first and refreshed from supabase ----- */

  // the signed-in user's id from the stored session, no network request
  async function fastUserId() {
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      return session && session.user ? session.user.id : null;
    } catch (e) {
      return null;
    }
  }
  function botCacheKey(userId, botId) {
    return 'spotlight-bot-stats:' + userId + ':' + botId;
  }
  // nudge the cached Following stat on the profile page (same entry iconpage.js / profile-cache.js use)
  // so it's right as soon as you go back, even before it refreshes from supabase
  function bumpFollowingCache(userId, delta) {
    const key = 'spotlight-stats:' + userId;
    const stats = readLocal(key);
    if (!stats || !Number.isInteger(stats.following)) return;
    stats.following = Math.max(0, stats.following + delta);
    writeLocal(key, stats);
  }

  /* ----- posts / replies ----- */

  function buildCard(text, metaParts, context, href) {
    const card = document.createElement('div');
    card.className = 'post';
    if (href) {
      card.dataset.href = href;
      card.addEventListener('click', () => { window.location.href = href; });
    }
    if (context) {
      const ctx = document.createElement('p');
      ctx.className = 'post-context';
      ctx.textContent = context;
      card.appendChild(ctx);
    }
    const body = document.createElement('p');
    body.className = 'post-text';
    body.textContent = text || '';
    card.appendChild(body);
    const meta = document.createElement('div');
    meta.className = 'post-meta';
    metaParts.forEach((part) => {
      const span = document.createElement('span');
      span.textContent = part;
      meta.appendChild(span);
    });
    card.appendChild(meta);
    return card;
  }

  function renderPosts(posts) {
    const list = $('postList');
    list.innerHTML = '';
    if (!posts.length) {
      list.innerHTML = '<p class="list-empty">No posts yet.</p>';
      return;
    }
    posts.forEach((p) => {
      list.appendChild(buildCard(
        p.content,
        [timeSince(p.created_at), (p.like_count || 0) + ' likes', (p.dislike_count || 0) + ' dislikes'],
        null,
        'post.html?id=' + encodeURIComponent(p.id)
      ));
    });
  }

  function renderReplies(replies) {
    const list = $('replyList');
    list.innerHTML = '';
    if (!replies.length) {
      list.innerHTML = '<p class="list-empty">No replies yet.</p>';
      return;
    }
    replies.forEach((r) => {
      list.appendChild(buildCard(
        r.content,
        [timeSince(r.created_at)],
        r.parent_reply_id ? 'Replied in a thread' : 'Replied to a post',
        'post.html?id=' + encodeURIComponent(r.post_id)
      ));
    });
  }

  function showMissing() {
    document.querySelector('.phone').querySelectorAll('#fameCard, .tabs, .tab-panel').forEach((el) => el.remove());
    const msg = document.createElement('div');
    msg.className = 'profile-missing';
    msg.textContent = "This profile couldn't be found.";
    document.querySelector('.topbar').after(msg);
  }

  let currentBot = null;
  let currentIsCustom = false;
  let baseFollowers = 0;
  let isFollowing = false;

  async function loadBotProfile() {
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { showMissing(); return; }

    // 1. paint the cache first (numbers + follow state), it gets refreshed from supabase below
    const userId = await fastUserId();
    const cached = userId ? readLocal(botCacheKey(userId, id)) : null;
    if (cached) {
      baseFollowers = Number.isFinite(cached.base) ? cached.base : 0;
      isFollowing = !!cached.following;
      updateFollowBtn();
      showCount($('statFollowers'), baseFollowers + (isFollowing ? 1 : 0));
      if (Number.isFinite(cached.posts)) showCount($('statPosts'), cached.posts);
    }

    // 2. the id could belong to either table, so ask both
    const [botRes, npcRes] = await Promise.all([
      supabaseClient.from('bot_profiles').select('*').eq('id', id).maybeSingle(),
      supabaseClient.from('npc_profiles').select('*').eq('id', id).maybeSingle(),
    ]);
    const isCustomBot = !!botRes.data;
    const profile = botRes.data || npcRes.data;
    if (!profile) {
      if (botRes.error) console.error('Could not load bot profile:', botRes.error);
      if (npcRes.error) console.error('Could not load npc profile:', npcRes.error);
      showMissing();
      return;
    }
    currentBot = profile;
    currentIsCustom = isCustomBot;
    applyBotToDOM(profile);

    // every post / reply the bot has made is found through bot_user_id.
    // the follower sync and follow lookup run at the same time instead of one after another
    const [postsRes, repliesRes, freshBase, freshFollowing] = await Promise.all([
      supabaseClient.from('posts')
        .select('id, content, like_count, dislike_count, repost_count, created_at', { count: 'exact' })
        .eq('bot_user_id', id)
        .order('created_at', { ascending: false })
        .limit(50),
      supabaseClient.from('post_replies')
        .select('id, post_id, parent_reply_id, content, created_at', { count: 'exact' })
        .eq('bot_user_id', id)
        .order('created_at', { ascending: false })
        .limit(50),
      resolveFollowers(id),
      lookupFollow(userId, id),
    ]);
    if (postsRes.error) console.error('Could not load bot posts:', postsRes.error);
    if (repliesRes.error) console.error('Could not load bot replies:', repliesRes.error);

    const posts = postsRes.data || [];
    const replies = repliesRes.data || [];
    const postCount = postsRes.count ?? posts.length;
    const replyCount = repliesRes.count ?? replies.length;

    renderPosts(posts);
    renderReplies(replies);
    $('postsTabCount').textContent = '(' + postCount + ')';
    $('repliesTabCount').textContent = '(' + replyCount + ')';

    // a failed sync / lookup keeps whatever the cache already showed
    if (freshBase !== null) baseFollowers = freshBase;
    if (freshFollowing !== null) isFollowing = freshFollowing;
    updateFollowBtn();
    showCount($('statFollowers'), baseFollowers + (isFollowing ? 1 : 0));
    showCount($('statFollowing'), BOT_FOLLOWING_PLACEHOLDER);
    showCount($('statPosts'), postCount);

    if (userId) writeLocal(botCacheKey(userId, id), { base: baseFollowers, following: isFollowing, posts: postCount });
  }
</script>
<script>
  /* ---------- edit sheet (3 dots) ---------- */
  const ARCHETYPES = [
    { archetype: 'optimist', voice: 'finds something genuinely nice to say even about mundane posts, uses warm/soft language', traits: ['encouraging', 'earnest', 'sees the bright side'] },
    { archetype: 'jokester', voice: 'cracks jokes, puns, or absurd tangents off almost anything, rarely serious for more than a line', traits: ['playful', 'sarcastic-but-friendly', 'loves a bit'] },
    { archetype: 'conspiracy theorist', voice: "connects unrelated things into a 'pattern', drops vague hints about 'what theyre not telling you'", traits: ['suspicious', 'tangential', "convinced there's a bigger picture"] },
    { archetype: 'doomer', voice: "responds to almost anything with mild despair or 'well its over' energy, deadpan rather than dramatic", traits: ['fatalistic', 'resigned', 'bleakly funny'] },
    { archetype: 'skeptic', voice: "pokes holes in whatever's being said, asks pointed follow-up questions, rarely takes a claim at face value", traits: ['questioning', 'measured', 'asks for evidence'] },
    { archetype: 'cynic', voice: 'assumes the worst take on everything, short and deadpan, rarely uses exclamation points', traits: ['dismissive', 'unimpressed', 'world-weary'] },
    { archetype: 'ragebaiter', voice: 'exaggerates minor annoyances into big complaints, picks fights over nothing, leans into caps or bold claims', traits: ['combative', 'hyperbolic', 'contrarian for the reaction'] },
  ];

  // same trait sliders / overall grid as profile.html (1-11, 6 = balanced)
  const BOT_TRAITS = [
    { id: 'kindness', name: 'Kindness', axis: 'warmth', value: 6, labels: { 1: 'Compassionate', 2: 'Kind', 3: 'Patient', 4: 'Honest', 5: 'Pragmatic', 6: 'Balanced', 7: 'Stubborn', 8: 'Competitive', 9: 'Arrogant', 10: 'Cynical', 11: 'Vindictive' } },
    { id: 'courage', name: 'Courage', axis: 'energy', value: 6, labels: { 1: 'Timid', 2: 'Fearful', 3: 'Cautious', 4: 'Careful', 5: 'Guarded', 6: 'Balanced', 7: 'Confident', 8: 'Assertive', 9: 'Daring', 10: 'Reckless', 11: 'Bold' } },
    { id: 'charisma', name: 'Charisma', axis: 'energy', value: 6, labels: { 1: 'Reserved', 2: 'Guarded', 3: 'Shy', 4: 'Modest', 5: 'Composed', 6: 'Balanced', 7: 'Playful', 8: 'Charming', 9: 'Flirty', 10: 'Seductive', 11: 'Irresistible' } },
  ];
  const OVERALL_GRID = {
    'high-high': 'Icon', 'high-neutral': 'Sweetheart', 'high-low': 'Guardian',
    'neutral-high': 'Maverick', 'neutral-neutral': 'Independent', 'neutral-low': 'Wallflower',
    'low-high': 'Villain', 'low-neutral': 'Rebel', 'low-low': 'Enigma',
  };
  const OVERALL_DESCRIPTIONS = {
    Icon: 'Warm and high-energy. People are drawn to you, and you know how to work a room without losing your heart.',
    Sweetheart: 'High warmth, low-key energy. Genuinely kind, easy to trust, and not out to prove anything.',
    Guardian: 'Warm but guarded. You care deeply and protect the people close to you, even if you don\u2019t show it loudly.',
    Maverick: 'Neutral warmth, big energy. Bold, unpredictable, and doing your own thing regardless of who\u2019s watching.',
    Independent: 'Balanced across the board. Not driven by warmth or energy extremes; you make your own calls.',
    Wallflower: 'Neutral warmth, low-key energy. Quiet and steady, more comfortable observing than performing.',
    Villain: 'Low warmth, high energy. Sharp, intense, and not afraid to make enemies to get where you\u2019re going.',
    Rebel: 'Low warmth, neutral energy. Cold on the surface and allergic to rules, but not chasing chaos for its own sake.',
    Enigma: 'Low warmth, low-key energy. Hard to read, keeps people guessing, and gives away very little.',
  };

  const overlay = $('editOverlay');
  const traitsContainer = $('traitsContainer');
  let pendingAvatar = null;
  let pendingHeader = null;
  let selectedArchetype = null;

  function parsePersonality(raw) {
    if (!raw) return null;
    if (typeof raw === 'string') { try { return JSON.parse(raw); } catch (e) { return null; } }
    return raw;
  }

  // shrink uploads before they go into a text column as a data URL
  function fileToDataUrl(file, maxSize) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* npc archetype buttons */
  function renderArchetypes() {
    const grid = $('archetypeGrid');
    grid.innerHTML = '';
    ARCHETYPES.forEach((a) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'archetype-btn' + (a.archetype === selectedArchetype ? ' selected' : '');
      btn.textContent = a.archetype;
      btn.addEventListener('click', () => {
        selectedArchetype = a.archetype;
        renderArchetypes();
      });
      grid.appendChild(btn);
    });
    const chosen = ARCHETYPES.find((a) => a.archetype === selectedArchetype);
    $('archetypeVoice').textContent = chosen ? chosen.voice : 'Pick one. It replaces their current personality.';
  }

  /* bot trait sliders */
  const overallPopup = $('overallPopup');
  function buildTraitSliders(saved) {
    traitsContainer.innerHTML = '';
    BOT_TRAITS.forEach((trait) => {
      const savedValue = Number(saved?.traits?.[trait.id]?.value);
      trait.value = savedValue >= 1 && savedValue <= 11 ? savedValue : 6;
      const row = document.createElement('div');
      row.className = 'trait-row';
      row.innerHTML = `
        <div class="trait-name">${trait.name}</div>
        <div class="slider-row">
          <span class="per-label-edge">${trait.labels[1]}</span>
          <input type="range" min="1" max="11" value="${trait.value}" class="per-slider" data-trait="${trait.id}">
          <span class="per-label-edge">${trait.labels[11]}</span>
        </div>`;
      traitsContainer.appendChild(row);
    });
    updatePersonality();
  }

  function bandFromScore(score) { return score >= 2 ? 'high' : score <= -2 ? 'low' : 'neutral'; }

  function updatePersonality() {
    $('traitTags').innerHTML = '';
    let warmth = 0, energy = 0;
    BOT_TRAITS.forEach((trait) => {
      const input = traitsContainer.querySelector(`[data-trait="${trait.id}"]`);
      const val = parseInt(input.value, 10);
      trait.value = val;
      input.style.setProperty('--val', val);
      const deviation = 6 - val;
      if (trait.axis === 'warmth') warmth += deviation;
      if (trait.axis === 'energy') energy += -deviation;
      const chip = document.createElement('span');
      chip.className = 'trait-chip';
      chip.textContent = `${trait.name}: ${trait.labels[val]}`;
      $('traitTags').appendChild(chip);
    });
    const label = OVERALL_GRID[`${bandFromScore(warmth)}-${bandFromScore(energy)}`];
    $('overallType').textContent = label;
    $('overallPopupTitle').textContent = label;
    $('overallPopupText').textContent = OVERALL_DESCRIPTIONS[label];
  }
  traitsContainer.addEventListener('input', updatePersonality);
  $('overallTrigger').addEventListener('click', (e) => { e.stopPropagation(); overallPopup.classList.toggle('visible'); });
  overlay.addEventListener('click', (e) => {
    if (!$('overallTrigger').contains(e.target)) overallPopup.classList.remove('visible');
    if (e.target === overlay) closeEdit();
  });

  /* open / close */
  function openEdit() {
    if (!currentBot) return;
    const bot = currentBot;
    pendingAvatar = null;
    pendingHeader = null;
    $('editError').hidden = true;
    $('editTitle').textContent = currentIsCustom ? 'Edit bot' : 'Edit NPC';
    $('editName').value = bot.display_name || '';

    $('editAvatarImg').src = $('fameAvatarImg').src;
    if (bot.header_url) { $('editHeaderImg').src = bot.header_url; $('editHeaderImg').hidden = false; $('editBannerText').hidden = true; }
    else { $('editHeaderImg').hidden = true; $('editBannerText').hidden = false; }

    // npcs are plain on purpose: no bio field for them
    $('editBioWrap').hidden = !currentIsCustom;
    $('editBio').value = bot.bio || '';
    $('editBioCount').textContent = ($('editBio').value.length) + '/150';

    const personality = parsePersonality(bot.personality);
    $('npcPersonality').hidden = currentIsCustom;
    $('botPersonality').hidden = !currentIsCustom;
    if (currentIsCustom) {
      buildTraitSliders(personality);
    } else {
      selectedArchetype = personality?.archetype || null;
      renderArchetypes();
    }

    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
  }

  function closeEdit() {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
  }

  $('moreBtn').addEventListener('click', openEdit);
  $('editCloseBtn').addEventListener('click', closeEdit);
  $('editCancelBtn').addEventListener('click', closeEdit);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEdit(); });

  $('editBio').addEventListener('input', () => { $('editBioCount').textContent = $('editBio').value.length + '/150'; });
  $('editBanner').addEventListener('click', () => $('editHeaderInput').click());
  $('editAvatar').addEventListener('click', (e) => { e.stopPropagation(); $('editAvatarInput').click(); });

  $('editHeaderInput').addEventListener('change', async function () {
    if (!this.files[0]) return;
    pendingHeader = await fileToDataUrl(this.files[0], 1000);
    $('editHeaderImg').src = pendingHeader;
    $('editHeaderImg').hidden = false;
    $('editBannerText').hidden = true;
  });
  $('editAvatarInput').addEventListener('change', async function () {
    if (!this.files[0]) return;
    pendingAvatar = await fileToDataUrl(this.files[0], 320);
    $('editAvatarImg').src = pendingAvatar;
  });

  /* save */
  $('editSaveBtn').addEventListener('click', async () => {
    const saveBtn = $('editSaveBtn');
    const errorEl = $('editError');
    errorEl.hidden = true;

    const name = $('editName').value.trim();
    if (!name) { errorEl.textContent = 'Display name can\u2019t be empty.'; errorEl.hidden = false; return; }

    const update = { display_name: name };
    if (pendingAvatar) update.avatar_url = pendingAvatar;
    if (pendingHeader) update.header_url = pendingHeader;

    if (currentIsCustom) {
      update.bio = $('editBio').value.trim();
      update.personality = {
        traits: BOT_TRAITS.reduce((acc, trait) => {
          acc[trait.id] = { value: trait.value, label: trait.labels[trait.value] };
          return acc;
        }, {}),
        overallType: $('overallType').textContent,
        overallDescription: OVERALL_DESCRIPTIONS[$('overallType').textContent],
      };
    } else if (selectedArchetype) {
      // replaces whatever was in the personality column
      const chosen = ARCHETYPES.find((a) => a.archetype === selectedArchetype);
      update.personality = { voice: chosen.voice, traits: chosen.traits, archetype: chosen.archetype };
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    const table = currentIsCustom ? 'bot_profiles' : 'npc_profiles';
    const { data, error } = await supabaseClient.from(table).update(update).eq('id', currentBot.id).select().maybeSingle();
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';

    if (error || !data) {
      console.error('Could not save ' + table + ':', error);
      errorEl.textContent = error
        ? 'Couldn\u2019t save: ' + error.message
        : 'Couldn\u2019t save. Nothing was updated (check the table\u2019s update permissions).';
      errorEl.hidden = false;
      return;
    }

    currentBot = data;
    applyBotToDOM(data);
    closeEdit();
  });
</script>
<script>
  /* ---------- back button: return to whichever page the user came from ---------- */
  document.getElementById('backBtn').addEventListener('click', () => {
    // history.back() so a post opened from post.html?id=... comes back to that exact post
    if (document.referrer && new URL(document.referrer).origin === window.location.origin) {
      history.back();
      return;
    }
    window.location.href = sessionStorage.getItem('spotlight-last-page') || 'Feed.html';
  });

  /* ---------- sparkles inside fame card ---------- */
  const fameCard = document.getElementById('fameCard');
  const sparklePositions = [
    {top:'58%', left:'88%', size:4, delay:'0s'},
    {top:'74%', left:'8%', size:3, delay:'.8s'},
    {top:'90%', left:'70%', size:5, delay:'1.6s'},
    {top:'66%', left:'50%', size:3, delay:'2.2s'},
  ];
  sparklePositions.forEach(s => {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.style.top = s.top; el.style.left = s.left;
    el.style.width = s.size+'px'; el.style.height = s.size+'px';
    el.style.animationDelay = s.delay;
    fameCard.appendChild(el);
  });

  /* ---------- avatar progress ring ---------- */
  const AVATAR_R = 37, AVATAR_C = 2*Math.PI*AVATAR_R;
  const avatarRing = document.getElementById('avatarRing');
  avatarRing.style.strokeDasharray = AVATAR_C;
  function setAvatarRing(pct){
    const offset = AVATAR_C * (1 - pct/100);
    avatarRing.style.strokeDashoffset = offset;
  }
  requestAnimationFrame(() => setTimeout(() => setAvatarRing(100), 150));

  /* ---------- count-up stats ---------- */
  function countUp(el, target){
    const duration = 900;
    const t0 = performance.now();
    // a newer countUp / snap on the same element cancels this one so a stale animation can't overwrite it
    el._cu = (el._cu || 0) + 1;
    const run = el._cu;
    function tick(now){
      if (el._cu !== run) return;
      const p = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = formatCount(Math.round(target * eased));
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = formatCount(target);
    }
    requestAnimationFrame(tick);
  }

  // first value counts up from 0, later values (cache -> fresh, follow / unfollow) snap
  function showCount(el, value){
    if (el.dataset.shown === String(value)) return;
    if (el.dataset.shown === undefined) {
      countUp(el, value);
    } else {
      el._cu = (el._cu || 0) + 1;
      el.textContent = formatCount(value);
    }
    el.dataset.shown = String(value);
  }

  /* ---------- tabs ---------- */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  /* ---------- follow toggle: following adds +1 to the follower count ---------- */
  const followBtn = document.getElementById('followBtn');
  function updateFollowBtn(){
    followBtn.classList.toggle('following', isFollowing);
    followBtn.textContent = isFollowing ? 'Following' : 'Follow';
  }
  // follows are stored in the `follows` table: one row per (follower_id, following_id).
  // iconpage.js counts the rows where follower_id = the signed-in user for its Following stat.
  async function saveFollow(botId, follow){
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return { error: { message: 'not signed in' } };
    if (follow) {
      const res = await supabaseClient.from('follows')
        .insert({ follower_id: user.id, following_id: botId });
      // 23505 = already following (row exists), which is fine
      if (res.error && res.error.code === '23505') return { error: null };
      return res;
    }
    return supabaseClient.from('follows')
      .delete()
      .eq('follower_id', user.id)
      .eq('following_id', botId);
  }

  let followBusy = false;
  followBtn.addEventListener('click', async () => {
    if (!currentBot || followBusy) return;
    followBusy = true;
    const botId = currentBot.id;
    const wasFollowing = isFollowing;

    // optimistic ui, rolled back if supabase says no
    isFollowing = !wasFollowing;
    updateFollowBtn();
    showCount($('statFollowers'), baseFollowers + (isFollowing ? 1 : 0));

    const { error } = await saveFollow(botId, isFollowing);
    let errEl = document.getElementById('followError');
    if (!errEl) {
      errEl = document.createElement('p');
      errEl.id = 'followError';
      errEl.className = 'sheet-error';
      errEl.hidden = true;
      document.querySelector('.profile-actions').after(errEl);
    }
    if (error) {
      console.error('Could not save follow:', error);
      // show the real reason on the page so a failed save isn't silent
      errEl.textContent = 'Couldn’t save follow: ' + (error.message || 'unknown error') + (error.code ? ' (' + error.code + ')' : '');
      errEl.hidden = false;
      isFollowing = wasFollowing;
      updateFollowBtn();
      showCount($('statFollowers'), baseFollowers + (isFollowing ? 1 : 0));
    } else {
      errEl.hidden = true;
      // keep the cache in step with what supabase now has
      const userId = await fastUserId();
      if (userId) {
        const entry = readLocal(botCacheKey(userId, botId)) || {};
        writeLocal(botCacheKey(userId, botId), { ...entry, base: baseFollowers, following: isFollowing });
        bumpFollowingCache(userId, isFollowing ? 1 : -1);
      }
    }
    followBusy = false;
  });

  /* ---------- message button: open a dm thread with this user ---------- */
  const messageBtn = document.getElementById('messageBtn');
  messageBtn.addEventListener('click', () => {
    sessionStorage.setItem('spotlight-dm-return', window.location.href);
    if (!messageBtn.dataset.user) return;
    window.location.href = 'messages.html?user=' + encodeURIComponent(messageBtn.dataset.user);
  });

  loadBotProfile();
</script>
</body>

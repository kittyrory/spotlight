<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight | Edit Profile</title>
    <script>
      (function () {
        var saved = localStorage.getItem("spotlight-theme");
        if (saved) {
          document.documentElement.setAttribute("data-theme", saved);
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: radial-gradient(
          ellipse at top,
          var(--bg-glow) 0%,
          var(--bg) 55%
        );
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 20px 0 60px;
      }
      .phone {
        width: 100%;
        max-width: 430px;
        padding: 0 18px;
        position: relative;
      }

      /* ---------- topbar ---------- */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .topbar-title {
        font-weight: 800;
        font-size: 16px;
      }
      .circle-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--surface-1);
        border: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-dim);
        cursor: pointer;
      }
      .circle-btn:hover {
        color: var(--gold);
        border-color: rgba(245, 196, 81, 0.35);
      }
      .spacer-38 {
        width: 38px;
        height: 38px;
      }

      /* ---------- fame card (banner + avatar) ---------- */
      .fame-card {
        position: relative;
        border-radius: 28px;
        background: linear-gradient(
          165deg,
          var(--fame-grad-1) 0%,
          var(--fame-grad-2) 60%,
          var(--fame-grad-3) 100%
        );
        border: 1.5px solid rgba(245, 196, 81, 0.28);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .fame-banner {
        position: relative;
        height: 150px;
        background: var(--fame-grad-1);
        overflow: hidden;
        cursor: pointer;
      }
      .fame-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .fame-banner::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.4) 0%,
          rgba(0, 0, 0, 0.05) 55%,
          rgba(10, 9, 6, 0.35) 100%
        );
        pointer-events: none;
      }
      .fame-banner-edit {
        position: absolute;
        bottom: 10px;
        right: 12px;
        z-index: 2;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(10, 9, 6, 0.55);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(245, 196, 81, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f5e6bf;
        cursor: pointer;
      }
      .fame-banner-edit:hover {
        background: rgba(10, 9, 6, 0.75);
      }

      .fame-body {
        padding: 0 22px 22px;
        position: relative;
        text-align: center;
      }
      .avatar-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        margin: -44px auto 0;
      }
      .avatar-photo {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid var(--fame-edge);
        background: var(--surface-1);
        cursor: pointer;
      }
      .avatar-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .avatar-edit {
        position: absolute;
        bottom: -2px;
        right: -2px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1a1408;
        border: 2px solid var(--fame-edge);
        cursor: pointer;
      }

      /* ---------- edit form card ---------- */
      .edit-card {
        margin-top: 18px;
        background: linear-gradient(
          180deg,
          var(--surface-grad-1) 0%,
          var(--surface-grad-2) 100%
        );
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 20px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .field + .field {
        margin-top: 18px;
      }
      .field label {
        font-weight: 700;
        font-size: 12.5px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .field input,
      .field textarea {
        width: 100%;
        background: var(--surface-1);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        color: var(--ink);
        font-size: 14.5px;
        padding: 12px 14px;
        outline: none;
        transition: border-color 0.2s ease;
      }
      .field input::placeholder,
      .field textarea::placeholder {
        color: var(--ink-faint);
      }
      .field input:focus,
      .field textarea:focus {
        border-color: rgba(245, 196, 81, 0.45);
      }
      .field textarea {
        min-height: 84px;
        resize: none;
        line-height: 1.5;
      }

      /* ---------- actions ---------- */
      .edit-actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }
      .btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14.5px;
        padding: 13px 0;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.2s ease,
          transform 0.15s ease;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-solid {
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        color: #1a1408;
        border: none;
      }
      .btn-outline {
        background: transparent;
        border: 1.5px solid var(--card-border);
        color: var(--ink-dim);
      }
      .btn-outline:hover {
        border-color: rgba(245, 196, 81, 0.35);
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="topbar">
        <button
          class="circle-btn"
          id="backBtn"
          aria-label="Go back"
          type="button"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <div class="topbar-title">Edit Profile</div>
        <button
          class="circle-btn"
          id="theme-toggle"
          aria-label="Toggle light/dark mode"
          type="button"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3v2" />
            <path d="M12 19v2" />
            <path d="m4.22 4.22 1.42 1.42" />
            <path d="m18.36 18.36 1.42 1.42" />
            <path d="M3 12h2" />
            <path d="M19 12h2" />
            <path d="m4.22 19.78 1.42-1.42" />
            <path d="m18.36 5.64 1.42-1.42" />
            <circle cx="12" cy="12" r="4" />
          </svg>
        </button>
      </div>

      <div class="fame-card">
        <div class="fame-banner" id="bannerClickArea">
          <img
            id="banner-Img"
            src="https://picsum.photos/seed/eventsbanner/860/340"
            alt=""
          />
          <div
            class="fame-banner-edit"
            id="bannerEditBtn"
            role="button"
            aria-label="Change banner image"
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
              />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </div>
          <input id="bannerFile" type="file" accept="image/*" hidden />
        </div>

        <div class="fame-body">
          <div class="avatar-wrap">
            <div class="avatar-photo" id="avatarClickArea">
              <img
                id="avatar-Img"
                src="https://picsum.photos/seed/ariavance/200/200"
                alt=""
              />
            </div>
            <div
              class="avatar-edit"
              id="avatarEditBtn"
              role="button"
              aria-label="Change avatar image"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </div>
            <input id="avatarFile" type="file" accept="image/*" hidden />
          </div>
        </div>
      </div>

      <div class="edit-card">
        <div class="field">
          <label for="name-input">Name</label>
          <input type="text" id="name-input" placeholder="Enter name" />
        </div>
        <div class="field">
          <label for="handle-input">Handle</label>
          <input type="text" id="handle-input" placeholder="Enter handle" />
        </div>
        <div class="field">
          <label for="bio-input">Bio</label>
          <textarea id="bio-input" placeholder="Enter bio"></textarea>
        </div>

        <div class="edit-actions">
          <a id="cancelProfileLink" class="btn btn-outline" href="IconPage.html"
            >Cancel</a
          >
          <a id="save-profile-btn" class="btn btn-solid">Save</a>
        </div>
      </div>
    </div>

    <script>
      // ---------- JS ---------- //
      const saveBtn = document.getElementById("save-profile-btn");
      const avatarImg = document.getElementById("avatar-Img");
      const avatarFile = document.getElementById("avatarFile");
      const avatarClickArea = document.getElementById("avatarClickArea");
      const avatarEditBtn = document.getElementById("avatarEditBtn");
      const bannerImag = document.getElementById("banner-Img");
      const bannerFile = document.getElementById("bannerFile");
      const bannerClickArea = document.getElementById("bannerClickArea");
      const bannerEditBtn = document.getElementById("bannerEditBtn");
      const backBtn = document.getElementById("backBtn");
      const handle = document.getElementById("handle-input");
      const name = document.getElementById("name-input");
      const bio = document.getElementById("bio-input");
      const iconPage = "IconPage.html";

      //helper: read a file as a base64 data URL so it survives page navigation//
      //(blob: URLs from createObjectURL only live as long as this document does)//
      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      //banner: click the image itself or its edit button to open the file picker//
      bannerClickArea.addEventListener("click", () => bannerFile.click());
      bannerEditBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        bannerFile.click();
      });
      bannerFile.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (file) {
          const dataUrl = await readFileAsDataUrl(file);
          bannerImag.src = dataUrl;
          localStorage.setItem("savedBanner", dataUrl);
        }
      });

      //avatar: click the image itself or its edit button to open the file picker//
      avatarClickArea.addEventListener("click", () => avatarFile.click());
      avatarEditBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        avatarFile.click();
      });
      avatarFile.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (file) {
          const dataUrl = await readFileAsDataUrl(file);
          avatarImg.src = dataUrl;
          localStorage.setItem("savedAvatar", dataUrl);
        }
      });

      //pre-fill the form with whatever's already saved//
      (function prefillForm() {
        const localData = localStorage.getItem("savedProfile");
        if (localData) {
          try {
            const parsed = JSON.parse(localData);
            name.value = parsed.name || "";
            handle.value = parsed.handle || "";
            bio.value = parsed.bio || "";
          } catch (e) {}
        }
        const savedAvatar = localStorage.getItem("savedAvatar");
        const savedBanner = localStorage.getItem("savedBanner");
        if (savedAvatar) avatarImg.src = savedAvatar;
        if (savedBanner) bannerImag.src = savedBanner;
      })();

      //back button: same behavior as cancel//
      backBtn.addEventListener("click", () => {
        window.location.href = iconPage;
      });

      //update changes//
      saveBtn.addEventListener("click", (e) => {
        e.preventDefault(); // Securely blocks the link from navigating early

        const profileData = {
          name: name.value,
          handle: handle.value,
          bio: bio.value,
        };

        // Save data package to browser memory
        localStorage.setItem("savedProfile", JSON.stringify(profileData));

        // Go back to the profile page so the changes are visible
        window.location.href = iconPage;
      });
    </script>
    <script src="scripts/theme.js"></script>
  </body>
</html>

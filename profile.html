<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width initial-scale=1.0">
  <title>Spotlight | Profile Setup</title>

  <script>
    // apply saved theme immediately to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem('spotlight-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

    <link rel="stylesheet" href="style.css" />
    <style>
      :root, [data-theme="dark"] {
        --val: 0;
        --border-strong: rgba(245, 196, 81, 0.35);
      }

      [data-theme="light"] {
        --val: 0;
        --border-strong: rgba(245, 196, 81, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      #theme-toggle {
        position: fixed;
        top: clamp(16px, 3vw, 32px);
        left: clamp(16px, 3vw, 32px);
        z-index: 30;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1.5px solid var(--toggle-border);
        background-color: transparent;
        color: var(--ink);
        font-size: 1.1rem;
        cursor: pointer;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
      }

      #theme-toggle:hover {
        border-color: var(--gold);
        box-shadow: 0 0 12px var(--toggle-hover-shadow);
      }

      #theme-toggle:active {
        transform: scale(0.92);
      }

      #theme-toggle svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      [data-theme="dark"] #theme-toggle .icon-moon,
      [data-theme="light"] #theme-toggle .icon-sun {
        display: none;
      }

      /* ── BANNER CONTAINER ── */
      .header-preview-box {
        width: 100%;
        height: 160px;
        background-color: var(--card);
        border: 1px solid var(--border);
        position: relative;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 55px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        overflow: visible !important;
        z-index: 10;
      }

      .header-preview-box:hover {
        background-color: var(--surface-hover);
      }

      .banner-placeholder-text {
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--muted);
        font-size: 14px;
        ;
      }

      #header-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      /* ── TWITTER-STYLE AVATAR ── */

      .avatar-circle {
        position: absolute;
        bottom: -40px;
        left: 24px;
        width: 85px;
        height: 85px;
        background: var(--surface-1);
        border: 2px solid var(--bg);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
        transition: border-color 0.2s ease;
        box-shadow: 0 4px 12px rgba(4, 4, 4, 0.5);
        border-color: var(--gold);
        z-index: 20;
      }

      .avatar-circle:hover {
        transform: scale(1.02);
      }

      #avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
        border-radius: 50%;
        z-index: 21;
      }

      /* Stylized "Add Pic" Text Layout */
      .avatar-prompt {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        line-height: 1.3;
        pointer-events: none;
        z-index: 2;
      }

      .avatar-prompt span {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--ink);
        opacity: 0.7;
      }

      /* ── TRIZA ── */
      .placeholder-text {
        color: var(--muted2);
        font-size: 11px;
        margin-top: 5px;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }

      input[type="file"] {
        display: none;
      }

      #placeholder-text,
      .file-name
      .browse-text {
        display: none;
      }

      .header-title {
        color: var(--ink);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.3px;
        margin: 0;
        text-align: center;
      }

      .header-spacer {
        width: 40px;
      }

      body {
        background: var(--bg);
        margin: 0 auto;
        color: var(--ink);
        width: 100%;
        max-width: 500px;
        padding: 40px 20px;
        padding-top: 60px;
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      .section-divider {
        width: 100%;
        position: relative;
        height: 1px;
        background-color: var(--divider);
        margin: 24px;
        margin-bottom: 24px;
        border: none;
      }
      .icon {
        font-size: 24px;
        background-color: var(--bg);
        padding: 16px;
        border: 1px solid var(--border-strong);
        justify-content: center;
        border-radius: 12px;
        box-sizing: border-box;
        margin-bottom: 15px;
        display: inline-flex;
        align-items: center;
        height: 50px;
        width: 50px;
        text-align: left;
      }
      .profile-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
        font-size: 12px;
        color: var(--muted);
      }
      .profile-text h2 {
        color: var(--ink);
        font-size: medium;
        font-weight: 600;
        margin: 0;
      }
      .form-selection {
        display: flex;
        font-weight: 600;
        flex-direction: column;
        gap: 8px;
        margin: 20px 0;
        color: var(--ink);
      }
      .field-input {
        background: transparent;
        border: none;
        color: var(--ink);
        font-size: 16px;
        padding: 4px 0;
        outline: none;
        width: 100%;
        border-color: #3333;
      }
      .handle-prefix {
        color: var(--ink);
        font-size: 16px;
        user-select: none;
      }
      .form-input {
        box-sizing: border-box;
        background-color: var(--card);
        border: 1px solid var(--border-strong);
        border-radius: 12px !important;
        color: var(--ink) !important;
        font-size: 14px;
        width: 100%;
        outline: none !important;
        padding: 16px !important;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .form-input::placeholder {
        color: var(--muted2);
      }

      .form-input.error {
        border-color: #e25555 !important;
        box-shadow: 0 0 0 3px #e2555533;
        animation: shake 0.3s ease;
      }

      .error-msg {
        font-size: 0.75rem;
        color: #e25555;
        margin-top: 2px;
        padding-left: 2px;
        display: none;
        font-weight: normal;
      }

      .error-msg.visible {
        display: block;
      }

      @keyframes shake {
        0%   { transform: translateX(0); }
        25%  { transform: translateX(-6px); }
        50%  { transform: translateX(6px); }
        75%  { transform: translateX(-4px); }
        100% { transform: translateX(0); }
      }

      .profile-text p {
        color: var(--ink);
        font-size: 11px !important;
        margin: 2px 0 0;
      }

      .bio-selection {
        width: 100%;
        box-sizing: border-box;
        margin-top: 24px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .bio-title {
        color: var(--ink);
        font-size: 16px;
        font-weight: 900;
      }

      .gameplay-badge {
        color: #ffcc00;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-shadow: 0 0 5px #ffeb9c;
      }

      .bio-box-container {
        background-color: var(--card);
        border: 1px solid var(--border-strong);
        border-radius: 12px !important;
        padding: 12px 14px !important;
        position: relative;
        display: flex;
        flex-direction: column;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .bio-box-container.error {
        border-color: #e25555 !important;
        box-shadow: 0 0 0 3px #e2555533;
        animation: shake 0.3s ease;
      }
      .bio-box-container.border-disrupter { border-color: #ff4133; }
      .bio-box-container.border-professional { border-color: #33ccff; }
      .bio-box-container.border-fan-favorite { border-color: #5cd65c; }
      .bio-box-container.border-enigma { border-color: var(--border-strong); }

      .bio-input {
        background: transparent;
        border: none;
        color: var(--ink);
        font-size: 14px !important;
        line-height: 1.5;
        width: 100%;
        height: 55px;
        resize: none;
        outline: none;
        padding: 0;
      }

      .bio-input::placeholder {
        color: var(--muted2);
      }

      .char-counter {
        align-self: flex-end;
        color: var(--ink-faint) !important;
        font-size: 10px;
        margin-top: 4px !important;
      }

      .bio-suggestions {
        color: var(--ink-faint);
        font-size: 11px !important;
        margin: 8px 0 0 0 !important;
      }

      .bio-suggestions span {
        font-style: italic;
        color: var(--ink-faint);
      }

      .profile-card:hover {
        border-color: #ffd700 !important;
        background-color: var(--surface-hover) !important;
        transition: all 0.2s ease;
      }

      .per-selection {
        width: 100%;
        margin-top: 24px;
        display: block !important;
      }

      .per-title {
        color: var(--ink);
        font-size: 16px;
        font-weight: 900;
      }

      /* --------------- */

      .slider-container {
        background-color: var(--card);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        padding: 16px 14px;
        margin-top: 10px;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .per-label-edge {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted2);
        white-space: nowrap;
      }

      .per-slider {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(to right,
        var(--gold) 0%,
        var(--gold) calc((var(--val, 6) - 1) / 10 * 100%),
        var(--muted) calc((var(--val, 6) - 1) / 10 * 100%),
        var(--muted) 100%);
        outline: none;
        cursor: pointer;
      }

      .per-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--gold);
        border: 2px solid var(--bg);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition: transform 0.15s;
        margin-top: calc((4px - 18px) / 2);
      }

      .per-slider::-webkit-slider-thumb:hover {
        transform: scale(1.2);
      }

      .per-slider::-moz-range-track {
        height: 4px;
        border-radius: 4px;
        background: var(--muted);
      }

      .per-slider::-moz-range-progress {
        height: 4px;
        border-radius: 4px;
        background: var(--gold);
      }

      .per-slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--gold);
        border: 2px solid var(--bg);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition: transform 0.15s;
      }

      .per-slider::-moz-range-thumb:hover {
        transform: scale(1.2);
      }

      .per-slider:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .per-value {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted2);
      }

      .per-value span {
        color: var(--gold);
        font-weight: 600;
      }

      /* trait slider rows (repeated inside .slider-container) */
      .trait-row {
        margin-bottom: 18px;
      }

      .trait-row:last-child {
        margin-bottom: 0;
      }

      .trait-name {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }

      /* personality summary (chips + overall) */
      .personality-summary {
        margin-top: 12px;
        padding: 14px;
        background-color: var(--card);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
      }

      .trait-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }

      .trait-chip {
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 20px;
        background-color: var(--bg);
        border: 1px solid var(--border);
        color: var(--ink);
      }

      .overall-line {
        font-size: 12px;
        color: var(--muted2);
        border-top: 1px solid var(--divider);
        padding-top: 10px;
      }

      .overall-line span {
        color: var(--gold);
        font-weight: 700;
      }

      .overall-line {
        position: relative;
      }

      .overall-trigger {
        position: relative;
        cursor: pointer;
      }

      .overall-underline {
        color: var(--gold);
        font-weight: 700;
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 3px;
      }

      .overall-popup {
        display: none;
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        width: 220px;
        background-color: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        z-index: 40;
        cursor: default;
      }

      .overall-trigger:hover .overall-popup,
      .overall-popup.visible {
        display: block;
      }

      .overall-popup-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--gold);
        margin-bottom: 6px;
      }

      .overall-popup-text {
        font-size: 12px;
        line-height: 1.5;
        color: var(--ink);
      }

      /* ------------------ */

      .cont {
        background-color: var(--gold);
        border: none;
        width: 100%;
        height: 50px;
        border-radius: 10px;
        margin-top: 10px;
        font-size: 18px;
        cursor: pointer;
        display: block;
        color: black;
        transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
      }

      .cont:hover {
        background: #FFD500;
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(201, 149, 42, 0.3);
      }

      .cont:active {
        transform: scale(0.98);
      }

      .back {
        width: 100%;
        border: 1px solid var(--back-border);
        border-radius: 10px;
        background-color: var(--bg);
        color: var(--back-color);
        margin-top: 10px;
        height: 50px;
        align-items: center;
        text-align: center;
        display: flex;
        justify-content: center;
        cursor: pointer;
        font-size: 15px;
        transition: color 0.15s, border-color 0.15s;
      }

      .back:hover {
        color: var(--back-hover-color);
        border: 1px solid var(--back-hover-color);
      }
    </style>
</head>

<body class="page-maximal">
  <button id="theme-toggle" aria-label="Toggle light/dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="4.5"></circle>
      <line x1="12" y1="1.5" x2="12" y2="4"></line>
      <line x1="12" y1="20" x2="12" y2="22.5"></line>
      <line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>
      <line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>
      <line x1="1.5" y1="12" x2="4" y2="12"></line>
      <line x1="20" y1="12" x2="22.5" y2="12"></line>
      <line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>
      <line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"></path>
    </svg>
  </button>

  <input type="file" id="header-input" accept="image/*" onchange="previewImage(this, 'header-img')" style="display: none;">
  <input type="file" id="avatar-input" accept="image/*" onchange="previewImage(this, 'avatar-img')" style="display: none;">

  <div class="header-preview-box" onclick="document.getElementById('header-input').click();">
    <img id="header-img" src="" alt="" style="display: none;">
    <div class="banner-placeholder-text" id="banner-text">Tap to add banner</div>

    <div class="avatar-circle" onclick="event.stopPropagation(); document.getElementById('avatar-input').click();">
      <img id="avatar-img" src="" alt="" style="display: none;">
      <div class="avatar-prompt">
        <span>Add</span>
        <span>Pic</span>
      </div>
    </div>
  </div>

  <div class="form-selection">
    <label class="profile-text">
      <h2>Display Name</h2>
    </label>
    <input id="display-name" type="text" class="form-input" placeholder="Your Stage Name">
    <p class="error-msg" id="display-name-error">Enter in a display name</p>
  </div>

  <div class="form-selection">
    <label class="section-title">Handle</label>
    <input id="handle" type="text" class="form-input" placeholder="@yourhandle">
    <p class="error-msg" id="handle-error">Enter a handle</p>
  </div>

  <div class="section-divider"></div>

  <div class="per-selection">
    <div class="header">
      <label class="per-title">Personality</label>
      <span class="gameplay-badge">⚡AFFECTS GAMEPLAY</span>
    </div>

    <div class="slider-container" id="traits-container">
      <!-- trait slider rows get injected here by JS -->
    </div>

    <div class="personality-summary" id="personality-summary">
      <div class="trait-tags" id="trait-tags"></div>
      <div class="overall-line">
        Overall:
        <span class="overall-trigger" id="overallTrigger">
          <span class="overall-underline" id="overallType">Independent</span>
          <div class="overall-popup" id="overallPopup">
            <div class="overall-popup-title" id="overallPopupTitle">Independent</div>
            <div class="overall-popup-text" id="overallPopupText"></div>
          </div>
        </span>
      </div>
    </div>
  </div>

  <div class="bio-selection">
    <div class="header">
      <label class="bio-title">Your Bio</label>
    </div>

    <div class="bio-box-container" id="bio-container">
      <textarea id="bio" class="bio-input" maxlength="150"
        placeholder="Tell the world who you are. Be iconic, be real, be chaotic-your words unlock hidden traits and shape how celebrities and fans treat you...."></textarea>
      <div class="char-counter" id="char-counter">0/150</div>
    </div>

    <p class="bio-suggestions">
      Try:
      <span>iconic</span>,
      <span>drama</span>,
      <span>love</span>,
      <span>dark</span>,
      <span>authentic</span>...
    </p>
    <p class="error-msg" id="bio-error">Write something - tell the world who you are!</p>

  <button class="cont" id="continue-btn">Continue →</button>
  <button class="back" id="back-btn">← Back</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="scripts/supabase.js"></script>
  <script src="scripts/theme.js"></script>
  <script>
    document.querySelectorAll('.option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
    });

    // image preview
    function previewImage(input, targetId) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const imgElement = document.getElementById(targetId);
        imgElement.src = e.target.result;
        imgElement.style.display = 'block';
        imgElement.style.opacity = '1';

        if (targetId === 'header-img') {
          const bannerText = document.getElementById('banner-text');
          if (bannerText) bannerText.style.display = 'none';
        } else {
          const avatarPrompt = document.querySelector('.avatar-prompt');
          if (avatarPrompt) avatarPrompt.style.display = 'none';
        }
      };
      reader.readAsDataURL(file);
    }

    // char counter
    const bioInput     = document.getElementById('bio');
    const charCounter  = document.getElementById('char-counter');

    bioInput.addEventListener('input', () => {
      charCounter.textContent = `${bioInput.value.length}/150`;
    });

    // validation helpers
    function showError(inputEl, errorEl) {
      inputEl.classList.remove('error');
      void inputEl.offsetWidth;
      inputEl.classList.add('error');
      errorEl.classList.add('visible');
    }

    function clearError(inputEl, errorEl) {
      inputEl.classList.remove('error');
      errorEl.classList.remove('visible');
    }

    // bio container needs separate handling since it's a wrapper
    function showBioError() {
      const container = document.getElementById('bio-container');
      const errorEl   = document.getElementById('bio-error');
      container.classList.remove('error');
      void container.offsetWidth;
      container.classList.add('error');
      errorEl.classList.add('visible');
    }

    function clearBioError() {
      document.getElementById('bio-container').classList.remove('error');
      document.getElementById('bio-error').classList.remove('visible');
    }

    // clear errors on input
    const displayNameInput = document.getElementById('display-name');
    const handleInput      = document.getElementById('handle');

    displayNameInput.addEventListener('input', () => clearError(displayNameInput, document.getElementById('display-name-error')));
    handleInput.addEventListener('input',      () => clearError(handleInput,      document.getElementById('handle-error')));
    bioInput.addEventListener('input',         () => clearBioError());

    // continue button linking
    document.getElementById('continue-btn').addEventListener('click', async () => {
      const nameVal   = displayNameInput.value.trim();
      const handleVal = handleInput.value.trim();
      const bioVal    = bioInput.value.trim();

      let hasError = false;

      if (!nameVal) {
        showError(displayNameInput, document.getElementById('display-name-error'));
        hasError = true;
      }
      if (!handleVal) {
        showError(handleInput, document.getElementById('handle-error'));
        hasError = true;
      }
      if (!bioVal) {
        showBioError();
        hasError = true;
      }

      if (hasError) {
        // scroll to first error
        const firstError = document.querySelector('.form-input.error, .bio-box-container.error');
        if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const continueBtn = document.getElementById('continue-btn');
      continueBtn.disabled = true;
      continueBtn.textContent = 'Saving...';

      const { data: { user }, error: userError } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        console.error('No logged in user:', userError);
        window.location.href = 'login.html';
        return;
      }


      // header/avatar images are stored as base64 data URLs straight from the file reader.
      // note (for myself): might bloat the profiles table, worth moving to supabase storage later
      const headerImgEl = document.getElementById('header-img');
      const avatarImgEl = document.getElementById('avatar-img');

      const avatarUrl = avatarImgEl.src.startsWith('data:') ? avatarImgEl.src : null;
      const headerUrl = headerImgEl.src.startsWith('data:') ? headerImgEl.src : null;

      // build the personality payload from the live trait sliders + derived overall type.
      // stored as a single jsonb column so we don't need one column per trait.
      const personalityPayload = {
        traits: traits.reduce((acc, trait) => {
          acc[trait.id] = {
            value: trait.value,
            label: trait.labels[trait.value],
          };
          return acc;
        }, {}),
        overallType: overallTypeEl.textContent,
        overallDescription: overallDescriptions[overallTypeEl.textContent]
      };

      const { error } = await supabaseClient
        .from('profiles')
        .upsert({
          id: user.id,
          username: user.user_metadata?.username || user.email?.split('@')[0],
          display_name: nameVal,
          handle: handleVal,
          bio: bioVal,
          avatar_url: avatarUrl,
          header_url: headerUrl,
          personality: personalityPayload
        });

      if (error) {
        console.error('Error saving profile:', error);
        continueBtn.disabled = false;
        continueBtn.textContent = 'Continue →';
        return;
      }

      window.location.href = sessionStorage.getItem('ref') === 'tutorial'
        ? 'tutorial-worlds.html'
        : 'world-selection.html';
    });

    // back button linking
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = 'origin.html';
    });

    // personality traits — each slider runs 1-11 with its own full label at every point,
    // same style as the original Compassionate --> Vindictive slider.
    const traits = [
      {
        id: 'kindness',
        name: 'Kindness',
        axis: 'warmth', // this is the only trait that decides warmth (sweet vs mean)
        value: 6,
        labels: {
          1: 'Compassionate', 2: 'Kind', 3: 'Patient', 4: 'Honest', 5: 'Pragmatic',
          6: 'Balanced', 7: 'Stubborn', 8: 'Competitive', 9: 'Arrogant',
          10: 'Cynical', 11: 'Vindictive'
        }
      },
      {
        id: 'courage',
        name: 'Courage',
        axis: 'energy', // courage + charisma decide energy (bold vs low-key)
        value: 6,
        labels: {
          1: 'Timid', 2: 'Fearful', 3: 'Cautious', 4: 'Careful', 5: 'Guarded',
          6: 'Balanced', 7: 'Confident', 8: 'Assertive', 9: 'Daring',
          10: 'Reckless', 11: 'Bold'
        }
      },
      {
        id: 'charisma',
        name: 'Charisma',
        axis: 'energy',
        value: 6,
        labels: {
          1: 'Reserved', 2: 'Guarded', 3: 'Shy', 4: 'Modest', 5: 'Composed',
          6: 'Balanced', 7: 'Playful', 8: 'Charming', 9: 'Flirty',
          10: 'Seductive', 11: 'Irresistible'
        }
      }
    ];

    const traitsContainer = document.getElementById('traits-container');
    const traitTagsEl = document.getElementById('trait-tags');
    const overallTypeEl = document.getElementById('overallType');

    // build the slider rows once -- labels for both ends come straight off each trait's own list
    traits.forEach(trait => {
      const row = document.createElement('div');
      row.className = 'trait-row';
      row.innerHTML = `
        <div class="trait-name">${trait.name}</div>
        <div class="slider-row">
          <span class="per-label-edge">${trait.labels[1]}</span>
          <input type="range" min="1" max="11" value="${trait.value}" class="per-slider" data-trait="${trait.id}">
          <span class="per-label-edge">${trait.labels[11]}</span>
        </div>
      `;
      traitsContainer.appendChild(row);
    });

    // 3x3 grid: warmth (from Kindness) × energy (from Courage + Charisma combined)
    // warmth alone decides sweet vs mean. energy alone decides bold vs low-key.
    // the two combine so "mean + bold + reserved" reads as Rebel, for example
    const overallGrid = {
      'high-high':    'Icon',
      'high-neutral': 'Sweetheart',
      'high-low':     'Guardian',
      'neutral-high': 'Maverick',
      'neutral-neutral': 'Independent',
      'neutral-low':  'Wallflower',
      'low-high':     'Villain',
      'low-neutral':  'Rebel',
      'low-low':      'Enigma'
    };

    function bandFromScore(score) {
      if (score >= 2) return 'high';
      if (score <= -2) return 'low';
      return 'neutral';
    }

    const overallDescriptions = {
      Icon: 'Warm and high-energy. People are drawn to you, and you know how to work a room without losing your heart.',
      Sweetheart: 'High warmth, low-key energy. Genuinely kind, easy to trust, and not out to prove anything.',
      Guardian: 'Warm but guarded. You care deeply and protect the people close to you, even if you don\u2019t show it loudly.',
      Maverick: 'Neutral warmth, big energy. Bold, unpredictable, and doing your own thing regardless of who\u2019s watching.',
      Independent: 'Balanced across the board. Not driven by warmth or energy extremes; you make your own calls.',
      Wallflower: 'Neutral warmth, low-key energy. Quiet and steady, more comfortable observing than performing.',
      Villain: 'Low warmth, high energy. Sharp, intense, and not afraid to make enemies to get where you\u2019re going.',
      Rebel: 'Low warmth, neutral energy. Cold on the surface and allergic to rules, but not chasing chaos for its own sake.',
      Enigma: 'Low warmth, low-key energy. Hard to read, keeps people guessing, and gives away very little.'
    };

    const overallTrigger = document.getElementById('overallTrigger');
    const overallPopup = document.getElementById('overallPopup');
    const overallPopupTitle = document.getElementById('overallPopupTitle');
    const overallPopupText = document.getElementById('overallPopupText');

    // hover shows/hides via CSS; click is for tap devices where hover doesn't apply
    overallTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      overallPopup.classList.toggle('visible');
    });

    document.addEventListener('click', (e) => {
      if (!overallTrigger.contains(e.target)) {
        overallPopup.classList.remove('visible');
      }
    });

    function updatePersonality() {
      traitTagsEl.innerHTML = '';
      let warmthScore = 0;
      let energyScore = 0;

      traits.forEach(trait => {
        const input = traitsContainer.querySelector(`[data-trait="${trait.id}"]`);
        const val = parseInt(input.value, 10);
        trait.value = val;
        input.style.setProperty('--val', val);

        // deviation from the center (6) of an 11-point scale, range -5..5
        const deviation = 6 - val;
        if (trait.axis === 'warmth') warmthScore += deviation;
        if (trait.axis === 'energy') energyScore += -deviation; // higher value = more energy

        const chip = document.createElement('span');
        chip.className = 'trait-chip';
        chip.textContent = `${trait.name}: ${trait.labels[val]}`;
        traitTagsEl.appendChild(chip);
      });

      const warmthBand = bandFromScore(warmthScore);
      const energyBand = bandFromScore(energyScore);
      const overallLabel = overallGrid[`${warmthBand}-${energyBand}`];
      overallTypeEl.textContent = overallLabel;
      overallPopupTitle.textContent = overallLabel;
      overallPopupText.textContent = overallDescriptions[overallLabel];
    }

    traitsContainer.addEventListener('input', updatePersonality);
    updatePersonality();

    //bio dictionary
  const dictionaryKeyWords = {
  theDisrupter: ["drama", "chaotic", "wild"],
  theProfessional: ["boss", "hustle", "grind"],
  theFanFavorite: ["love", "authentic", "real"],
  theEnigma: ["dark", "iconic", "mysterious"],
  }

const bioText = document.getElementById('bio');
const bioContainer = document.getElementById ('bio-container');

    const disrupterRegex = /drama|chaotic|wild/i;
    const professionalRegex = /boss|hustle|grind/i;
    const fanFavoriteRegex = /love|authentic|real/i;
    const enigmaRegex = /dark|iconic| mysterious/i;

bioText.addEventListener ('input', () => {
  bioContainer.classList.remove('border-disrupter',
  'border-professional',
  'border-fan-favorite',
  'border-enigma',
);
const userInput = bioText.value;
  if (disrupterRegex.test(userInput)) {
    bioContainer.classList.add('border-disrupter');
  } else if (professionalRegex.test(userInput)) {
    bioContainer.classList.add('border-professional');
  } else if (fanFavoriteRegex.test(userInput)) {
    bioContainer.classList.add('border-fan-favorite');
  }
  else if (enigmaRegex.test(userInput)) {
    bioContainer.classList.add('border-enigma');
  }});
  </script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotlight | Notifications</title>

    <script>
      // apply saved theme immediately to avoid a flash of the wrong theme.
      // (this page has no toggle button of its own - it just follows
      // whatever was last picked from Feed.html)
      (function () {
        var saved = localStorage.getItem("spotlight-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
        sessionStorage.setItem("spotlight-last-page", "notifications.html");
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
    <style>
      :root, [data-theme="dark"] {
      --bell-bg: #1e2732;
      }

      [data-theme="light"] {
      --bell-bg: #f0ece2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }

      .phone {
        width: 100%;
        max-width: 520px;
        min-height: 100vh;
        background: var(--bg);
        padding-bottom: 90px;
        border-left: 1px solid var(--divider);
        border-right: 1px solid var(--divider);
      }

      .header {
        padding: 24px 20px;
        text-align: center;
        border-bottom: 1px solid var(--divider);
      }

      .header h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.01em;
      }

      .notification-container {
        display: flex;
        gap: 14px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--divider);
        align-items: flex-start;
      }

      .avatar {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--bell-bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .avatar svg {
        width: 40px;
        height: 40px;
        fill: var(--gold);
      }

      .content,
      .comment-container {
        flex: 1;
        min-width: 0;
      }

      .names,
      .activity-text {
        font-size: 14px;
        line-height: 1.4;
        margin: 0 0 6px 0;
        color: var(--ink);
        font-weight: 400;
      }

      .names strong,
      .activity-text strong {
        font-weight: 700;
      }

      .original-post {
        font-size: 14px;
        color: var(--ink-dim);
        font-style: italic;
        margin: 8px 0 0 0;
        line-height: 1.4;
        padding-left: 10px;
        border-left: 2px solid var(--divider);
      }

      .reply {
        font-size: 15px;
        color: var(--ink);
        margin: 0;
        line-height: 1.5;
        display: block;
      }

      .handle {
        font-weight: 800;
        color: var(--ink);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .mention {
        color: var(--ink);
        text-decoration: none;
      }

      .tag {
        color: var(--gold);
        font-weight: 700;
      }

      .verified-badge {
        display: inline-block;
        vertical-align: middle;
        flex-shrink: 0;
        fill: #ffd166;
      }

      /* fade-in on load */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        animation: fadeIn 0.6s ease both;
      }

      .notification-container {
        opacity: 0;
        animation: fadeIn 0.6s ease forwards;
      }

      .notification-container:nth-child(2) {
        animation-delay: 0.1s;
      }
      .notification-container:nth-child(3) {
        animation-delay: 0.25s;
      }
      .notification-container:nth-child(4) {
        animation-delay: 0.4s;
      }
      .notification-container:nth-child(5) {
        animation-delay: 0.55s;
      }
      .notification-container:nth-child(6) {
        animation-delay: 0.7s;
      }
      .notification-container:nth-child(7) {
        animation-delay: 0.85s;
      }
      .notification-container:nth-child(8) {
        animation-delay: 1s;
      }

      /* bottom nav, matches Feed.html */
      .bottomTab {
        position: fixed;
        left: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
        width: 100%;
        padding: 10px 20px;
        background-color: var(--bg);
        border-top: 1px solid var(--divider);
        z-index: 100;
      }

      .bottomTab a {
        padding: 6px 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        color: var(--ink);
        font:
          bold 16px "Urbanist",
          Arial,
          sans-serif;
        text-align: center;
        text-decoration: none;
        transition: all 0.25s ease;
      }

      .bottomTab a:hover,
      .bottomTab a[aria-current="page"] {
        color: var(--gold);
        border-color: rgba(255, 209, 102, 0.5);
        background-color: rgba(255, 209, 102, 0.08);
        box-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
        transform: translateY(-2px);
      }

      @media (max-width: 480px) {
        .bottomTab {
          gap: 8px;
        }
        .bottomTab a {
          padding: 6px 8px;
          font-size: 14px;
        }
      }

      /* full-screen cover while notifications are loading. skipped
      entirely when we already have a cached list to show. */
      .pageLoader {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: var(--bg);
        transition: opacity 0.35s ease;
      }

      .pageLoader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .pageLoaderSpinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid var(--divider);
        border-top-color: var(--gold);
        animation: pageLoaderSpin 0.8s linear infinite;
      }

      @keyframes pageLoaderSpin {
        to {
          transform: rotate(360deg);
        }
      }

      .pageLoaderText {
        font-size: 13px;
        color: var(--ink-dim);
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body class="page-maximal">
    <div class="pageLoader" id="pageLoader">
      <div class="pageLoaderSpinner"></div>
      <div class="pageLoaderText">Loading...</div>
    </div>

    <div class="phone">
      <header class="header">
        <h1>Notifications</h1>
      </header>

      <div class="notifications-list">
        <!-- populated dynamically by the script at the bottom of this file -->
      </div>

      <p
        class="empty-state"
        style="
          display: none;
          text-align: center;
          color: var(--ink-dim);
          padding: 40px 20px;
        "
      >
        Nothing yet. Once bots start replying to your posts or tagging you,
        it'll show up here.
      </p>

      <nav class="bottomTab" aria-label="Primary navigation">
        <a href="Feed.html">Feed</a>
        <a href="events.html">Explore</a>
        <a href="notifications.html" aria-current="page">Beams</a>
        <a href="Stage.html">Stage</a>
        <a href="IconPage.html">Profile</a>
      </nav>
    </div>
    <script src="scripts/theme.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/profile-cache.js"></script>
    <script src="scripts/post-cache.js"></script>
    <script>
      const BELL_ICON_SVG = `
        <svg width="24" height="24" viewBox="-0.5 0 56 56" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M28 38c1.105 0 2-.895 2-2h-4c0 1.105.895 2 2 2zm0-20c3.441 0 6.882 3.529 7 6.697v3.636s2 1.167 2 2.672c0 2.043-1.34 2.995-2.993 2.995h-12.015c-1.64 0-2.993-1-2.993-2.995v-.509c0-.552.385-1.22.86-1.497l1.14-.665v-3.636c.118-3.168 3.559-6.697 7-6.697zm0 2c-2.277 0-4.92 2.589-5 4.697v4.785l-.992.579-1.14.665c.139-.081.132-.07.132-.231v.509c0 .729.289.995.993.995h12.015c.735 0 .993-.235.993-.995 0-.002-.115-.198-.385-.457-.244-.234-.498-.414-.623-.487l-.992-.579v-1.149l.001-3.562c-.081-2.183-2.724-4.771-5.001-4.771z"/>
        </svg>`;

      function timeSince(dateString) {
        const minutes = Math.max(
          1,
          Math.floor((Date.now() - new Date(dateString)) / 60000),
        );
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h`;
        return `${Math.floor(hours / 24)}d`;
      }

      function renderNotification(n, botProfileById) {
        const bot = n.actor_bot_id ? botProfileById.get(n.actor_bot_id) : null;
        const botName = bot?.display_name || "Someone";

        const container = document.createElement("div");
        container.className = "notification-container";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.innerHTML = BELL_ICON_SVG;
        container.appendChild(avatar);

        const content = document.createElement("div");
        content.className = "content";

        if (n.type === "mention_post") {
          const activity = document.createElement("p");
          activity.className = "activity-text";
          activity.innerHTML = `<strong>${botName}</strong> mentioned you in a post · ${timeSince(n.created_at)}`;
          const original = document.createElement("p");
          original.className = "original-post";
          original.textContent = n.preview || "";
          content.append(activity, original);
        } else if (n.type === "mention_reply" || n.type === "bot_reply") {
          const names = document.createElement("p");
          names.className = "names";
          names.innerHTML =
            n.type === "mention_reply"
              ? `<strong>${botName}</strong> mentioned you in a reply · ${timeSince(n.created_at)}`
              : `<strong>${botName}</strong> replied to your post · ${timeSince(n.created_at)}`;
          const reply = document.createElement("p");
          reply.className = "reply";
          const handle = document.createElement("span");
          handle.className = "handle";
          handle.textContent = botName;
          const mention = document.createElement("span");
          mention.className = "mention";
          mention.textContent = `: ${n.preview || ""}`;
          reply.append(handle, mention);
          content.append(names, reply);
        } else if (n.type === "bot_like" || n.type === "bot_repost") {
          const activity = document.createElement("p");
          activity.className = "activity-text";
          activity.innerHTML = `<strong>${botName}</strong> ${n.type === "bot_like" ? "liked" : "reposted"} your post · ${timeSince(n.created_at)}`;
          const original = document.createElement("p");
          original.className = "original-post";
          original.textContent = n.preview || "";
          content.append(activity, original);
        }

        container.appendChild(content);
        return container;
      }

      function renderNotificationsList(notifications, botProfileById) {
        const listEl = document.querySelector(".notifications-list");
        const emptyEl = document.querySelector(".empty-state");
        listEl.innerHTML = "";
        if (!notifications.length) {
          emptyEl.style.display = "block";
          return;
        }
        emptyEl.style.display = "none";
        notifications.forEach((n) =>
          listEl.appendChild(renderNotification(n, botProfileById)),
        );
      }

      async function markAllRead(ids) {
        if (!ids.length) return;
        const { error } = await supabaseClient
          .from("notifications")
          .update({ read: true })
          .in("id", ids);
        if (error) console.error("Could not mark notifications read:", error);
      }

      // re-check for new notifications at most this often. if the cache is
      // younger than this, skip even the cheap query below and trust it.
      const NOTIFICATIONS_STALE_CHECK_TTL_MS = 10 * 1000;

      // cheap check: is the newest notification on the server the same one
      // we have cached? a single indexed row, not the full notifications +
      // bot-profiles fetch.
      async function notificationsHaveNewActivity(currentUser, cachedNotifications) {
        const { data: latest, error } = await supabaseClient
          .from("notifications")
          .select("id, created_at")
          .eq("user_id", currentUser.id)
          .order("created_at", { ascending: false })
          .limit(1)
          .maybeSingle();

        if (error) {
          console.error(
            "Could not check notifications for new activity, falling back to full fetch:",
            error,
          );
          return true; // don't know, so err on the side of refetching
        }

        const newestCached = cachedNotifications[0];
        if (!latest && !newestCached) return false;
        if (!latest || !newestCached) return true;
        return !(
          latest.id === newestCached.id &&
          latest.created_at === newestCached.created_at
        );
      }

      async function loadNotifications() {
        const pageLoader = document.getElementById("pageLoader");
        const cachedProfileId =
          (window.__cachedProfile || window.SpotlightProfileCache?.read?.())?.id;
        const cached = cachedProfileId
          ? window.SpotlightPostCache?.readNotifications(cachedProfileId)
          : null;
        console.log(
          "[notifications] cachedProfileId:",
          cachedProfileId,
          "found cache:",
          !!cached,
        );

        if (cached) {
          renderNotificationsList(
            cached.notifications,
            new Map((cached.botProfiles || []).map((b) => [b.id, b])),
          );
          pageLoader?.classList.add("hidden");

          const cacheAgeMs = Date.now() - (cached.cachedAt || 0);
          console.log(
            "[notifications] cache age ms:",
            cacheAgeMs,
            "cachedAt:",
            cached.cachedAt,
          );
          const isRecent = cacheAgeMs < NOTIFICATIONS_STALE_CHECK_TTL_MS;
          if (isRecent) {
            console.log("[notifications] trust-cache path: 0 network calls");
            return;
          }
        }

        try {
          const { user: currentUser } = await window.SpotlightProfileCache.load(
            supabaseClient,
          ).catch(async (error) => {
            console.error("Could not preload profile:", error);
            const {
              data: { user },
            } = await supabaseClient.auth.getUser();
            return { user };
          });
          if (!currentUser) return;

          if (cached) {
            const hasNew = await notificationsHaveNewActivity(
              currentUser,
              cached.notifications,
            );
            if (!hasNew) {
              console.log("[notifications] freshness check ran, nothing new: skipped full fetch");
              return;
            }
          }

          console.log("[notifications] doing full fetch");
          console.log("[notifications] if cache is newer than 10s & new content wasnt added, this is a bug!");
          const { data: notifications, error } = await supabaseClient
            .from("notifications")
            .select(
              "id, type, post_id, reply_id, actor_bot_id, preview, read, created_at",
            )
            .eq("user_id", currentUser.id)
            .order("created_at", { ascending: false })
            .limit(50);
          if (error) {
            console.error("Could not load notifications:", error);
            return;
          }

          const botIds = [
            ...new Set(notifications.map((n) => n.actor_bot_id).filter(Boolean)),
          ];
          let botProfiles = [];
          if (botIds.length) {
            const { data, error: botError } = await supabaseClient
              .from("bot_profiles")
              .select("id, display_name, handle, avatar_url")
              .in("id", botIds);
            if (botError) console.error("Could not load bot profiles:", botError);
            botProfiles = data || [];
          }
          const botProfileById = new Map(botProfiles.map((b) => [b.id, b]));

          renderNotificationsList(notifications, botProfileById);

          const unreadIds = notifications.filter((n) => !n.read).map((n) => n.id);
          markAllRead(unreadIds);

          // reflect the mark-as-read locally too, so a future cache-only
          // render doesn't think these are still unread
          const unreadSet = new Set(unreadIds);
          const notificationsForCache = notifications.map((n) =>
            unreadSet.has(n.id) ? { ...n, read: true } : n,
          );
          window.SpotlightPostCache?.writeNotifications(
            currentUser.id,
            notificationsForCache,
            botProfiles,
          );
          console.log(
            "[notifications] wrote cache at",
            Date.now(),
            "for user",
            currentUser.id,
          );
        } catch (error) {
          console.error("Could not finish loading notifications:", error);
        } finally {
          pageLoader?.classList.add("hidden");
        }
      }

      loadNotifications();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight | Tutorial</title>
    <script>
      // apply saved theme immediately to avoid a flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem("spotlight-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        background-color: var(--bg);
        transition: background-color 0.25s ease;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* ── Tutorial card ── */
      .tutorial-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(14px, 2.5vw, 22px);
        text-align: center;
        padding: 0 1.5rem;
        max-width: 640px;
      }

      .tutorial-title {
        font-weight: 700;
        font-size: clamp(1.8rem, 5.5vw, 3rem);
        color: var(--ink);
        line-height: 1.1;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }

      .tutorial-title.gold {
        color: var(--gold);
        text-shadow:
          0 0 8px var(--glow-1),
          0 0 22px var(--glow-2),
          0 0 40px var(--glow-3);
      }

      .tutorial-title.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .tutorial-subtitle {
        font-size: clamp(0.6rem, 0.85vw, 0.7rem);
        font-weight: 300;
        letter-spacing: 0.35em;
        color: var(--body-text);
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.4s ease 0.1s;
      }

      .tutorial-subtitle.visible {
        opacity: 1;
      }

      .tutorial-body {
        font-weight: 400;
        font-size: clamp(0.95rem, 1.4vw, 1.15rem);
        line-height: 1.65;
        color: var(--body-readable);
        opacity: 0;
        transition: opacity 0.35s ease;
        min-height: 1.65em;
      }

      .tutorial-body.visible {
        opacity: 1;
      }

      .tap-hint {
        font-size: clamp(0.55rem, 0.75vw, 0.65rem);
        font-weight: 300;
        letter-spacing: 0.3em;
        color: var(--body-text);
        text-transform: uppercase;
        margin-top: clamp(8px, 2vw, 16px);
        animation: pulse-glow 2.6s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%,
        100% {
          text-shadow: 0 0 4px var(--pulse-base);
        }
        50% {
          text-shadow:
            0 0 8px var(--pulse-1),
            0 0 18px var(--pulse-2);
        }
      }

      .tutorial-buttons {
        display: flex;
        gap: clamp(10px, 2vw, 16px);
        margin-top: clamp(10px, 2vw, 18px);
        flex-wrap: wrap;
        justify-content: center;
      }

      .glow-button {
        display: inline-block;
        padding: clamp(12px, 1.5vw, 16px) clamp(24px, 3vw, 30px);
        cursor: pointer;
        border-radius: 100px;
        background-color: transparent;
        border: 1.5px solid var(--button-border);
        font-weight: 700;
        font-size: clamp(0.65rem, 0.9vw, 0.75rem);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--ink);
        text-decoration: none;
        transition:
          background-color 0.25s ease,
          color 0.25s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease;
      }

      .glow-button:hover {
        background-color: var(--gold);
        color: var(--black);
        border-color: var(--gold);
        box-shadow:
          0 0 10px var(--hover-shadow-1),
          0 0 28px var(--hover-shadow-2);
      }

      /* progress dots */
      .progress-dots {
        position: fixed;
        top: clamp(20px, 4vh, 32px);
        display: flex;
        gap: 8px;
      }

      .progress-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--card-border);
        transition:
          background 0.3s ease,
          transform 0.3s ease;
      }

      .progress-dots span.active {
        background: var(--gold2);
        transform: scale(1.3);
      }

      [data-theme="light"] .tutorial-title,
      [data-theme="light"] .glow-button {
        color: #1e1e1e !important;
      }

      [data-theme="light"] .glow-button:hover {
        color: #1e1e1e !important;
      }
    </style>
  </head>
  <body class="page-minimal">
    <div class="progress-dots" id="progress-dots"></div>

    <div class="tutorial-wrap">
      <h1 class="tutorial-title" id="tutorial-title"></h1>
      <p class="tutorial-subtitle" id="tutorial-subtitle"></p>
      <p class="tutorial-body" id="tutorial-body"></p>
      <div class="tutorial-buttons" id="tutorial-buttons"></div>
      <div class="tap-hint" id="tap-hint">
        Click or tap the screen to continue
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/theme.js"></script>

    <script>
      const pages = [
        {
          type: "standard",
          title: "Now your profile...",
          subtitle: null,
          chunks: [
            "So far, we know your character is a [IDENTITY], who is known as [FAME PATH], and got here via [ORIGIN].",
            "But what else? If they’re a K-Pop Idol, what group are they in? If they’re a Nepo Baby, who is their parent? Oh, and we can’t forget their name!",
            "Any extra information will reside here — but don’t worry! You can always come back and change it later.",
          ],
        },
      ];

      const NEXT_URL = "profile.html";

      const DOT_OFFSET = 3;
      const TOTAL_DOTS = 5;

      const IDENTITY_PHRASES = {
        "singer-rapper": "a Singer / Rapper",
        "kpop-idol": "a K-pop Idol",
        model: "a Model",
        athlete: "an Athlete",
        "actor-actress": "an Actor / Actress",
        "group-member": "a Group Member",
        "content-creator": "a Content Creator",
        socialite: "a Socialite",
      };

      const FAME_PATH_PHRASES = {
        "viral-star": "The Viral Star",
        "scandalous-one": "The Scandalous One",
        "lover-player": "The Lover Player",
        "shit-talker": "The Shit Talker",
        "mysterious-one": "The Mysterious One",
        activist: "The Activist",
        "industry-vet": "The Industry Vet",
      };

      const ORIGIN_PHRASES = {
        "viral-moment": "a viral moment",
        "industry-plant": "being an industry plant",
        "underground-legend": "being an underground legend",
        "reality-tv": "reality TV",
        "nepotism-baby": "being a nepotism baby",
        "self-made": "being self-made",
      };

      // pull identity / fame_path / origin from Supabase and drop them into
      // the placeholders before anything renders.
      async function loadProfileData() {
        let identityPhrase = "a rising star";
        let famePathPhrase = "someone people are watching";
        let originPhrase = "a story still being written";

        try {
          const {
            data: { user },
            error: userError,
          } = await supabaseClient.auth.getUser();
          if (userError || !user) {
            console.log(
              "Could not load profile data for tutorial:",
              userError || "No signed-in user.",
            );
          } else {
            const { data: profile, error } = await supabaseClient
              .from("profiles")
              .select("identity, fame_path, origin")
              .eq("id", user.id)
              .single();

            if (error) {
              console.log("Could not load profile data for tutorial:", error);
            } else if (profile) {
              if (profile.identity && IDENTITY_PHRASES[profile.identity]) {
                identityPhrase = IDENTITY_PHRASES[profile.identity];
              }
              if (profile.fame_path && FAME_PATH_PHRASES[profile.fame_path]) {
                famePathPhrase = FAME_PATH_PHRASES[profile.fame_path];
              }
              if (profile.origin && ORIGIN_PHRASES[profile.origin]) {
                originPhrase = ORIGIN_PHRASES[profile.origin];
              }
            }
          }
        } catch (e) {
          console.log("Could not load profile data for tutorial:", e);
        }

        pages[0].chunks[0] = pages[0].chunks[0]
          .replace("[IDENTITY]", identityPhrase)
          .replace("[FAME PATH]", famePathPhrase)
          .replace("[ORIGIN]", originPhrase);
      }

      let pageIndex = 0;
      let chunkIndex = 0;
      let showCTA = false;

      const titleEl = document.getElementById("tutorial-title");
      const subtitleEl = document.getElementById("tutorial-subtitle");
      const bodyEl = document.getElementById("tutorial-body");
      const buttonsEl = document.getElementById("tutorial-buttons");
      const tapHintEl = document.getElementById("tap-hint");
      const dotsEl = document.getElementById("progress-dots");

      function buildDots() {
        for (let i = 0; i < TOTAL_DOTS; i++) {
          dotsEl.appendChild(document.createElement("span"));
        }
      }

      function updateDots() {
        const activeIndex = DOT_OFFSET + pageIndex;
        [...dotsEl.children].forEach((dot, i) => {
          dot.classList.toggle("active", i === activeIndex);
        });
      }

      function render() {
        const page = pages[pageIndex];

        // title / subtitle
        titleEl.textContent = page.title || "";
        titleEl.classList.toggle("visible", !!page.title);
        titleEl.classList.toggle("gold", !!page.titleGold);

        subtitleEl.textContent = page.subtitle || "";
        subtitleEl.classList.toggle("visible", !!page.subtitle);

        // body chunk fade
        bodyEl.classList.remove("visible");
        buttonsEl.innerHTML = "";

        setTimeout(() => {
          bodyEl.textContent = page.chunks[chunkIndex] || "";
          bodyEl.classList.toggle("visible", !!page.chunks[chunkIndex]);

          if (page.type === "confirm") {
            tapHintEl.style.display = "none";
            page.buttons.forEach((btn) => {
              const b = document.createElement("a");
              b.href = "#";
              b.className = "glow-button";
              b.textContent = btn.label;
              b.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (btn.action === "next") {
                  pageIndex++;
                  chunkIndex = 0;
                  render();
                } else if (btn.action === "exit") {
                  window.location.href = EXIT_URL;
                }
              });
              buttonsEl.appendChild(b);
            });
          } else if (showCTA && page.finalCTA) {
            tapHintEl.style.display = "none";
            const b = document.createElement("a");
            b.href = page.finalCTA.href;
            b.className = "glow-button";
            b.textContent = page.finalCTA.label;
            b.addEventListener("click", (e) => e.stopPropagation());
            buttonsEl.appendChild(b);
          } else {
            tapHintEl.style.display = "";
          }
        }, 180);

        updateDots();
      }

      function advance() {
        const page = pages[pageIndex];
        if (page.type === "confirm") return; // handled by buttons only
        if (showCTA) return; // waiting for CTA click

        if (chunkIndex < page.chunks.length - 1) {
          chunkIndex++;
          render();
          return;
        }

        if (pageIndex === pages.length - 1) {
          if (page.finalCTA) {
            showCTA = true;
            render();
          } else {
            window.location.href = NEXT_URL;
          }
        } else {
          pageIndex++;
          chunkIndex = 0;
          render();
        }
      }

      document.body.addEventListener("click", advance);

      buildDots();
      loadProfileData().then(render);
    </script>
  </body>
</html>

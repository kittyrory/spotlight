<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- these fonts were referenced but not imported -->
<title>Spotlight | Feed</title>

    <script>
      window.addEventListener("error", function (e) {
        console.error(
          "ERROR:",
          e.message,
          (e.filename || "") + ":" + (e.lineno || ""),
        );
      });
      window.addEventListener("unhandledrejection", function (e) {
        console.error(
          "PROMISE REJECTION:",
          e.reason?.message || e.reason,
        );
      });
    </script>
    <script>
      // apply saved theme immediately to avoid a flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem("spotlight-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
        sessionStorage.setItem("spotlight-last-page", "Feed.html");
      })();
    </script>

    <script src="scripts/profile-cache.js"></script>
    <script>
      // read the cached profile synchronously in <head>, before the body
      // renders, so anything that needs it can paint immediately instead
      // of waiting on the scripts at the bottom of the page.
      window.__cachedProfile = window.SpotlightProfileCache.read();
    </script>

    <link rel="stylesheet" href="style.css" />
    <style>
      :root, [data-theme="dark"] {
      --swooning: #ff7fb0;
      --gold-rgb: 245, 196, 81;
      --skeptical: #a1d7ec;
      --overlay-dim: rgba(0, 0, 0, 0.6);
      --likes: greenyellow;
      }

      [data-theme="light"] {
      --swooning: #c15482;
      --gold-rgb: 245, 196, 81;
      --skeptical: #4388a6;
      --overlay-dim: rgba(0, 0, 0, 0.28);
      --likes: #39ac00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--ink);
        padding-bottom: 88px;
        transition:
          background-color 0.25s ease,
          color 0.25s ease;
      }

      #theme-toggle {
        flex-shrink: 0;
        margin-left: auto;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1.5px solid var(--toggle-border);
        background-color: transparent;
        color: var(--ink);
        font-size: 1.1rem;
        cursor: pointer;
        transition:
          border-color 0.25s ease,
          box-shadow 0.25s ease,
          transform 0.15s ease;
      }

      #theme-toggle:hover {
        border-color: var(--gold);
        box-shadow: 0 0 12px var(--toggle-hover-shadow);
      }

      #theme-toggle:active {
        transform: scale(0.92);
      }

      #theme-toggle svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      [data-theme="dark"] #theme-toggle .icon-moon,
      [data-theme="light"] #theme-toggle .icon-sun {
        display: none;
      }

      .Feed {
        font-family: "Urbanist", Arial;
        display: inline-block;
        font-size: 22px;
        cursor: pointer;
        white-space: nowrap;
      }

      .logoAccent {
        color: var(--gold);
      }

      .toppage {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        color: var(--ink);
        font-weight: bold;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background-color: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 10px 20px;
        z-index: 100;
        box-sizing: border-box;
      }

      .posts {
        padding-top: var(--nav-h, 110px);
        max-width: 680px;
        margin: 0 auto;
        padding-left: 16px;
        padding-right: 16px;
      }

      .connectedPages {
        display: flex;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        justify-content: center;
        align-items: center;
        gap: 40px;
        font-size: 17px;
      }

      .connectedPages > div,
      .connectedPages > a {
        display: flex;
        align-items: center;
        font-family: "Urbanist", sans-serif;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 10px;
        border: 1px solid transparent;
        white-space: nowrap;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      @media (max-width: 760px) {
        .connectedPages {
          position: static;
          transform: none;
          flex-basis: 100%;
          order: 3;
          margin-top: 10px;
          gap: 16px;
        }

        .Feed {
          order: 1;
        }

        #theme-toggle {
          order: 2;
        }
      }

      #forYou:hover,
      #following:hover,
      #blazing:hover {
        color: var(--gold);
        border: 1px solid rgba(var(--gold-rgb), 0.5);
        background-color: rgba(var(--gold-rgb), 0.08);
        box-shadow: 0 0 12px rgba(var(--gold-rgb), 0.35);
        transform: translateY(-2px);
        transition: all 0.25s ease;
      }

      .postCard {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        margin-top: 20px;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      .postCard:hover {
        border-color: rgba(var(--gold-rgb), 0.4);
        transform: translateY(-1px);
      }

      .postMedia {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 12px;
      }

      .postMedia:has(img:only-child) {
        grid-template-columns: 1fr;
      }
      .postMedia img {
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        border-radius: 12px;
      }

      .avatar {
        display: inline-block;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
        border: 1px solid var(--border);
      }

      .userMeta {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        align-items: center;
        width: 100%;
      }

      .postTime {
        margin-left: auto;
        color: var(--muted);
      }

      .username {
        color: var(--muted);
      }

      .tagRow {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .tag1,
      .tag2 {
        display: inline-block;
        font-size: 14px;
        color: var(--gold);
      }

      .tag1:hover,
      .tag2:hover {
        text-decoration: underline;
        cursor: pointer;
      }

      .footerSpan {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        align-items: center;
        width: 100%;
        color: var(--muted);
        font-size: 13px;
      }

      .reaction {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 0;
        color: inherit;
        background: none;
        border: 0;
        font: inherit;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .reaction svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .likes:hover {
        color: greenyellow;
      }
      .retweets:hover {
        color: var(--gold);
      }
      .reply:hover {
        color: var(--ink);
      }
      .dislikes:hover {
        color: red;
      }

      /* filled/active state once a user has actually reacted */
      .likes.active {
        color: var(--likes);
      }
      .retweets.active {
        color: var(--gold);
      }
      .dislikes.active {
        color: #ff5c5c;
      }
      .reaction.active svg {
        fill: currentColor;
      }
      .reaction:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* fade-in on load */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .toppage {
        animation: fadeIn 0.6s ease both;
      }

      .postCard {
        opacity: 0;
        animation: fadeIn 0.6s ease forwards;
      }

      /* stagger each card slightly so they don't all pop in at once */
      .postCard:nth-child(1) {
        animation-delay: 0.1s;
      }
      .postCard:nth-child(2) {
        animation-delay: 0.25s;
      }
      .postCard:nth-child(3) {
        animation-delay: 0.4s;
      }
      .postCard:nth-child(4) {
        animation-delay: 0.55s;
      }
      .postCard:nth-child(5) {
        animation-delay: 0.7s;
      }

      /* full-screen cover while the initial supabase calls are in flight */
      .pageLoader {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: var(--bg);
        transition: opacity 0.35s ease;
      }

      .pageLoader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .pageLoaderSpinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--gold);
        animation: pageLoaderSpin 0.8s linear infinite;
      }

      @keyframes pageLoaderSpin {
        to {
          transform: rotate(360deg);
        }
      }

      .pageLoaderText {
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      .bottomTab {
        position: fixed;
        left: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
        width: 100%;
        padding: 10px 20px;
        background-color: var(--bg);
        border-top: 1px solid var(--border);
        z-index: 100;
      }

      .bottomTab a {
        padding: 6px 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        color: var(--ink);
        font:
          bold 16px "Urbanist",
          Arial,
          sans-serif;
        text-align: center;
        text-decoration: none;
        transition: all 0.25s ease;
      }

      .bottomTab a:hover,
      .bottomTab a[aria-current="page"] {
        color: #ffd166;
        border-color: rgba(255, 209, 102, 0.5);
        background-color: rgba(255, 209, 102, 0.08);
        box-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
        transform: translateY(-2px);
      }

      .composeButton {
        position: fixed;
        right: 20px;
        bottom: 92px;
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        color: #111;
        background: var(--gold);
        border-radius: 50%;
        box-shadow: 0 7px 20px rgba(0, 0, 0, 0.45);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        z-index: 101;
      }

      .composeButton:hover {
        transform: translateY(-3px) scale(1.04);
        box-shadow: 0 10px 24px rgba(var(--gold-rgb), 0.32);
      }

      .composeButton svg {
        width: 27px;
        height: 27px;
      }

      @media (max-width: 480px) {
        .composeButton {
          right: 16px;
        }
        .bottomTab {
          gap: 8px;
        }
        .bottomTab a {
          padding: 6px 8px;
          font-size: 14px;
        }
      }

    </style>
</head>
  <body class="page-minimal">
    <svg
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      style="position: absolute"
    >
      <symbol id="icon-like" viewBox="0 0 24 24">
        <path
          d="M7 10v10H4V10h3Zm3 10h7.2a2 2 0 0 0 1.95-1.56l1.1-5A2 2 0 0 0 18.3 11H14l.55-3.2A2.9 2.9 0 0 0 11.7 4L8.5 10.4V20H10Z"
        />
      </symbol>
      <symbol id="icon-retweet" viewBox="0 0 24 24">
        <path d="m17 3 4 4-4 4" />

        <path d="m7 21-4-4 4-4" />
        <path d="M21 17H3" />
      </symbol>
      <symbol id="icon-reply" viewBox="0 0 24 24">
        <path
          d="M5 5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H10l-5 3v-3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"
        />
      </symbol>
      <symbol id="icon-dislike" viewBox="0 0 24 24">

          d="M7 14V4H4v10h3Zm3-10h7.2a2 2 0 0 1 1.95 1.56l1.1 5A2 2 0 0 1 18.3 13H14l.55 3.2A2.9 2.9 0 0 1 11.7 20l-3.2-6.4V4H10Z"
        />
      </symbol>
    </svg>

    <nav>
      <div class="toppage">
        <!-- "light" wrapped in .logoAccent for the yellow accent color -->
        <span class="Feed">Spot<span class="logoAccent">Light</span> Feed</span>
        <div class="connectedPages">
          <div id="forYou" aria-current="page">For You</div>
          <div id="following">Following</div>
          <a id="blazing" href="blazing.html">🔥Blazing</a>
        </div>
        <button id="theme-toggle" aria-label="Toggle light/dark mode">
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="12" cy="12" r="4.5"></circle>
            <line x1="12" y1="1.5" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22.5"></line>
            <line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>
            <line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>
            <line x1="1.5" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22.5" y2="12"></line>
            <line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>
            <line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>
          </svg>
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"></path>
          </svg>
        </button>
      </div>
    </nav>

    <div class="posts">
      <!-- posts load from supabase -->
    </div>

    <a class="composeButton" href="tweet-tab.html" aria-label="Create a post">
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
      >
        <path
          d="m12 2 1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5L12 2Z"
        />
        <path
          d="m19 15 .6 2.4L22 18l-2.4.6L19 21l-.6-2.4L16 18l2.4-.6L19 15Z"
        />
      </svg>
    </a>

    <nav class="bottomTab" aria-label="Primary navigation">
      <a href="Feed.html" aria-current="page">Feed</a>
      <a href="events.html">Explore</a>
      <a href="notifications.html">Beams</a>
      <a href="Stage.html">Stage</a>
      <a href="IconPage.html">Profile</a>
    </nav>

    <!-- covers the screen until the initial posts/profile load resolves,
    then fades out. avoids the "blank feed for a beat" awkwardness -->
    <div class="pageLoader" id="pageLoader">
      <div class="pageLoaderSpinner"></div>
      <div class="pageLoaderText">Loading...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/post-cache.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/worlds.js"></script>
    <script>
      // worlds.js defines a plain `const worlds` array with no window
      // assignment of its own
      worlds.forEach((world, i) => {
      world.id = i;
      });
      window.WORLDS = worlds;
    </script>
    <script src="scripts/feed.js"></script> <!-- now separate since this file is becoming lengthy -->
    <script>
      (function () {
        var nav = document.querySelector(".toppage");
        if (!nav) return;
        var setNavHeight = function () {
          document.documentElement.style.setProperty(
            "--nav-h",
            nav.offsetHeight + "px",
          );
        };
        setNavHeight();
        new ResizeObserver(setNavHeight).observe(nav);
      })();
    </script>
  </body>
</html>

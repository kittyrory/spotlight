<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight | Profile</title>
<script>
  // apply saved theme immediately to avoid a flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem('spotlight-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>

<script>
  // apply cached profile immediately, same idea as the theme script above:
  // read synchronously from localStorage so it paints before any other
  // script (including the css-transition-triggering ones) gets a chance to run.
  // the real network fetch still happens later to keep this fresh.
  window.__cachedProfile = null;
</script>

<script src="scripts/profile-cache.js"></script>
<script>
  window.__cachedProfile = window.SpotlightProfileCache.read();
</script>

    <link rel="stylesheet" href="style.css" />
    <style>
      :root,
      [data-theme="dark"] {
        --track: #2a2a2f;
        --stat-bg: rgba(255, 255, 255, 0.03);
        --verified: #4fa8dd;
        --surface-2: #151316;
        --profile-glow-1: #f5c451;
        --profile-glow-2: #b98b2c;
        --profile-glow-3: #6b5320;
        --profile-glow-opacity: 0.28;
      }

      [data-theme="light"] {
        --track: #e0ddd3;
        --stat-bg: rgba(0, 0, 0, 0.03);
        --verified: #4fa8dd;
        --surface-2: #efece6;
        --profile-glow-1: rgba(245, 196, 81, 0.38);
        --profile-glow-2: rgba(224, 184, 78, 0.26);
        --profile-glow-3: rgba(201, 154, 46, 0.18);
        --profile-glow-opacity: 0.42;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .bg-glow span {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: var(--profile-glow-opacity);
        animation: drift 26s ease-in-out infinite alternate;
      }

      .bg-glow span:nth-child(1) {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, var(--profile-glow-1), transparent 70%);
        top: -140px;
        left: -100px;
        animation-duration: 29s;
      }

      .bg-glow span:nth-child(2) {
        width: 360px;
        height: 360px;
        background: radial-gradient(circle, var(--profile-glow-2), transparent 70%);
        bottom: -100px;
        right: -80px;
        animation-duration: 33s;
        animation-delay: -6s;
      }

      .bg-glow span:nth-child(3) {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, var(--profile-glow-3), transparent 70%);
        top: 35%;
        right: 8%;
        animation-duration: 23s;
        animation-delay: -3s;
      }

      @keyframes drift {
        0% {
          transform: translate(0,0) scale(1);
        }

        50% {
          transform: translate(30px,-25px) scale(1.12);
        }

        100% {
          transform: translate(-20px,20px) scale(0.96);
        }
      }

      body {
        background: radial-gradient(ellipse at top, var(--bg-glow) 0%, var(--bg) 55%);
        position: relative;
        overflow-x: hidden;
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 20px 0 90px;
      }

      .phone {
        width: 100%;
        max-width: 430px;
        padding: 0 18px;
        position: relative;
        z-index: 1;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .circle-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--surface-1);
        border: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-dim);
        cursor: pointer;
      }

      /* ---------- fame card ---------- */
      .fame-card {
        position: relative;
        border-radius: 28px;
        background: linear-gradient(165deg, var(--fame-grad-1) 0%, var(--fame-grad-2) 60%, var(--fame-grad-3) 100%);
        border: 1.5px solid rgba(245,196,81,.28);
        box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 0 0 1px rgba(245,196,81,.05) inset;
        overflow: hidden;
        animation: cardRise .5s cubic-bezier(.2,.9,.3,1.15);
      }

      @keyframes cardRise {
        from {
          opacity: 0;
          transform: translateY(14px) scale(.97);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      .fame-card::after {
        content: "";
        position: absolute;
        top: -60%;
        left: -40%;
        width: 55%;
        height: 220%;
        background: linear-gradient(75deg, transparent 35%, rgba(245,220,160,.14) 48%, transparent 60%);
        transform: rotate(8deg);
        animation: shine 10s ease-in-out;
        pointer-events: none;
      }

      @keyframes shine {
        0% {
          left: -60%;
        }

        35% {
          left: 130%;
        }

        100% {
          left: 130%;
        }
      }

      .sparkle {
        position: absolute;
        border-radius: 50%;
        background: #f5c451;
        box-shadow: 0 0 6px 1px rgba(245,196,81,.7);
        animation: twinkle 3.2s ease-in-out infinite;
      }

      @keyframes twinkle {
        0%, 100% {
          opacity: .15;
          transform: scale(.7);
        }

        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      .fame-banner {
        position: relative;
        height: 130px;
        background: var(--fame-grad-1);
        overflow: hidden;
        border-radius: 26.5px 26.5px 0 0;
      }

      .fame-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .fame-banner::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,.05) 55%, rgba(10,9,6,.35) 100%);
      }

      .fame-banner-top {
        position: absolute;
        top: 12px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 2;
      }

      .fame-banner-edit {
        position: absolute;
        bottom: 10px;
        right: 12px;
        z-index: 2;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(10,9,6,.55);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(245,196,81,.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f5e6bf;
        cursor: pointer;
      }

      .fame-banner-edit:hover {
        background: rgba(10,9,6,.75);
      }

      .fame-body {
        padding: 18px 22px 20px;
        position: relative;
        z-index: 1;
        text-align: center;
      }

      .tier-chip,
      .level-chip {
        font-weight: 700;
        font-size: 11px;
        letter-spacing: .05em;
        text-transform: uppercase;
        padding: 6px 11px;
        border-radius: 999px;
      }

      .tier-chip {
        background: rgba(10,9,6,.55);
        color: var(--gold);
        border: 1px solid rgba(245,196,81,.35);
        backdrop-filter: blur(4px);
      }

      .level-chip {
        background: linear-gradient(135deg, var(--gold), var(--gold-deep));
        color: #1a1408;
      }

      .fame-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 18px;
        position: relative;
        z-index: 1;
      }

      .ring-avatar {
        position: relative;
        width: 88px;
        height: 88px;
        flex-shrink: 0;
      }

      .ring-avatar svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }

      .ring-avatar .ring-track {
        fill: none;
        stroke: var(--track);
        stroke-width: 5;
      }

      .ring-avatar .ring-fill {
        fill: none;
        stroke: url(#ringGrad);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        transition: stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1);
      }

      .avatar-photo {
        position: absolute;
        top: 8px;
        left: 8px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid var(--fame-edge);
      }

      .avatar-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .ring-pct {
        position: absolute;
        bottom: -2px;
        right: -4px;
        background: var(--gold-deep);
        color: #1a1408;
        font-weight: 700;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 999px;
        border: 2px solid var(--fame-edge);
      }

      .fame-id {
        margin-top: 12px;
      }

      .fame-name-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      .fame-name {
        font-weight: 800;
        font-size: 19px;
      }

      .verified {
        width: 16px;
        height: 16px;
        color: var(--verified);
        flex-shrink: 0;
      }

      .fame-handle {
        color: var(--ink-faint);
        font-size: 13.5px;
        margin-top: 2px;
      }

      .fame-edit-btn {
        margin-top: 12px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: 1.5px solid rgba(245,196,81,.4);
        color: var(--gold);
        font-weight: 700;
        font-size: 11.5px;
        padding: 7px 14px;
        border-radius: 999px;
        cursor: pointer;
      }

      .fame-edit-btn:hover {
        background: var(--gold-glow);
      }

      .fame-bio {
        margin-top: 16px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-dim);
        position: relative;
        z-index: 1;
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
      }

      .fame-stats-row {
        display: flex;
        gap: 8px;
        margin-top: 18px;
        position: relative;
        z-index: 1;
      }

      .fame-stat {
        flex: 1;
        background: var(--stat-bg);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 10px 6px;
        text-align: center;
      }

      .fame-stat b {
        display: block;
        font-weight: 800;
        font-size: 15px;
        color: var(--ink);
      }

      .fame-stat span {
        font-size: 10.5px;
        color: var(--ink-faint);
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      /* ---------- segmented tabs ---------- */
      .tabs {
        display: flex;
        gap: 6px;
        margin-top: 24px;
        background: var(--surface-2);
        border: 1px solid var(--card-border);
        border-radius: 999px;
        padding: 4px;
      }

      .tab-btn {
        flex: 1;
        border: none;
        background: transparent;
        font-weight: 700;
        font-size: 13.5px;
        color: var(--ink-faint);
        padding: 10px 0;
        border-radius: 999px;
        cursor: pointer;
        transition: background .2s ease, color .2s ease;
      }

      .tab-btn.active {
        background: var(--gold-glow);
        color: var(--gold);
      }

      .tab-panel {
        display: none;
        margin-top: 20px;
      }

      .tab-panel.active {
        display: block;
        animation: fadeIn .35s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- overview: radial gauges ---------- */
      .gauge-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .gauge {
        flex: 1;
        background: linear-gradient(180deg, var(--surface-grad-1) 0%, var(--surface-grad-2) 100%);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 16px 8px 14px;
        text-align: center;
      }

      .gauge svg {
        transform: rotate(-90deg);
      }

      .gauge-track {
        fill: none;
        stroke: var(--track);
        stroke-width: 8;
      }

      .gauge-fill {
        fill: none;
        stroke-width: 8;
        stroke-linecap: round;
        transition: stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1), stroke .3s ease;
      }

      .gauge-wrap {
        position: relative;
        width: 78px;
        height: 78px;
        margin: 0 auto;
      }

      .gauge-value {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 15px;
        color: var(--ink);
      }

      .gauge-label {
        margin-top: 10px;
        font-weight: 700;
        font-size: 12.5px;
        color: var(--ink);
      }

      .gauge-delta {
        font-size: 11px;
        margin-top: 2px;
        font-weight: 600;
      }

      .gauge-caption {
        font-size: 11.5px;
        color: var(--ink-faint);
        margin-top: 6px;
        line-height: 1.4;
      }

      /* ---------- circle: horizontal carousel ---------- */
      .circle-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 2px 2px 12px;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }

      .circle-scroll::-webkit-scrollbar {
        height: 5px;
      }

      .circle-scroll::-webkit-scrollbar-thumb {
        background: var(--card-border);
        border-radius: 999px;
      }

      .circle-card {
        scroll-snap-align: start;
        flex-shrink: 0;
        width: 158px;
        background: linear-gradient(180deg, var(--surface-grad-1) 0%, var(--surface-grad-2) 100%);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 14px;
      }

      .circle-card {
        cursor: pointer;
      }

      .circle-card:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }

      .circle-avatar {
        overflow: hidden;
      }

      .circle-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .circle-empty {
        font-size: 13px;
        color: var(--ink-faint);
        padding: 12px 4px;
      }

      .circle-top {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .circle-avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 12.5px;
        color: #0e0e11;
        flex-shrink: 0;
      }

      .circle-name {
        font-weight: 700;
        font-size: 13px;
        line-height: 1.2;
        color: var(--ink);
      }

      .circle-handle {
        font-size: 11px;
        color: var(--ink-faint);
      }

      .circle-meter {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .circle-track {
        flex: 1;
        height: 6px;
        background: var(--track);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .circle-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 1s cubic-bezier(.3,.8,.3,1), background-color .3s ease;
      }

      .circle-pct {
        font-weight: 700;
        font-size: 11.5px;
        white-space: nowrap;
        transition: color .3s ease;
      }

      .circle-caption {
        margin-top: 9px;
        font-size: 11px;
        line-height: 1.45;
        color: var(--ink-dim);
      }

      .circle-caption b {
        font-weight: 700;
      }

      /* ---------- bottom nav ---------- */
      .bottomTab {
        position: fixed;
        left: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 40px;
        width: 100%;
        padding: 10px 20px;
        background-color: var(--bg);
        border-top: 1px solid var(--card-border);
        z-index: 9999;
      }

      .bottomTab a {
        padding: 6px 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        color: var(--ink);
        font: bold 16px 'Urbanist', Arial, sans-serif;
        text-align: center;
        text-decoration: none;
        transition: all 0.25s ease;
      }

      .bottomTab a:hover,
      .bottomTab a[aria-current="page"] {
        color: #ffd166;
        border-color: rgba(255, 209, 102, 0.5);
        background-color: rgba(255, 209, 102, 0.08);
        box-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
        transform: translateY(-2px);
      }

      @media (max-width:480px) {
        .bottomTab {
          gap: 8px;
        }

        .bottomTab a {
          padding: 6px 8px;
          font-size: 14px;
        }
      }
    </style>
</head>
<body class="page-maximal">
<div class="bg-glow"><span></span><span></span><span></span></div>
<div class="phone">

  <div class="topbar">
    <button class="circle-btn" id="backBtn" aria-label="Go back" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="circle-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>

  <div class="fame-card" id="fameCard">
    <div class="fame-banner">

      <div class="fame-banner-top">

      <div class="fame-bio" id="fameBio">Lorem ipsum dolor sit amet</div>

      <script>
        // paint the cached profile the instant its elements exist
        // same trick as the theme script up top
        // this runs before the sparkle/gauge/count-up scripts below, so the
        // real profile data is already in place before anything else moves.
        (function () {
          var p = window.__cachedProfile;
          if (!p) return;
          var handle = p.handle ? '@' + p.handle.replace(/^@/, '') : '@yourhandle';
          document.getElementById('fameHandle').textContent = handle;
          document.getElementById('fameDisplayName').textContent = p.display_name || handle;
          if (p.bio) document.getElementById('fameBio').textContent = p.bio;
          if (p.avatar_url) document.getElementById('fameAvatarImg').src = p.avatar_url;

        })();

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight | Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>
  // apply saved theme immediately to avoid a flash of the wrong theme.
  (function () {
    var saved = localStorage.getItem('spotlight-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>

<script>
  // apply cached profile immediately, same idea as the theme script above:
  // read synchronously from localStorage so it paints before any other
  // script (including the css-transition-triggering ones) gets a chance to run.
  // the real network fetch still happens later to keep this fresh.
  window.__cachedProfile = null;
  (function () {
    try {
      var cached = localStorage.getItem('spotlight-profile');
      if (cached) window.__cachedProfile = JSON.parse(cached);
    } catch (e) {}
  })();
</script>

<style>
  :root,
  [data-theme="dark"]{
    --bg: #0a0a0d;
    --bg-glow: #131318;
    --card: #17181c;
    --card-border: #2a2620;
    --surface-1: #1c1d21;
    --surface-2: #151316;
    --surface-grad-1: #17181c;
    --surface-grad-2: #131317;
    --stat-bg: rgba(255,255,255,.03);
    --ink: #f2f1ee;
    --ink-dim: #a6a5ab;
    --ink-faint: #78757c;
    --gold: #f5c451;
    --gold-light: #e0b84e;
    --gold-deep: #c99a2e;
    --gold-glow: rgba(245,196,81,.18);
    --easy: #6fcf97;
    --hard: #f2685f;
    --verified: #4fa8dd;
    --track: #2a2a2f;
    --fame-grad-1: #1c1a13;
    --fame-grad-2: #19170f;
    --fame-grad-3: #16140d;
    --fame-edge: #17140d;
  }
  [data-theme="light"]{
    --bg: #eceaea;
    --bg-glow: #ffffff;
    --card: #ffffff;
    --card-border: rgba(0,0,0,0.1);
    --surface-1: #f2f0ec;
    --surface-2: #efece6;
    --surface-grad-1: #ffffff;
    --surface-grad-2: #f6f4f0;
    --stat-bg: rgba(0,0,0,.03);
    --ink: #1e1e1e;
    --ink-dim: rgba(0,0,0,.55);
    --ink-faint: rgba(0,0,0,.4);
    --gold: #9d8420;
    --gold-light: #b89a30;
    --gold-deep: #7a6418;
    --gold-glow: rgba(157,132,32,.14);
    --easy: #6fcf97;
    --hard: #f2685f;
    --verified: #4fa8dd;
    --track: #e0ddd3;
    --fame-grad-1: #fffaf0;
    --fame-grad-2: #fbf2dc;
    --fame-grad-3: #f5e9c8;
    --fame-edge: #fbf2dc;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  .bg-glow{
    position:fixed; inset:0; z-index:0;
    overflow:hidden; pointer-events:none;
  }
  .bg-glow span{
    position:absolute; border-radius:50%;
    filter: blur(80px); opacity:.28;
    animation: drift 26s ease-in-out infinite alternate;
  }
  .bg-glow span:nth-child(1){ width:420px; height:420px; background: radial-gradient(circle, #f5c451, transparent 70%); top:-140px; left:-100px; animation-duration:29s; }
  .bg-glow span:nth-child(2){ width:360px; height:360px; background: radial-gradient(circle, #b98b2c, transparent 70%); bottom:-100px; right:-80px; animation-duration:33s; animation-delay:-6s; }
  .bg-glow span:nth-child(3){ width:300px; height:300px; background: radial-gradient(circle, #6b5320, transparent 70%); top:35%; right:8%; animation-duration:23s; animation-delay:-3s; }
  @keyframes drift{
    0%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(30px,-25px) scale(1.12); }
    100%{ transform: translate(-20px,20px) scale(0.96); }
  }

  body{
    background: radial-gradient(ellipse at top, var(--bg-glow) 0%, var(--bg) 55%);
    position:relative; overflow-x:hidden;
    color: var(--ink);
    font-family:'Urbanist', system-ui, sans-serif;
    min-height:100vh;
    display:flex; justify-content:center;
    padding: 20px 0 90px;
  }
  .phone{ width:100%; max-width:430px; padding:0 18px; position:relative; z-index:1; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .circle-btn{
    width:38px; height:38px; border-radius:50%;
    background: var(--surface-1); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-dim); cursor:pointer;
  }

  /* ---------- fame card ---------- */
  .fame-card{
    position:relative;
    border-radius:28px;
    background: linear-gradient(165deg, var(--fame-grad-1) 0%, var(--fame-grad-2) 60%, var(--fame-grad-3) 100%);
    border:1.5px solid rgba(245,196,81,.28);
    box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 0 0 1px rgba(245,196,81,.05) inset;
    overflow:hidden;
    animation: cardRise .5s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes cardRise{
    from{ opacity:0; transform:translateY(14px) scale(.97); }
    to{ opacity:1; transform:none; }
  }
  .fame-card::after{
    content:"";
    position:absolute; top:-60%; left:-40%;
    width:55%; height:220%;
    background: linear-gradient(75deg, transparent 35%, rgba(245,220,160,.14) 48%, transparent 60%);
    transform: rotate(8deg);
    animation: shine 10s ease-in-out;
    pointer-events:none;
  }
  @keyframes shine{
    0%{ left:-60%; }
    35%{ left:130%; }
    100%{ left:130%; }
  }
  .sparkle{
    position:absolute; border-radius:50%;
    background: #f5c451;
    box-shadow: 0 0 6px 1px rgba(245,196,81,.7);
    animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(.7); }
    50%{ opacity:1; transform:scale(1.15); }
  }

  .fame-banner{
    position:relative;
    height:130px;
    background: var(--fame-grad-1);
    overflow:hidden;
    border-radius:26.5px 26.5px 0 0;
  }
  .fame-banner img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .fame-banner::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,.4) 0%, rgba(0,0,0,.05) 55%, rgba(10,9,6,.35) 100%);
  }
  .fame-banner-top{
    position:absolute; top:12px; left:14px; right:14px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:2;
  }
  .fame-banner-edit{
    position:absolute; bottom:10px; right:12px; z-index:2;
    width:30px; height:30px; border-radius:50%;
    background:rgba(10,9,6,.55); backdrop-filter: blur(4px);
    border:1px solid rgba(245,196,81,.25);
    display:flex; align-items:center; justify-content:center;
    color:#f5e6bf; cursor:pointer;
  }
  .fame-banner-edit:hover{ background:rgba(10,9,6,.75); }

  .fame-body{
    padding: 18px 22px 20px;
    position:relative; z-index:1;
    text-align:center;
  }
  .tier-chip, .level-chip{
    font-family:'Urbanist',sans-serif; font-weight:700; font-size:11px;
    letter-spacing:.05em; text-transform:uppercase;
    padding:6px 11px; border-radius:999px;
  }
  .tier-chip{ background:rgba(10,9,6,.55); color: var(--gold); border:1px solid rgba(245,196,81,.35); backdrop-filter: blur(4px); }
  .level-chip{ background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color:#1a1408; }

  .fame-main{
    display:flex; flex-direction:column; align-items:center;
    margin-top:18px; position:relative; z-index:1;
  }
  .ring-avatar{ position:relative; width:88px; height:88px; flex-shrink:0; }
  .ring-avatar svg{ position:absolute; inset:0; transform:rotate(-90deg); }
  .ring-avatar .ring-track{ fill:none; stroke:var(--track); stroke-width:5; }
  .ring-avatar .ring-fill{ fill:none; stroke:url(#ringGrad); stroke-width:5; stroke-linecap:round; stroke-dasharray:220; stroke-dashoffset:220; transition: stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1); }
  .avatar-photo{
    position:absolute; top:8px; left:8px; width:72px; height:72px;
    border-radius:50%; overflow:hidden; border:3px solid var(--fame-edge);
  }
  .avatar-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ring-pct{
    position:absolute; bottom:-2px; right:-4px;
    background: var(--gold-deep); color:#1a1408;
    font-family:'Urbanist',sans-serif; font-weight:700; font-size:10px;
    padding:2px 6px; border-radius:999px; border:2px solid var(--fame-edge);
  }

  .fame-id{ margin-top:12px; }
  .fame-name-row{ display:flex; align-items:center; justify-content:center; gap:5px; }
  .fame-name{ font-family:'Urbanist',sans-serif; font-weight:800; font-size:19px; }
  .verified{ width:16px; height:16px; color:var(--verified); flex-shrink:0; }
  .fame-handle{ color:var(--ink-faint); font-size:13.5px; margin-top:2px; }
  .fame-edit-btn{
    margin-top:12px;
    display:inline-flex; align-items:center; gap:5px;
    background:transparent; border:1.5px solid rgba(245,196,81,.4);
    color:var(--gold); font-family:'Urbanist',sans-serif; font-weight:700;
    font-size:11.5px; padding:7px 14px; border-radius:999px; cursor:pointer;
  }
  .fame-edit-btn:hover{ background: var(--gold-glow); }

  .fame-bio{
    margin-top:16px; font-size:14px; line-height:1.55;
    color: var(--ink-dim); position:relative; z-index:1;
    max-width:320px; margin-left:auto; margin-right:auto;
  }

  .fame-stats-row{
    display:flex; gap:8px; margin-top:18px; position:relative; z-index:1;
  }
  .fame-stat{
    flex:1; background: var(--stat-bg);
    border:1px solid var(--card-border); border-radius:14px;
    padding:10px 6px; text-align:center;
  }
  .fame-stat b{
    display:block; font-family:'Urbanist',sans-serif; font-weight:800; font-size:15px; color:var(--ink);
  }
  .fame-stat span{ font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }

  /* ---------- segmented tabs ---------- */
  .tabs{
    display:flex; gap:6px; margin-top:24px;
    background: var(--surface-2); border:1px solid var(--card-border);
    border-radius:999px; padding:4px;
  }
  .tab-btn{
    flex:1; border:none; background:transparent;
    font-family:'Urbanist',sans-serif; font-weight:700; font-size:13.5px;
    color: var(--ink-faint); padding:10px 0; border-radius:999px; cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .tab-btn.active{ background: var(--gold-glow); color:var(--gold); }

  .tab-panel{ display:none; margin-top:20px; }
  .tab-panel.active{ display:block; animation: fadeIn .35s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  /* ---------- overview: radial gauges ---------- */
  .gauge-row{ display:flex; justify-content:space-between; gap:10px; }
  .gauge{
    flex:1; background: linear-gradient(180deg, var(--surface-grad-1) 0%, var(--surface-grad-2) 100%);
    border:1px solid var(--card-border);
    border-radius:20px; padding:16px 8px 14px; text-align:center;
  }
  .gauge svg{ transform:rotate(-90deg); }
  .gauge-track{ fill:none; stroke:var(--track); stroke-width:8; }
  .gauge-fill{ fill:none; stroke-width:8; stroke-linecap:round; transition: stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1), stroke .3s ease; }
  .gauge-wrap{ position:relative; width:78px; height:78px; margin:0 auto; }
  .gauge-value{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Urbanist',sans-serif; font-weight:800; font-size:15px; color:var(--ink);
  }
  .gauge-label{ margin-top:10px; font-family:'Urbanist',sans-serif; font-weight:700; font-size:12.5px; color:var(--ink); }
  .gauge-delta{ font-size:11px; margin-top:2px; font-weight:600; }
  .gauge-caption{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; line-height:1.4; }

  /* ---------- circle: horizontal carousel ---------- */
  .circle-scroll{
    display:flex; gap:12px; overflow-x:auto;
    padding: 2px 2px 12px;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
  }
  .circle-scroll::-webkit-scrollbar{ height:5px; }
  .circle-scroll::-webkit-scrollbar-thumb{ background: var(--card-border); border-radius:999px; }
  .circle-card{
    scroll-snap-align:start;
    flex-shrink:0; width:158px;
    background: linear-gradient(180deg, var(--surface-grad-1) 0%, var(--surface-grad-2) 100%);
    border:1px solid var(--card-border);
    border-radius:18px; padding:14px;
  }
  .circle-top{ display:flex; align-items:center; gap:9px; }
  .circle-avatar{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Urbanist',sans-serif; font-weight:800; font-size:12.5px; color:#0e0e11;
    flex-shrink:0;
  }
  .circle-name{ font-family:'Urbanist',sans-serif; font-weight:700; font-size:13px; line-height:1.2; color:var(--ink); }
  .circle-handle{ font-size:11px; color:var(--ink-faint); }
  .circle-meter{ margin-top:12px; display:flex; align-items:center; gap:8px; }
  .circle-track{ flex:1; height:6px; background:var(--track); border-radius:999px; overflow:hidden; position:relative; }
  .circle-fill{ height:100%; border-radius:999px; transition: width 1s cubic-bezier(.3,.8,.3,1), background-color .3s ease; }
  .circle-pct{ font-family:'Urbanist',sans-serif; font-weight:700; font-size:11.5px; white-space:nowrap; transition: color .3s ease; }
  .circle-caption{ margin-top:9px; font-size:11px; line-height:1.45; color:var(--ink-dim); }
  .circle-caption b{ font-weight:700; }

  /* ---------- bottom nav ---------- */
  .bottomTab{
    position:fixed;
    left:0; bottom:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:40px;
    width:100%;
    padding:10px 20px;
    background-color: var(--bg);
    border-top:1px solid var(--card-border);
    z-index:9999;
  }
  .bottomTab a{
    padding:6px 14px;
    border:1px solid transparent;
    border-radius:10px;
    color:var(--ink);
    font: bold 16px 'Urbanist', Arial, sans-serif;
    text-align:center;
    text-decoration:none;
    transition: all 0.25s ease;
  }
  .bottomTab a:hover,
  .bottomTab a[aria-current="page"]{
    color:#ffd166;
    border-color: rgba(255, 209, 102, 0.5);
    background-color: rgba(255, 209, 102, 0.08);
    box-shadow: 0 0 12px rgba(255, 209, 102, 0.35);
    transform: translateY(-2px);
  }
  @media (max-width:480px){
    .bottomTab{ gap:8px; }
    .bottomTab a{ padding:6px 8px; font-size:14px; }
  }

  /* ---------- edit profile modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:10000;
    background:rgba(0,0,0,.55);
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{
    width:100%; max-width:430px;
    background: var(--card);
    border:1px solid var(--card-border);
    border-radius:24px 24px 0 0;
    padding:22px 20px 26px;
    max-height:88vh; overflow-y:auto;
    animation: sheetUp .3s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes sheetUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .modal-title{ font-family:'Urbanist',sans-serif; font-weight:800; font-size:16px; }
  .modal-close{
    width:30px; height:30px; border-radius:50%;
    background: var(--surface-1); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-dim); cursor:pointer;
  }
  .modal-field{ margin-bottom:14px; }
  .modal-field label{
    display:block; font-family:'Urbanist',sans-serif; font-weight:700;
    font-size:11.5px; letter-spacing:.04em; text-transform:uppercase;
    color: var(--ink-faint); margin-bottom:6px;
  }
  .modal-field input[type="text"],
  .modal-field textarea{
    width:100%; background: var(--surface-1); border:1px solid var(--card-border);
    border-radius:12px; padding:10px 12px; color: var(--ink);
    font-family:'Urbanist',sans-serif; font-size:13.5px; resize:vertical;
  }
  .modal-field textarea{ min-height:70px; line-height:1.5; }
  .modal-field input[type="text"]:focus,
  .modal-field textarea:focus{ outline:none; border-color: var(--gold); }
  .modal-upload-row{ display:flex; gap:12px; align-items:center; }
  .modal-upload-preview{
    width:52px; height:52px; border-radius:50%; overflow:hidden;
    flex-shrink:0; border:1px solid var(--card-border); background:var(--surface-1);
  }
  .modal-upload-preview.header-preview{ width:100%; height:70px; border-radius:12px; }
  .modal-upload-preview img{ width:100%; height:100%; object-fit:cover; display:block; }
  .modal-upload-btn{
    font-family:'Urbanist',sans-serif; font-weight:700; font-size:12px;
    background: var(--surface-1); border:1px solid var(--card-border);
    color: var(--ink); padding:8px 12px; border-radius:999px; cursor:pointer;
  }
  .modal-save-btn{
    width:100%; margin-top:6px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color:#1a1408; font-family:'Urbanist',sans-serif; font-weight:800; font-size:14px;
    border:none; border-radius:14px; padding:13px 0; cursor:pointer;
  }
  .modal-save-btn:disabled{ opacity:.6; cursor:default; }
  .modal-status{
    text-align:center; font-size:12px; margin-top:10px; min-height:16px;
    color: var(--ink-faint);
  }
  .modal-status.error{ color: var(--hard); }
  .modal-status.success{ color: var(--easy); }
</style>
</head>
<body>
<div class="bg-glow"><span></span><span></span><span></span></div>
<div class="phone">

  <div class="topbar">
    <button class="circle-btn" id="backBtn" aria-label="Go back" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="circle-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </div>
  </div>

  <div class="fame-card" id="fameCard">
    <div class="fame-banner">
      <img id="fameHeaderImg" src="https://picsum.photos/seed/ariavancecover/860/400" alt="">
      <div class="fame-banner-top">
        <div class="tier-chip">Rising Star</div>
        <div class="level-chip">LV 12</div>
      </div>
      <div class="fame-banner-edit" id="headerCameraBtn" role="button" aria-label="Change header image">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <input type="file" id="headerCameraInput" accept="image/*" style="display:none;">
    </div>

    <div class="fame-body">
      <div class="fame-main">
        <div class="ring-avatar">
          <svg viewBox="0 0 88 88">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f0cf7e"/>
                <stop offset="100%" stop-color="#c99a2e"/>
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="44" cy="44" r="37"/>
            <circle class="ring-fill" id="avatarRing" cx="44" cy="44" r="37"/>
          </svg>
          <div class="avatar-photo"><img id="fameAvatarImg" src="https://picsum.photos/seed/ariavance/160/160" alt=""></div>
          <div class="ring-pct" id="ringPctLabel">68%</div>
        </div>
        <div class="fame-id">
          <div class="fame-name-row">
            <span class="fame-name" id="fameDisplayName">Display name</span>
            <svg class="verified" viewBox="0 0 22 22" fill="currentColor"><path d="M11 0l2.4 1.4 2.7-.6 1.4 2.4 2.7.6.3 2.8 2 1.9-1.2 2.5 1.2 2.5-2 1.9-.3 2.8-2.7.6-1.4 2.4-2.7-.6L11 22l-2.4-1.4-2.7.6-1.4-2.4-2.7-.6-.3-2.8-2-1.9 1.2-2.5L.2 8.5l2-1.9.3-2.8 2.7-.6L6.6.8 9.3 1.4 11 0z"/><path fill="#0e0e11" d="M9.3 14.9L5.6 11.2l1.4-1.4 2.3 2.3 5-5 1.4 1.4z"/></svg>
          </div>
          <div class="fame-handle" id="fameHandle">@handle</div>
          <button class="fame-edit-btn" id="editProfileBtn">Edit Profile</button>
        </div>
      </div>

      <div class="fame-bio" id="fameBio">Lorem ipsum dolor sit amet</div>

      <script>
        // paint the cached profile the instant its elements exist
        // same trick as the theme script up top
        // this runs before the sparkle/gauge/count-up scripts below, so the
        // real profile data is already in place before anything else moves.
        (function () {
          var p = window.__cachedProfile;
          if (!p) return;
          var handle = p.handle ? '@' + p.handle.replace(/^@/, '') : '@yourhandle';
          document.getElementById('fameHandle').textContent = handle;
          document.getElementById('fameDisplayName').textContent = p.display_name || handle;
          if (p.bio) document.getElementById('fameBio').textContent = p.bio;
          if (p.avatar_url) document.getElementById('fameAvatarImg').src = p.avatar_url;
          if (p.header_url) document.getElementById('fameHeaderImg').src = p.header_url;
        })();
      </script>

      <div class="fame-stats-row">
        <div class="fame-stat"><b id="statFollowers">0</b><span>Followers</span></div>
        <div class="fame-stat"><b id="statFollowing">0</b><span>Following</span></div>
        <div class="fame-stat"><b>#7</b><span>Rank</span></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="circle">Inner Circle</button>
  </div>

  <div class="tab-panel active" id="panel-overview">
    <div class="gauge-row" id="gaugeRow"></div>
  </div>

  <div class="tab-panel" id="panel-circle">
    <div class="circle-scroll" id="circleScroll"></div>
  </div>

  <div class="modal-overlay" id="editModalOverlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="modal-title">Edit Profile</div>
        <button class="modal-close" id="editModalClose" type="button" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-field">
        <label>Avatar</label>
        <div class="modal-upload-row">
          <div class="modal-upload-preview" id="avatarPreviewWrap">
            <img id="avatarPreviewImg" src="" alt="">
          </div>
          <label class="modal-upload-btn" for="avatarFileInput">Change Avatar</label>
          <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
        </div>
      </div>

      <div class="modal-field">
        <label>Display Name</label>
        <input type="text" id="editDisplayName" maxlength="40" placeholder="Your name">
      </div>

      <div class="modal-field">
        <label>Handle</label>
        <input type="text" id="editHandle" maxlength="30" placeholder="yourhandle">
      </div>

      <div class="modal-field">
        <label>Bio</label>
        <textarea id="editBio" maxlength="160" placeholder="Tell people about yourself"></textarea>
      </div>

      <button class="modal-save-btn" id="editSaveBtn" type="button">Save Changes</button>
      <div class="modal-status" id="editStatus"></div>
    </div>
  </div>

  <nav class="bottomTab" aria-label="Primary navigation">
    <a href="Feed.html">Feed</a>
    <a href="events.html">Explore</a>
    <a href="notifications.html">Beams</a>
    <a href="Stage.html">Stage</a>
    <a href="IconPage.html" aria-current="page">Profile</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="scripts/supabase.js"></script>
<script src="scripts/theme.js"></script>

<script>
   /* ---------- load real profile data ---------- */
   // cached version already painted synchronously above (see the inline
   // script right after the fame-bio element). this just refreshes it
   // from the network in the background and updates the cache for next time.
  let currentProfile = null;

  async function loadIconProfile() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;

    const { data: profile, error } = await supabaseClient
      .from('profiles')
      .select('display_name, handle, bio, avatar_url, header_url')
      .eq('id', user.id)
      .single();

    if (error || !profile) {
      if (error) console.error('Could not load profile:', error);
      return;
    }

    currentProfile = profile;
    applyProfileToDOM(profile);

    try {
      localStorage.setItem('spotlight-profile', JSON.stringify(profile));
    } catch (e) {}
  }

  function applyProfileToDOM(profile) {
    const handle = profile.handle ? `@${profile.handle.replace(/^@/, '')}` : '@yourhandle';
    document.getElementById('fameHandle').textContent = handle;
    document.getElementById('fameDisplayName').textContent = profile.display_name || handle;

    if (profile.bio) {
      document.getElementById('fameBio').textContent = profile.bio;
    }
    if (profile.avatar_url) {
      document.getElementById('fameAvatarImg').src = profile.avatar_url;
    }
    if (profile.header_url) {
      document.getElementById('fameHeaderImg').src = profile.header_url;
    }
  }

  loadIconProfile();
</script>

<script>
  /* ---------- back button: return to whichever page the user came from ---------- */
  document.getElementById('backBtn').addEventListener('click', () => {
    const lastPage = sessionStorage.getItem('spotlight-last-page') || 'Feed.html';
    window.location.href = lastPage;
  });

  /* ---------- sparkles inside fame card ---------- */
  const fameCard = document.getElementById('fameCard');
  const sparklePositions = [
    {top:'58%', left:'88%', size:4, delay:'0s'},
    {top:'74%', left:'8%', size:3, delay:'.8s'},
    {top:'90%', left:'70%', size:5, delay:'1.6s'},
    {top:'66%', left:'50%', size:3, delay:'2.2s'},
  ];
  sparklePositions.forEach(s => {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.style.top = s.top; el.style.left = s.left;
    el.style.width = s.size+'px'; el.style.height = s.size+'px';
    el.style.animationDelay = s.delay;
    fameCard.appendChild(el);
  });

  /* ---------- avatar progress ring ---------- */
  const AVATAR_R = 37, AVATAR_C = 2*Math.PI*AVATAR_R;
  const avatarRing = document.getElementById('avatarRing');
  avatarRing.style.strokeDasharray = AVATAR_C;
  function setAvatarRing(pct){
    const offset = AVATAR_C * (1 - pct/100);
    avatarRing.style.strokeDashoffset = offset;
  }
  requestAnimationFrame(() => setTimeout(() => setAvatarRing(68), 150));

  /* ---------- count-up stats ---------- */
  function countUp(el, target, suffix){
    const duration = 900;
    const t0 = performance.now();
    function tick(now){
      const p = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = target * eased;
      el.textContent = (target >= 1000 ? val.toFixed(1) : Math.round(val)) + suffix;
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = target + suffix;
    }
    requestAnimationFrame(tick);
  }
  countUp(document.getElementById('statFollowers'), 128.4, 'K');
  countUp(document.getElementById('statFollowing'), 892, '');

  /* ---------- tabs ---------- */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  /* ---------- overview radial gauges ---------- */
  const STATS = [
    { id:'humor', label:'Humor', value:24, delta:1, color:'#f5c451', caption:"You're comedy gold." },
    { id:'aura', label:'Aura', value:29, delta:2, color:'#6fcf97', caption:'Captivating presence.' },
    { id:'chaos', label:'Chaos', value:41, delta:3, color:'#f2685f', caption:'Main-character energy.' },
  ];
  const G_R = 32, G_C = 2*Math.PI*G_R;
  const gaugeRow = document.getElementById('gaugeRow');
  STATS.forEach(s => {
    const el = document.createElement('div');
    el.className = 'gauge';
    el.innerHTML = `
      <div class="gauge-wrap">
        <svg viewBox="0 0 78 78" width="78" height="78">
          <circle class="gauge-track" cx="39" cy="39" r="${G_R}"/>
          <circle class="gauge-fill" id="fill-${s.id}" cx="39" cy="39" r="${G_R}" stroke="${s.color}" stroke-dasharray="${G_C}" stroke-dashoffset="${G_C}"/>
        </svg>
        <div class="gauge-value" id="val-${s.id}">0%</div>
      </div>
      <div class="gauge-label">${s.label}</div>
      <div class="gauge-delta" id="delta-${s.id}" style="color:${s.color};">+${s.delta}%</div>
      <div class="gauge-caption">${s.caption}</div>
    `;
    gaugeRow.appendChild(el);
  });

  function setGauge(s, animate){
    const fillEl = document.getElementById('fill-' + s.id);
    const valEl = document.getElementById('val-' + s.id);
    const deltaEl = document.getElementById('delta-' + s.id);
    const offset = G_C * (1 - Math.max(0, Math.min(100, s.value)) / 100);
    fillEl.style.strokeDashoffset = offset;
    valEl.textContent = Math.round(s.value) + '%';
    deltaEl.textContent = (s.delta >= 0 ? '+' : '') + s.delta + '%';
    deltaEl.style.color = s.delta >= 0 ? '#6fcf97' : '#f2685f';
    if (animate){
      valEl.style.transition = 'none';
      valEl.style.transform = 'scale(1.25)';
      requestAnimationFrame(() => {
        valEl.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1)';
        valEl.style.transform = 'scale(1)';
      });
    }
  }

  requestAnimationFrame(() => setTimeout(() => STATS.forEach(s => setGauge(s)), 150));

  setInterval(() => {
    const s = STATS[Math.floor(Math.random() * STATS.length)];
    const delta = (Math.random() * 6) - 2;
    s.value = Math.max(6, Math.min(94, s.value + delta));
    s.delta = Math.round(delta * 10) / 10;
    setGauge(s, true);
  }, 3400);

  /* ---------- inner circle carousel ---------- */
  const RELATIONSHIPS = [
    { name:"Kai Velvet", handle:"@KaiVelvet", initials:"KV", color:"#f5c451", pct:4.9, delta:1.9, caption:"Loves a good sleep joke, even about you." },
    { name:"Nora Noire", handle:"@NoraNoire", initials:"NN", color:"#4fa8dd", pct:4.9, delta:1.0, caption:"Thinks your chaos era is iconic content." },
    { name:"Lumen Rae", handle:"@LumenRae", initials:"LR", color:"#6fcf97", pct:22.9, delta:0.8, caption:"Your ride-or-die since day one." },
    { name:"Dash Wilder", handle:"@DashWilder", initials:"DW", color:"#f2685f", pct:-1.9, delta:-1.0, caption:"Hates sharing the spotlight." },
    { name:"Echo Monroe", handle:"@EchoMonroe", initials:"EM", color:"#c792ea", pct:9.4, delta:0.4, caption:"Likes your posts at odd hours." },
    { name:"Zara Flint", handle:"@ZaraFlint", initials:"ZF", color:"#f2a13d", pct:15.2, delta:1.3, caption:"Your go-to for honest fit checks." },
    { name:"Orion Page", handle:"@OrionPage", initials:"OP", color:"#8ab4f8", pct:-3.1, delta:-0.6, caption:"Still salty about the missed launch." },
    { name:"Riva Jax", handle:"@RivaJax", initials:"RJ", color:"#f582ae", pct:6.7, delta:0.2, caption:"Cryptic comment-section emoji energy." },
  ];

  const verifiedSVG = `<svg width="12" height="12" viewBox="0 0 22 22" fill="currentColor" style="color:#4fa8dd;"><path d="M11 0l2.4 1.4 2.7-.6 1.4 2.4 2.7.6.3 2.8 2 1.9-1.2 2.5 1.2 2.5-2 1.9-.3 2.8-2.7.6-1.4 2.4-2.7-.6L11 22l-2.4-1.4-2.7.6-1.4-2.4-2.7-.6-.3-2.8-2-1.9 1.2-2.5L.2 8.5l2-1.9.3-2.8 2.7-.6L6.6.8 9.3 1.4 11 0z"/></svg>`;

  function scaleToBar(pct){
    const clamped = Math.max(-30, Math.min(40, pct));
    return Math.max(4, Math.min(96, ((clamped + 30) / 70) * 100));
  }

  const circleScroll = document.getElementById('circleScroll');
  RELATIONSHIPS.forEach((r, i) => {
    r.uid = 'circ-' + i;
    const el = document.createElement('div');
    el.className = 'circle-card';
    el.innerHTML = `
      <div class="circle-top">
        <div class="circle-avatar" style="background:${r.color};">${r.initials}</div>
        <div>
          <div class="circle-name">${r.name} ${verifiedSVG}</div>
          <div class="circle-handle">${r.handle}</div>
        </div>
      </div>
      <div class="circle-meter">
        <div class="circle-track"><div class="circle-fill" id="fill-${r.uid}" style="width:0%;"></div></div>
        <div class="circle-pct" id="pct-${r.uid}">${r.pct > 0 ? '+' : ''}${r.pct.toFixed(1)}%</div>
      </div>
      <div class="circle-caption"><b style="color:${r.delta>=0?'#6fcf97':'#f2685f'};">${r.delta>0?'+':''}${r.delta}%</b> ${r.caption}</div>
    `;
    circleScroll.appendChild(el);
  });

  function setCircle(r, animate){
    const pos = r.pct >= 0;
    const color = pos ? '#6fcf97' : '#f2685f';
    const width = scaleToBar(r.pct);
    const fillEl = document.getElementById('fill-' + r.uid);
    const pctEl = document.getElementById('pct-' + r.uid);
    fillEl.style.width = width + '%';
    fillEl.style.background = color;
    pctEl.textContent = (r.pct > 0 ? '+' : '') + r.pct.toFixed(1) + '%';
    pctEl.style.color = color;
    if (animate){
      pctEl.style.transform = 'scale(1.3)';
      setTimeout(() => { pctEl.style.transition='transform .4s cubic-bezier(.34,1.56,.64,1)'; pctEl.style.transform='scale(1)'; }, 20);
    }
  }
  requestAnimationFrame(() => setTimeout(() => RELATIONSHIPS.forEach(r => setCircle(r)), 150));
  setInterval(() => {
    const r = RELATIONSHIPS[Math.floor(Math.random() * RELATIONSHIPS.length)];
    const delta = (Math.random() * 7) - 3.5;
    r.pct = Math.max(-25, Math.min(35, r.pct + delta));
    r.delta = Math.round(delta * 10) / 10;
    setCircle(r, true);
  }, 2800);

  /* ---------- header camera button: direct upload ---------- */
  const headerCameraBtn = document.getElementById('headerCameraBtn');
  const headerCameraInput = document.getElementById('headerCameraInput');
  const fameHeaderImg = document.getElementById('fameHeaderImg');

  headerCameraBtn.addEventListener('click', () => headerCameraInput.click());

  headerCameraInput.addEventListener('change', async function () {
    const file = this.files[0];
    if (!file) return;

    const dataUrl = await readFileAsDataUrl(file);
    fameHeaderImg.src = dataUrl;

    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) {
      console.log('Could not save header image:', userError || 'No signed-in user.');
      return;
    }

    const { data: updated, error } = await supabaseClient
      .from('profiles')
      .update({ header_url: dataUrl })
      .eq('id', user.id)
      .select('display_name, handle, bio, avatar_url, header_url')
      .single();

    if (error) {
      console.log('Could not save header image:', error);
      return;
    }
    currentProfile = updated;
    try { localStorage.setItem('spotlight-profile', JSON.stringify(updated)); } catch (e) {}
  });

  /* ---------- edit profile modal ---------- */
  const editModalOverlay = document.getElementById('editModalOverlay');
  const editProfileBtn = document.getElementById('editProfileBtn');
  const editModalClose = document.getElementById('editModalClose');
  const editDisplayName = document.getElementById('editDisplayName');
  const editHandle = document.getElementById('editHandle');
  const editBio = document.getElementById('editBio');
  const avatarPreviewImg = document.getElementById('avatarPreviewImg');
  const avatarFileInput = document.getElementById('avatarFileInput');
  const editSaveBtn = document.getElementById('editSaveBtn');
  const editStatus = document.getElementById('editStatus');

  let pendingAvatarDataUrl = null;

  function openEditModal() {
    const p = currentProfile || {};
    editDisplayName.value = p.display_name || '';
    editHandle.value = (p.handle || '').replace(/^@/, '');
    editBio.value = p.bio || '';
    avatarPreviewImg.src = p.avatar_url || document.getElementById('fameAvatarImg').src;
    pendingAvatarDataUrl = null;
    editStatus.textContent = '';
    editStatus.className = 'modal-status';
    editModalOverlay.classList.add('open');
  }

  function closeEditModal() {
    editModalOverlay.classList.remove('open');
  }

  editProfileBtn.addEventListener('click', openEditModal);
  editModalClose.addEventListener('click', closeEditModal);
  editModalOverlay.addEventListener('click', (e) => {
    if (e.target === editModalOverlay) closeEditModal();
  });

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  avatarFileInput.addEventListener('change', async function () {
    const file = this.files[0];
    if (!file) return;
    pendingAvatarDataUrl = await readFileAsDataUrl(file);
    avatarPreviewImg.src = pendingAvatarDataUrl;
  });

  editSaveBtn.addEventListener('click', async () => {
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) {
      editStatus.textContent = 'You need to be signed in to save changes.';
      editStatus.className = 'modal-status error';
      return;
    }

    const handleRaw = editHandle.value.trim().replace(/^@/, '');
    const updates = {
      display_name: editDisplayName.value.trim(),
      handle: handleRaw,
      bio: editBio.value.trim(),
    };
    if (pendingAvatarDataUrl) updates.avatar_url = pendingAvatarDataUrl;

    editSaveBtn.disabled = true;
    editSaveBtn.textContent = 'Saving...';
    editStatus.textContent = '';
    editStatus.className = 'modal-status';

    const { data: updated, error } = await supabaseClient
      .from('profiles')
      .update(updates)
      .eq('id', user.id)
      .select('display_name, handle, bio, avatar_url, header_url')
      .single();

    editSaveBtn.disabled = false;
    editSaveBtn.textContent = 'Save Changes';

    if (error) {
      console.error('Could not save profile:', error);
      editStatus.textContent = 'Could not save changes. Try again.';
      editStatus.className = 'modal-status error';
      return;
    }

    currentProfile = updated;
    applyProfileToDOM(updated);
    try { localStorage.setItem('spotlight-profile', JSON.stringify(updated)); } catch (e) {}
    editStatus.textContent = 'Saved!';
    editStatus.className = 'modal-status success';
    setTimeout(closeEditModal, 600);
  });
</script>

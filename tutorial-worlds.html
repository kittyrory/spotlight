<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight | Tutorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@100..800&family=DM+Mono:wght@300;400&family=DM+Sans:wght@400;600&family=Source+Code+Pro:wght@700&display=swap"
      rel="stylesheet"
    />

    <script>
      // apply saved theme immediately to avoid a flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem("spotlight-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root,
      [data-theme="dark"] {
        --gold: #ffd500;
        --gold2: #ffd500;
        --white: #ffffff;
        --bg: #000000;
        --muted: rgba(255, 255, 255, 0.35);
        --body-text: rgba(255, 255, 255, 0.45);
        --body-readable: rgba(255, 255, 255, 0.78);
        --button-border: rgba(255, 246, 202, 0.6);
        --glow-1: rgba(255, 213, 0, 0.7);
        --glow-2: rgba(255, 213, 0, 0.4);
        --glow-3: rgba(255, 213, 0, 0.15);
        --pulse-base: rgba(255, 255, 255, 0.2);
        --pulse-1: rgba(255, 213, 0, 0.45);
        --pulse-2: rgba(255, 255, 255, 0.15);
        --hover-shadow-1: rgba(255, 213, 0, 0.55);
        --hover-shadow-2: rgba(255, 213, 0, 0.3);
        --card-border: rgba(255, 255, 255, 0.08);
      }

      [data-theme="light"] {
        --gold: #ffec3f;
        --gold2: #9d9129;
        --white: #1e1e1e;
        --bg: #eceaea;
        --muted: rgba(0, 0, 0, 0.35);
        --body-text: rgba(0, 0, 0, 0.5);
        --body-readable: rgba(0, 0, 0, 0.72);
        --button-border: rgba(0, 0, 0, 0.3);
        --glow-1: rgba(163, 118, 10, 0.35);
        --glow-2: rgba(163, 118, 10, 0.18);
        --glow-3: rgba(163, 118, 10, 0.08);
        --pulse-base: rgba(0, 0, 0, 0.1);
        --pulse-1: rgba(163, 118, 10, 0.3);
        --pulse-2: rgba(0, 0, 0, 0.08);
        --hover-shadow-1: rgba(163, 118, 10, 0.3);
        --hover-shadow-2: rgba(163, 118, 10, 0.15);
        --card-border: rgba(0, 0, 0, 0.1);
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        background-color: var(--bg);
        font-family: "Anek Latin", Arial, sans-serif;
        transition: background-color 0.25s ease;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* ── Tutorial card ── */
      .tutorial-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(14px, 2.5vw, 22px);
        text-align: center;
        padding: 0 1.5rem;
        max-width: 640px;
      }

      .tutorial-title {
        font-family: "Anek Latin", Arial, sans-serif;
        font-weight: 700;
        font-size: clamp(1.8rem, 5.5vw, 3rem);
        color: var(--white);
        line-height: 1.1;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }

      .tutorial-title.gold {
        color: var(--gold);
        text-shadow:
          0 0 8px var(--glow-1),
          0 0 22px var(--glow-2),
          0 0 40px var(--glow-3);
      }

      .tutorial-title.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .tutorial-subtitle {
        font-family: "DM Mono", monospace;
        font-size: clamp(0.6rem, 0.85vw, 0.7rem);
        font-weight: 300;
        letter-spacing: 0.35em;
        color: var(--body-text);
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.4s ease 0.1s;
      }

      .tutorial-subtitle.visible {
        opacity: 1;
      }

      .tutorial-body {
        font-family: "Anek Latin", Arial, sans-serif;
        font-weight: 400;
        font-size: clamp(0.95rem, 1.4vw, 1.15rem);
        line-height: 1.65;
        color: var(--body-readable);
        opacity: 0;
        transition: opacity 0.35s ease;
        min-height: 1.65em;
      }

      .tutorial-body.visible {
        opacity: 1;
      }

      .tap-hint {
        font-family: "DM Mono", monospace;
        font-size: clamp(0.55rem, 0.75vw, 0.65rem);
        font-weight: 300;
        letter-spacing: 0.3em;
        color: var(--body-text);
        text-transform: uppercase;
        margin-top: clamp(8px, 2vw, 16px);
        animation: pulse-glow 2.6s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%,
        100% {
          text-shadow: 0 0 4px var(--pulse-base);
        }
        50% {
          text-shadow:
            0 0 8px var(--pulse-1),
            0 0 18px var(--pulse-2);
        }
      }

      .tutorial-buttons {
        display: flex;
        gap: clamp(10px, 2vw, 16px);
        margin-top: clamp(10px, 2vw, 18px);
        flex-wrap: wrap;
        justify-content: center;
      }

      .glow-button {
        display: inline-block;
        padding: clamp(12px, 1.5vw, 16px) clamp(24px, 3vw, 30px);
        cursor: pointer;
        border-radius: 100px;
        background-color: transparent;
        border: 1.5px solid var(--button-border);
        font-family: "Source Code Pro", monospace;
        font-weight: 700;
        font-size: clamp(0.65rem, 0.9vw, 0.75rem);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--white);
        text-decoration: none;
        transition:
          background-color 0.25s ease,
          color 0.25s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease;
      }

      .glow-button:hover {
        background-color: var(--gold);
        color: var(--white);
        border-color: var(--gold);
        box-shadow:
          0 0 10px var(--hover-shadow-1),
          0 0 28px var(--hover-shadow-2);
      }

      /* progress dots */
      .progress-dots {
        position: fixed;
        top: clamp(20px, 4vh, 32px);
        display: flex;
        gap: 8px;
      }

      .progress-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--card-border);
        transition:
          background 0.3s ease,
          transform 0.3s ease;
      }

      .progress-dots span.active {
        background: var(--gold2);
        transform: scale(1.3);
      }
    </style>
  </head>
  <body>
    <div class="progress-dots" id="progress-dots"></div>

    <div class="tutorial-wrap">
      <h1 class="tutorial-title" id="tutorial-title"></h1>
      <p class="tutorial-subtitle" id="tutorial-subtitle"></p>
      <p class="tutorial-body" id="tutorial-body"></p>
      <div class="tutorial-buttons" id="tutorial-buttons"></div>
      <div class="tap-hint" id="tap-hint">
        Click or tap the screen to continue
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/theme.js"></script>

    <script>
      const pages = [
        {
          type: "standard",
          title: "And finally: world-building!",
          subtitle: null,
          chunks: [
            "I think I’m getting a good idea on what you’re like, [DISPLAY NAME]. But what about the world around you?",
            "You can choose up to three worlds during setup. But don’t worry — you’ll be able to choose more later.",
          ],
          finalCTA: { label: "Create World", href: "world-selection.html" },
        },
      ];

      const DOT_OFFSET = 4;
      const TOTAL_DOTS = 5;

      // pull the player's display name from Supabase and drop it into the
      // [DISPLAY NAME] placeholder before anything renders.
      async function loadDisplayName() {
        let displayName = "Superstar";
        try {
          const {
            data: { user },
            error: userError,
          } = await supabaseClient.auth.getUser();
          if (userError || !user) {
            console.log(
              "Could not load display name for tutorial:",
              userError || "No signed-in user.",
            );
          } else {
            const { data: profile, error } = await supabaseClient
              .from("profiles")
              .select("display_name")
              .eq("id", user.id)
              .single();

            if (error) {
              console.log("Could not load display name for tutorial:", error);
            } else if (profile && profile.display_name) {
              displayName = profile.display_name;
            }
          }
        } catch (e) {
          console.log("Could not load display name for tutorial:", e);
        }

        pages[0].chunks[0] = pages[0].chunks[0].replace(
          "[DISPLAY NAME]",
          displayName,
        );
      }

      let pageIndex = 0;
      let chunkIndex = 0;
      let showCTA = false;

      const titleEl = document.getElementById("tutorial-title");
      const subtitleEl = document.getElementById("tutorial-subtitle");
      const bodyEl = document.getElementById("tutorial-body");
      const buttonsEl = document.getElementById("tutorial-buttons");
      const tapHintEl = document.getElementById("tap-hint");
      const dotsEl = document.getElementById("progress-dots");

      function buildDots() {
        for (let i = 0; i < TOTAL_DOTS; i++) {
          dotsEl.appendChild(document.createElement("span"));
        }
      }

      function updateDots() {
        const activeIndex = DOT_OFFSET + pageIndex;
        [...dotsEl.children].forEach((dot, i) => {
          dot.classList.toggle("active", i === activeIndex);
        });
      }

      function render() {
        const page = pages[pageIndex];

        // title / subtitle
        titleEl.textContent = page.title || "";
        titleEl.classList.toggle("visible", !!page.title);
        titleEl.classList.toggle("gold", !!page.titleGold);

        subtitleEl.textContent = page.subtitle || "";
        subtitleEl.classList.toggle("visible", !!page.subtitle);

        // body chunk fade
        bodyEl.classList.remove("visible");
        buttonsEl.innerHTML = "";

        setTimeout(() => {
          bodyEl.textContent = page.chunks[chunkIndex] || "";
          bodyEl.classList.toggle("visible", !!page.chunks[chunkIndex]);

          if (page.type === "confirm") {
            tapHintEl.style.display = "none";
            page.buttons.forEach((btn) => {
              const b = document.createElement("a");
              b.href = "#";
              b.className = "glow-button";
              b.textContent = btn.label;
              b.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (btn.action === "next") {
                  pageIndex++;
                  chunkIndex = 0;
                  render();
                } else if (btn.action === "exit") {
                  window.location.href = EXIT_URL;
                }
              });
              buttonsEl.appendChild(b);
            });
          } else if (showCTA && page.finalCTA) {
            tapHintEl.style.display = "none";
            const b = document.createElement("a");
            b.href = page.finalCTA.href;
            b.className = "glow-button";
            b.textContent = page.finalCTA.label;
            b.addEventListener("click", (e) => e.stopPropagation());
            buttonsEl.appendChild(b);
          } else {
            tapHintEl.style.display = "";
          }
        }, 180);

        updateDots();
      }

      function advance() {
        const page = pages[pageIndex];
        if (page.type === "confirm") return; // handled by buttons only
        if (showCTA) return; // waiting for CTA click

        if (chunkIndex < page.chunks.length - 1) {
          chunkIndex++;
          render();
          return;
        }

        if (pageIndex === pages.length - 1) {
          if (page.finalCTA) {
            showCTA = true;
            render();
          } else {
            window.location.href = NEXT_URL;
          }
        } else {
          pageIndex++;
          chunkIndex = 0;
          render();
        }
      }

      document.body.addEventListener("click", advance);

      async function init() {
        buildDots();
        await loadDisplayName();
        render();
      }

      init();
    </script>
  </body>
</html>

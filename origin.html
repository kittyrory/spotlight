<!DOCTYPE html>
<head>
  <html lang="en" data-theme="dark">
  <meta charset="UTF-8">
  <title>Spotlight | Origin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,300;1,700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    // apply saved theme immediately to avoid a flash of the wrong theme.
    (function () {
      var saved = localStorage.getItem('spotlight-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <style>
    :root,
    [data-theme="dark"] {
      --bg: #000000;
      --text: #ffffff;
      --muted: #666666;
      --card-bg: #1a1a1a;
      --card-border: #444444;
      --card-hover-bg: #242424;
      --card-hover-border: #A38800;
      --card-selected-bg: #0D0D0D;
      --card-title: #ffffff;
      --progress-done: #755C00;
      --progress-upcoming: #555555;
      --back-border: #555555;
      --back-color: #555555;
      --back-hover-color: #808080;
      --toggle-border: rgba(255, 255, 255, 0.25);
      --toggle-hover-shadow: rgba(226, 187, 0, 0.3);
    }

    [data-theme="light"] {
      --bg: #f4f3f1;
      --text: #1e1e1e;
      --muted: #767676;
      --card-bg: #ffffff;
      --card-border: #dcdcdc;
      --card-hover-bg: #f2f0ea;
      --card-hover-border: #c9ab4a;
      --card-selected-bg: #fbf6e4;
      --card-title: #1e1e1e;
      --progress-done: #c9ab4a;
      --progress-upcoming: #dddddd;
      --back-border: #cccccc;
      --back-color: #999999;
      --back-hover-color: #666666;
      --toggle-border: rgba(0, 0, 0, 0.25);
      --toggle-hover-shadow: rgba(226, 187, 0, 0.3);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    #theme-toggle {
      position: fixed;
      top: clamp(16px, 3vw, 32px);
      left: clamp(16px, 3vw, 32px);
      z-index: 20;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1.5px solid var(--toggle-border);
      background-color: transparent;
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
    }

    #theme-toggle:hover {
      border-color: #e2bb00;
      box-shadow: 0 0 12px var(--toggle-hover-shadow);
    }

    #theme-toggle:active {
      transform: scale(0.92);
    }

    #theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    [data-theme="dark"] #theme-toggle .icon-moon,
    [data-theme="light"] #theme-toggle .icon-sun {
      display: none;
    }

    .p1 {
      color: #e2bb00;
      font-family: 'Open Sans', sans-serif;
    }

    .p2 {
      font-family: 'Open Sans', sans-serif;
      color: var(--muted);
      font-size: 14px;
      margin-top: -10px;
    }

    .div1 {
      text-align: center;
    }

    .div2 {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      text-align: left;
      padding: 0 16px;
      box-sizing: border-box;
    }

    h1 {
      font-family: 'Open Sans', Arial;
      font-size: 32px;
    }

    .progress-bar {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .progress-step {
      flex: 1;
      height: 3px;
      border-radius: 9999px;
    }

    .cont {
      background-color: #e2bb00;
      border: none;
      width: 100%;
      height: 50px;
      border-radius: 10px;
      margin-top: 10px;
      font-family: 'Urbanist', 'Open Sans', Arial;
      font-size: 18px;
      cursor: pointer;
      color: black;
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
    }

    .cont:hover {
      background: #FFD500;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(201,149,42,0.3);
    }

    .cont:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .back {
      width: 100%;
      border: 1px solid var(--back-border);
      border-radius: 10px;
      background-color: var(--bg);
      color: var(--back-color);
      margin-top: 10px;
      height: 50px;
      align-items: center;
      text-align: center;
      display: flex;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
    }

    .back:hover {
      color: var(--back-hover-color);
      border: 1px solid var(--back-hover-color);
    }

    .option {
      font-family: 'Open Sans', sans-serif;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background: var(--card-bg);
      cursor: pointer;
      margin-bottom: 10px;
      flex-direction: column;
      flex: 1;
      transition: border-color 0.18s, background 0.18s;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      color: var(--card-title);
      text-align: center;
    }

    .option:hover {
      border-color: var(--card-hover-border);
      background: var(--card-hover-bg);
    }

    .option.selected {
      background: var(--card-selected-bg);
      border-color: #e2bb00;
    }

    .container {
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    #card-grid {
      transition: transform 0.15s;
    }

    #card-grid.shake {
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-6px); }
      50%  { transform: translateX(6px); }
      75%  { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    a:link { text-decoration: none; color: inherit; }
    a:visited { text-decoration: none; color: inherit; }

    /* fade-in on load */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .div2 {
      animation: fadeIn 0.6s ease both;
    }

    .container {
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    .container:nth-child(1) { animation-delay: 0.1s; }
    .container:nth-child(2) { animation-delay: 0.25s; }
    .container:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>

  <body>
    <button id="theme-toggle" aria-label="Toggle light/dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="4.5"></circle>
        <line x1="12" y1="1.5" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22.5"></line>
        <line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>
        <line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>
        <line x1="1.5" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22.5" y2="12"></line>
        <line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>
        <line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"></path>
      </svg>
    </button>

    <div class="div1">
      <div class="div2">
        <div class="progress-bar">
          <div class="progress-step" style="background: var(--progress-done);"></div>
          <div class="progress-step" style="background: var(--progress-done);"></div>
          <div class="progress-step" style="background: #e2bb00;"></div>
        </div>

        <p class="p1">Step 3 of 3 · Origin</p>
        <h1>How did you get here?</h1>
        <p class="p2">Your origin is your backstory. The world already has opinions.</p>

        <div id="card-grid">
          <div class="container">
            <div class="option" data-value="viral-moment">
              <span class="icon">⚡</span>
              <span class="title">Viral Moment</span>
            </div>
            <div class="option" data-value="industry-plant">
              <span class="icon">🏢</span>
              <span class="title">Industry Plant</span>
            </div>
          </div>

          <div class="container">
            <div class="option" data-value="underground-legend">
              <span class="icon">🌑</span>
              <span class="title">Underground Legend</span>
            </div>
            <div class="option" data-value="reality-tv">
              <span class="icon">📺</span>
              <span class="title">Reality TV</span>
            </div>
          </div>

          <div class="container">
            <div class="option" data-value="nepotism-baby">
              <span class="icon">🎀</span>
              <span class="title">Nepotism Baby</span>
            </div>
            <div class="option" data-value="self-made">
              <span class="icon">🔥</span>
              <span class="title">Self-Made</span>
            </div>
          </div>
        </div>

        <button class="cont" id="continue-btn" data-next="profile.html">Continue →</button>
        <button class="back" id="back-btn" data-prev="fame-path.html">← Back</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/options.js"></script>
    <script>
      // if user came from the tutorial, send continue-btn to tutorial-profile.html instead of profile.html
      (function () {
        if (sessionStorage.getItem('ref') === 'tutorial') {
          const continueBtn = document.getElementById('continue-btn');
          if (continueBtn) continueBtn.setAttribute('data-next', 'tutorial-profile.html');
        }
      })();

      // called by options.js right before it navigates to the next page
      window.onContinueSave = async function (selectedValue) {
        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();

        if (userError || !user) {
          console.error('No logged in user:', userError);
          window.location.href = 'login.html';
          return false;
        }

        const { error } = await supabaseClient
          .from('profiles')
          .upsert({
            id: user.id,
            username: user.user_metadata?.username || user.email?.split('@')[0],
            origin: selectedValue
          });

        if (error) {
          console.error('Error saving:', error);
          return false;
        }

        return true;
      };
    </script>
  </body>
</html>

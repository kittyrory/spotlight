<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Following</title>
    <script>
      (function () {
        var saved = localStorage.getItem("spotlight-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
    <style>
      :root, [data-theme="dark"] {
      --rel-lover: #c14f79;
      }

      [data-theme="light"] {
      --rel-lover: #b34a70;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        padding: 40px 20px 80px;
      }

      .page {
        max-width: 640px;
        margin: 0 auto;
      }

      #theme-toggle {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 20;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--toggle-border);
        border-radius: 50%;
        background: transparent;
        color: var(--ink);
        font-size: 1.1rem;
        cursor: pointer;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
        position: relative;
      }

      .beam {
        position: absolute;
        top: -140px;
        left: 50%;
        transform: translateX(-50%);
        width: 460px;
        height: 320px;
        background: radial-gradient(
          circle at 50% 30%,
          rgba(201, 162, 75, 0.28),
          rgba(201, 162, 75, 0.06) 45%,
          transparent 70%
        );
        pointer-events: none;
      }

      .title {
        font-size: 32px;
        font-weight: 600;
        color: var(--ink);
        position: relative;
        z-index: 1;
      }

      .filter-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 2px 28px;
        scrollbar-width: none;
      }
      .filter-row::-webkit-scrollbar {
        display: none;
      }

      .filter-chip {
        flex-shrink: 0;
        padding: 7px 15px;
        border-radius: 100px;
        border: 1px solid var(--divider);
        font-size: 12px;
        color: var(--ink-dim);
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }
      .filter-chip.active {
        border-color: var(--gold);
        color: var(--gold-bright);
        background: rgba(201, 162, 75, 0.1);
      }

      /* --- rows (rectangles) instead of grid boxes --- */
      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 14px 18px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45);
      }

      .avatar {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        flex-shrink: 0;
        background: linear-gradient(160deg, #2b2620, #100f0d);
        border: 2px solid var(--card-accent, var(--gold));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
        font-weight: 600;
        color: var(--card-accent, var(--gold-bright));
      }

      .card-body {
        flex: 1;
        min-width: 0;
      }

      .card-top-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .name-block {
        min-width: 0;
      }

      .char-name {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.15;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .char-handle {
        font-size: 11.5px;
        color: var(--ink-dim);
        margin-top: 1px;
      }

      .rel-badge {
        flex-shrink: 0;
        padding: 4px 11px;
        border-radius: 100px;
        font-size: 10px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        font-weight: 700;
        color: #fff;
        background: var(--card-accent, var(--gold));
      }

      .activity-line {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.4;
      }
      .xp {
        font-weight: 700;
        margin-right: 5px;
      }
      .xp.up {
        color: #2e8b57;
      }
      .xp.down {
        color: var(--red);
      }
      .activity-text {
        color: var(--ink-dim);
      }

      /* --- diverging (center-anchored) bond meter --- */
      .meter-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
        margin-bottom: 4px;
      }
      .meter-label {
        font-size: 10px;
        color: var(--ink-dim);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .meter-value {
        font-size: 11px;
        font-weight: 700;
      }
      .meter-value.pos {
        color: #2e8b57;
      }
      .meter-value.neg {
        color: var(--red);
      }

      .meter-track {
        position: relative;
        width: 100%;
        height: 7px;
        border-radius: 100px;
        background: var(--track-bg);
        overflow: visible;
      }

      .meter-center {
        position: absolute;
        top: -3px;
        left: 50%;
        width: 2px;
        height: 13px;
        background: var(--divider);
        transform: translateX(-50%);
        border-radius: 2px;
      }

      .meter-fill {
        position: absolute;
        top: 0;
        height: 100%;
        background: var(--card-accent, var(--gold));
        border-radius: 100px;
      }

      footer {
        text-align: center;
        margin-top: 40px;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--ink-dim);
      }
      footer span {
        color: var(--gold);
      }
    </style>
  </head>
  <body class="page-minimal">
    <div class="page">
      <div class="header">
        <div class="beam"></div>
        <div class="title">Following</div>
      </div>

      <div class="filter-row">
        <div class="filter-chip active">All</div>
        <div class="filter-chip">Acquaintance</div>
        <div class="filter-chip">Friend</div>
        <div class="filter-chip">Close Friend</div>
        <div class="filter-chip">Rival</div>
        <div class="filter-chip">Enemy</div>
        <div class="filter-chip">Lover</div>
      </div>

      <div class="list" id="list"></div>

      <footer>Curtain · <span>Backstage</span> Roster</footer>
    </div>

    <script>
    function clickfilters () {
    const filterChips = document.querySelectorAll(".filter-chip");
    filterChips.forEach(chip => {
    chip.addEventListener("click", function() {
      filterChips.forEach(c => c.classList.remove("active"));
      this.classList.add("active");
      
      const filter = this.textContent.trim();
      renderList(filter);
    });
  });
}
clickfilters();

      
      /*check BE for relationship status between user and bot. If no relationship exists, 
      return null. If relationship exists, return the relationship record.
      if there's no relationship, then create a new relationship display in FE.
      if relationship already exists, then check if relationship points are above threshold.
      if relationship points are above threshold, then update relationship status.
      write function to lock number of relationship points to a maximum of 5.
      */

      //checks BE table for relationship status between user and bot. If no relationship exists, returns null. If relationship exists, returns the relationship record.
  async function checkRelationshipStatus(currentUser, botUserId) {
  try {
  const { data, error } = await supabaseClient
    .from("user-relationships")
    .select("*")
    .eq("player_id", currentUser.id)
    .eq("bot_user_id", botUserId)
    .single();
    console.log("checkRelationshipStatus response:", data);
    if (error) {
    console.error("Error checking relationship status:", error);
    return null;
    }

    return data; // Returns the relationship record if it exists
    } catch (err) {
    console.error("Unexpected error checking relationship status:", err);
    return null;
      }
    }
      
//create new relationship record in FE if in BE and not already in FE

    function createRelationshipCard(relationshipData, listEl) {
    const card = document.createElement("div");
    card.className = "card";
    const bond = relationshipData.affinity_score || 0;
    const isPos = bond >= 0;
    const magnitude = Math.min(Math.abs(bond), 100);
    const fillWidth = magnitude / 2;
    const fillLeft = isPos ? 50 : 50 - fillWidth;

  card.innerHTML = `
          <div class="meter-track">
            <div class="meter-fill" style="width: ${fillWidth}%; left: ${fillLeft}%;"></div>
          </div>
        `;
        listEl.appendChild(card);
      }

  function animateRelationshipUpdate(card, newBond, threshold = 0) {
  if (newBond > threshold) { 
  const isPos = newBond >= 0;
  const magnitude = Math.min(Math.abs(newBond), 100);
  const fillWidth = magnitude / 2;
  const fillLeft = isPos ? 50 : 50 - fillWidth;

  const meterFill = card.querySelector(".meter-fill");
  meterFill.style.transition = "width 0.5s ease, left 0.5s ease";
  meterFill.style.width = `${fillWidth}%`;
  meterFill.style.left = `${fillLeft}%`;
   }
  }

  function lockNumberOfRelationships (createRelationshipCard) {
      const maxPoints = 5;
      return Math.min(relationshipPoints, maxPoints)
      lockNumberOfRelationships(createRelationshipCard);
    }

    </script>
    <script src="scripts/theme.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight | Where Fame Lives</title>
    <script>
      // apply saved theme immediately to avoid a flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem("spotlight-theme");
        if (saved) document.documentElement.setAttribute("data-theme", saved);
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
    <style>
      :root, [data-theme="dark"] {
      --ticker-border: rgba(255, 255, 255, 0.08);
      --index-bg: var(--black);
      }

      [data-theme="light"] {
      --ticker---goldborder: rgba(0, 0, 0, 0.1);
      --index-bg: var(--white);
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        background-color: var(--index-bg);
        transition: background-color 0.25s ease;
      }

      /* ── Tickers ── */
      .ticker-wrap {
        position: fixed;
        width: 100%;
        overflow: hidden;
        padding: 8px 0;
        z-index: 10;
      }

      .ticker-wrap.top {
        top: 0;
        border-bottom: 1px solid var(--ticker-border);
      }

      .ticker-wrap.bottom {
        bottom: 0;
        border-top: 1px solid var(--ticker-border);
      }

      .ticker {
        display: flex;
        white-space: nowrap;
        animation: scroll-left 30s linear infinite;
      }

      .ticker.reverse {
        animation: scroll-right 35s linear infinite;
      }

      .ticker-item {
        font-size: clamp(0.65rem, 0.9vw, 0.78rem);
        letter-spacing: 0.1em;
        padding: 0 1.2rem;
        color: var(--muted);
      }

      .ticker-item.gold {
        color: var(--gold);
        opacity: 0.85;
      }

      @keyframes scroll-left {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      @keyframes scroll-right {
        0% {
          transform: translateX(-50%);
        }
        100% {
          transform: translateX(0);
        }
      }

      /* ── Hero content ── */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(6px, 1.5vw, 14px);
        text-align: center;
        padding: 0 1rem;
      }

      h2 {
        font-size: clamp(0.55rem, 0.8vw, 0.65rem);
        font-weight: 300;
        letter-spacing: 0.6em;
        color: var(--gold);
        opacity: 0.85;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(3.5rem, 10vw, 6rem);
         color: var(--ink);
        line-height: 1;
      }

      h1 span {
        color: var(--gold);
        text-shadow:
          0 0 8px var(--glow-1),
          0 0 22px var(--glow-2),
          0 0 40px var(--glow-3);
      }

      p {
        font-size: clamp(0.6rem, 0.85vw, 0.7rem);
        font-weight: 300;
        letter-spacing: 0.35em;
        color: var(--body-text);
        text-transform: uppercase;
        animation: pulse-glow 8s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%,
        100% {
          text-shadow: 0 0 4px var(--pulse-base);
        }
        50% {
          text-shadow:
            0 0 8px var(--pulse-1),
            0 0 18px var(--pulse-2);
        }
      }

      .glow-button {
        display: inline-block;
        margin-top: clamp(16px, 3vw, 32px);
        padding: clamp(12px, 1.5vw, 16px) clamp(24px, 3vw, 30px);
        cursor: pointer;
        border-radius: 100px;
        background-color: transparent;
        border: 1.5px solid var(--button-border);
        font-weight: 700;
        font-size: clamp(0.65rem, 0.9vw, 0.75rem);
        text-transform: uppercase;
        letter-spacing: 0.12em;
         color: var(--ink);
        text-decoration: none;
        transition:
          background-color 0.25s ease,
          color 0.25s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease;
      }

      .glow-button:hover {
        background-color: var(--gold);
         color: var(--black);
        border-color: var(--gold);
        box-shadow:
          0 0 10px var(--hover-shadow-1),
          0 0 28px var(--hover-shadow-2);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      #theme-toggle {
        position: fixed;
        top: clamp(46px, 6vh, 60px);
        left: clamp(16px, 3vw, 32px);
        z-index: 20;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1.5px solid var(--toggle-border);
        background-color: transparent;
        color: var(--ink);
        font-size: 1.1rem;
        cursor: pointer;
        transition:
          border-color 0.25s ease,
          box-shadow 0.25s ease,
          transform 0.15s ease;
      }

      #theme-toggle:hover {
        border-color: var(--gold);
        box-shadow: 0 0 12px var(--toggle-hover-shadow);
      }

      #theme-toggle:active {
        transform: scale(0.92);
      }

      #theme-toggle svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      [data-theme="dark"] #theme-toggle .icon-moon,
      [data-theme="light"] #theme-toggle .icon-sun {
        display: none;
      }

      [data-theme="light"] h1,
      [data-theme="light"] .glow-button {
        color: #1e1e1e !important;
      }

      [data-theme="light"] .glow-button:hover {
        color: #1e1e1e !important;
      }
    </style>
  </head>
  <body class="page-maximal">
    <button id="theme-toggle" aria-label="Toggle light/dark mode">
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="12" cy="12" r="4.5"></circle>
        <line x1="12" y1="1.5" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22.5"></line>
        <line x1="4.2" y1="4.2" x2="5.9" y2="5.9"></line>
        <line x1="18.1" y1="18.1" x2="19.8" y2="19.8"></line>
        <line x1="1.5" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22.5" y2="12"></line>
        <line x1="4.2" y1="19.8" x2="5.9" y2="18.1"></line>
        <line x1="18.1" y1="5.9" x2="19.8" y2="4.2"></line>
      </svg>
      <svg
        class="icon-moon"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"></path>
      </svg>
    </button>

    <div class="ticker-wrap top">
      <div class="ticker" id="t1"></div>
    </div>

    <div class="hero">
      <h2>A New Era Begins</h2>
      <h1>SPOT<span>LIGHT</span></h1>
      <p><span>Where Fame Lives</span></p>
      <a href="login.html" class="glow-button">Enter the Spotlight</a>
    </div>

    <div class="ticker-wrap bottom">
      <div class="ticker reverse" id="t2"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/supabase.js"></script>
    <script src="scripts/theme.js"></script>

    <script>
      const names = [
        "BEYONCÉ",
        "TAYLOR SWIFT",
        "BAD BUNNY",
        "PEDRO PASCAL",
        "NICKI MINAJ",
        "GOJO",
        "NARUTO",
        "SABRINA CARPENTER",
        "LIZZO",
        "BILLIE EILISH",
        "CHAEWON",
        "BLACKPINK",
        "BTS",
        "ARIANA GRANDE",
        "KENDRICK LAMAR",
      ];
      const tags = [
        "#SPOTLIGHT",
        "#NOCONTEXT",
        "#ARMY",
        "#CRAZY",
        "#PROBLEMATIC",
        "#SCANDAL",
        "#DRAMA",
        "#TRENDING",
        "#FANWAR",
        "#CANCELLED",
        "#VIRAL",
        "#CHAOS",
        "#FEUDS",
        "#ICONS",
        "#FANDOMS",
        "#LOVE",
        "#SHIP",
        "#TEA",
      ];

      function buildTicker(el, items, goldEvery = 3) {
        const repeated = [...items, ...items, ...items, ...items];
        repeated.forEach((txt, i) => {
          const span = document.createElement("span");
          span.className = "ticker-item" + (i % goldEvery === 1 ? " gold" : "");
          span.textContent = txt + " · ";
          el.appendChild(span);
        });
      }

      buildTicker(document.getElementById("t1"), names, 2);
      buildTicker(document.getElementById("t2"), tags, 2);
    </script>
  </body>
</html>
